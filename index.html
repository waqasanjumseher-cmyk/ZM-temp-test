          <Field label="Payment Date" ur="تاریخ"><TextInput type="date" value={payDate} onChange={e => setPayDate(e.target.value)} /></Field>
          <Field label="Pay From Account" ur="اکاؤنٹ"><Select value={payAccount} onChange={e => setPayAccount(e.target.value)} options={data.accounts.map(a => ({ value: a.id, label: a.name }))} /></Field>
          <Field label="Note" ur="نوٹ"><TextInput value={payNote} onChange={e => setPayNote(e.target.value)} /></Field>
          <div className="flex justify-end gap-2 mt-4">
            <button onClick={() => { setPayingStaff(null); setEditingPayId(null); }} className="px-4 py-2 text-sm rounded-lg border border-slate-300 text-slate-600">Cancel</button>
            <button onClick={recordSalary} className="px-4 py-2 text-sm rounded-lg bg-[var(--accent-600)] text-[var(--button-text)] hover:bg-[var(--accent-700)]">{editingPayId ? "Update Payment" : "Save Payment"}</button>
          </div>
        </Modal>
      )}
      {historyStaff && (
        <Modal title={"Payment History: " + historyStaff.name} ur="ادائیگی کی تاریخ" onClose={() => setHistoryStaff(null)}>
          <table className="w-full text-sm">
            <thead className="bg-slate-50 text-slate-500 uppercase text-xs"><tr><th className="text-left px-2 py-1">Date</th><th className="text-left px-2 py-1">Type</th><th className="text-left px-2 py-1">Amount</th><th className="text-left px-2 py-1"></th></tr></thead>
            <tbody>
              {data.salaryPayments.filter(p => p.staffId === historyStaff.id).sort((a, b) => (b.date || "").localeCompare(a.date || "")).map(p => (
                <tr key={p.id} className="border-t border-slate-100">
                  <td className="px-2 py-1">{fmtDate(p.date)}</td><td className="px-2 py-1">{p.type}</td><td className="px-2 py-1">{fmtMoney(p.amount)}</td>
                  <td className="px-2 py-1 text-right">
                    {canEdit && <button onClick={() => openEditPay(historyStaff, p)} className="text-slate-500 hover:text-[var(--accent-600)] mr-2">&#9998;</button>}

                  </td>
                </tr>
              ))}

        </Modal>
      )}
      {deletingPay && (
        <Modal title="Delete Payment?" onClose={() => setDeletingPay(null)}>
          <p className="text-sm text-slate-600">Delete this {deletingPay.type} of {fmtMoney(deletingPay.amount)}?</p>

        </Modal>
      )}
    </div>
  );
}

/* ============================ EXPENSES TAB ============================ */
function blankExpense() { return { category: "Rent", amount: "", date: todayISO(), accountId: "", note: "" }; }
function ExpensesTab({ data, setData, can }) {
  const canAdd = can("add"), canEdit = can("edit"), canDelete = can("delete");
  const [showForm, setShowForm] = useState(false);
  const [editing, setEditing] = useState(null);
  const [expense, setExpense] = useState({ ...blankExpense(), accountId: (data.accounts[0] && data.accounts[0].id) || "" });
  const [filterCat, setFilterCat] = useState("");
  const [fromDate, setFromDate] = useState("");
  const [toDate, setToDate] = useState("");
  const [deleting, setDeleting] = useState(null);

  function openAdd() { setEditing(null); setExpense({ ...blankExpense(), accountId: (data.accounts[0] && data.accounts[0].id) || "" }); setShowForm(true); }
  function openEdit(e) { setEditing(e.id); setExpense(e); setShowForm(true); }
  function submit() {
    if (!expense.amount || Number(expense.amount) <= 0) { alert("Enter a valid amount"); return; }
    if (editing) setData({ ...data, expenses: data.expenses.map(e => e.id === editing ? { ...expense, id: editing } : e) });
    else setData({ ...data, expenses: [...data.expenses, { ...expense, id: uid("exp") }] });
    setShowForm(false); setEditing(null);
  }
  function doDelete() { setData({ ...data, expenses: data.expenses.filter(e => e.id !== deleting.id) }); setDeleting(null); }

  const filtered = useMemo(() => {
    return data.expenses.filter(e => {
      if (filterCat && e.category !== filterCat) return false;
      if (fromDate && e.date < fromDate) return false;
      if (toDate && e.date > toDate) return false;
      return true;
    }).sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  }, [data.expenses, filterCat, fromDate, toDate]);

  const categoryTotals = useMemo(() => {
    const map = {};
    filtered.forEach(e => { map[e.category] = (map[e.category] || 0) + (Number(e.amount) || 0); });
    return map;
  }, [filtered]);
  const grandTotal = filtered.reduce((s, e) => s + (Number(e.amount) || 0), 0);

  return (
    <div>
      <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
        <h2 className="text-lg font-semibold text-slate-800"><Bi en="Shop Expenses" ur="شاپ اخراجات" /></h2>
        {canAdd && <button onClick={openAdd} className="bg-[var(--accent-600)] hover:bg-[var(--accent-700)] text-[var(--button-text)] text-sm font-medium px-4 py-2 rounded-lg">+ Log Expense</button>}
      </div>
      <div className="flex flex-wrap gap-2 mb-4">
        <Select value={filterCat} onChange={e => setFilterCat(e.target.value)} options={[{ value: "", label: "All Categories" }, ...EXPENSE_CATEGORIES]} className="max-w-[180px]" />
        <TextInput type="date" value={fromDate} onChange={e => setFromDate(e.target.value)} className="max-w-[160px]" />
        <TextInput type="date" value={toDate} onChange={e => setToDate(e.target.value)} className="max-w-[160px]" />
      </div>
      <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
        {Object.keys(categoryTotals).map(cat => <Card key={cat} label={cat} value={fmtMoney(categoryTotals[cat])} />)}
        <Card label="Grand Total" value={fmtMoney(grandTotal)} accent="text-rose-600" />
      </div>
      <div className="bg-white rounded-xl border border-slate-200 overflow-x-auto">
        <table className="w-full text-sm">
          <thead className="bg-slate-50 text-slate-500 uppercase text-xs"><tr><th className="text-left px-3 py-2">Date</th><th className="text-left px-3 py-2">Category</th><th className="text-left px-3 py-2">Amount</th><th className="text-left px-3 py-2">Account</th><th className="text-left px-3 py-2">Note</th><th className="text-left px-3 py-2"></th></tr></thead>
          <tbody>
            {filtered.map(e => (
              <tr key={e.id} className="border-t border-slate-100 hover:bg-slate-50">
                <td className="px-3 py-2">{fmtDate(e.date)}</td><td className="px-3 py-2">{e.category}</td><td className="px-3 py-2">{fmtMoney(e.amount)}</td>
                <td className="px-3 py-2">{data.accounts.find(a => a.id === e.accountId)?.name || "-"}</td><td className="px-3 py-2">{e.note || "-"}</td>
                <td className="px-3 py-2">
                  <div className="flex gap-2">
                    {canEdit && <button onClick={() => openEdit(e)} title="Edit" className="text-slate-500 hover:text-[var(--accent-600)]">&#9998;</button>}
                    {canDelete && <button onClick={() => setDeleting(e)} title="Delete" className="text-slate-500 hover:text-rose-600">&#128465;</button>}
                  </div>
                </td>
              </tr>
            ))}
            {filtered.length === 0 && <tr><td colSpan="6" className="text-center text-slate-400 py-8">No expenses logged</td></tr>}
          </tbody>
        </table>
      </div>

      {showForm && (
        <Modal title={editing ? "Edit Expense" : "Log Expense"} ur="خرچہ" onClose={() => { setShowForm(false); setEditing(null); }}>
          <Field label="Category" ur="قسم"><Select value={expense.category} onChange={e => setExpense({ ...expense, category: e.target.value })} options={EXPENSE_CATEGORIES} /></Field>
          <Field label="Amount" ur="رقم" required><TextInput type="number" value={expense.amount} onChange={e => setExpense({ ...expense, amount: e.target.value })} /></Field>
          <Field label="Date" ur="تاریخ"><TextInput type="date" value={expense.date} onChange={e => setExpense({ ...expense, date: e.target.value })} /></Field>
          <Field label="Paid From Account" ur="اکاؤنٹ"><Select value={expense.accountId} onChange={e => setExpense({ ...expense, accountId: e.target.value })} options={data.accounts.map(a => ({ value: a.id, label: a.name }))} /></Field>
          <Field label="Note" ur="نوٹ"><TextInput value={expense.note} onChange={e => setExpense({ ...expense, note: e.target.value })} /></Field>
          <div className="flex justify-end gap-2 mt-4">
            <button onClick={() => { setShowForm(false); setEditing(null); }} className="px-4 py-2 text-sm rounded-lg border border-slate-300 text-slate-600">Cancel</button>
            <button onClick={submit} className="px-4 py-2 text-sm rounded-lg bg-[var(--accent-600)] text-[var(--button-text)] hover:bg-[var(--accent-700)]">{editing ? "Update" : "Save"}</button>
          </div>
        </Modal>
      )}
      {deleting && (
        <Modal title="Delete Expense?" onClose={() => setDeleting(null)}>
          <p className="text-sm text-slate-600">Delete this {deleting.category} expense of {fmtMoney(deleting.amount)}?</p>
          <ConfirmBar onCancel={() => setDeleting(null)} onConfirm={doDelete} />
        </Modal>
      )}
    </div>
  );
}

/* ============================ SHOP OPERATIONS TAB (Phase 3) ============================
   Four advanced, less-frequent workflows grouped under one tab with horizontal pill sub-nav
   (same pattern as Business Settings / Backup & Export):
     1. Return to Dealer      — defective stock back to a supplier; adjusts inventory + dealer ledger.
     2. Customer Sale Return  — product return; restocks inventory + adjusts customer ledger/cash.
     3. Used Mobile Buyback   — re-purchase a used phone from a customer; adds it back as live stock.
     4. Day-End Cash Summary  — cash sales + ledger collections − expenses = expected drawer balance.
   All four share one CRUD permission set (the "operations" module in the permission matrix), same
   as every other single-purpose tab in this app (Expenses, Partners, etc). ---- */
const OPERATIONS_SECTIONS = [
  { id: "dealerreturn", label: "Return to Dealer", ur: "ڈیلر کو واپسی", icon: "\u21A9" },
  { id: "salereturn", label: "Sale Return", ur: "فروخت واپسی", icon: "\u267B" },
  { id: "buyback", label: "Buyback / Trade-In", ur: "پرانا موبائل خریداری", icon: "\u{1F4F1}" },
  { id: "dayend", label: "Day-End Cash Summary", ur: "روزانہ کیش خلاصہ", icon: "\u{1F4CA}" },
];
function blankDealerReturnForm(data) { return { dealerId: "", itemIds: [], reason: DEALER_RETURN_REASONS[0], settlement: "ledger", accountId: (data.accounts[0] && data.accounts[0].id) || "", note: "", date: todayISO(), amountOverride: "" }; }
function blankSaleReturnForm(data) { return { saleId: "", itemIds: [], reason: SALE_RETURN_REASONS[0], condition: "resalable", refundMethod: "ledger", accountId: (data.accounts[0] && data.accounts[0].id) || "", note: "", date: todayISO(), amountOverride: "" }; }
function blankBuybackForm(data) {
  return {
    customerId: "", sellerName: "", sellerPhone: "", sellerCnic: "",
    itemName: "", brand: "", model: "", category: "Mobile", imei1: "", imei2: "", ram: "", storage: "", color: "", specs: "",
    conditionGrade: BUYBACK_CONDITIONS[0], accessories: { box: false, charger: false, cable: false, warranty: false }, conditionPhoto: "",
    agreedPrice: "", retailPrice: "", minPrice: "", accountId: (data.accounts[0] && data.accounts[0].id) || "", note: "", date: todayISO(),
  };
}
function OperationsTab({ data, setData, role, biz, currentUserName, can }) {

  const [section, setSection] = useState("dealerreturn");
  return (
    <div>
      <h2 className="text-lg font-semibold text-slate-800 mb-4"><Bi en="Shop Operations" ur="شاپ آپریشنز" /></h2>

          <button key={s.id} onClick={() => setSection(s.id)}
            className={"flex items-center gap-1.5 px-3 py-2 rounded-full text-xs sm:text-sm font-medium transition-all " + (section === s.id ? "bg-gradient-to-r from-[var(--accent-600)] to-[var(--accent-500)] text-[var(--button-text)] shadow-md shadow-[var(--accent-900)]/20" : "bg-slate-100 text-slate-600 hover:bg-slate-200")}>

        ))}

      {section === "salereturn" && <SaleReturnSection data={data} setData={setData} canAdd={canAdd} canDelete={canDelete} currentUserName={currentUserName} />}
      {section === "buyback" && <BuybackSection data={data} setData={setData} canAdd={canAdd} canDelete={canDelete} currentUserName={currentUserName} />}

    </div>
  );
}

/* ---------- 1. Return to Dealer ---------- */
function DealerReturnSection({ data, setData, canAdd, canDelete, currentUserName }) {
  const [form, setForm] = useState(() => blankDealerReturnForm(data));
  const [deleting, setDeleting] = useState(null);
  const dealer = data.dealers.find(d => d.id === form.dealerId);
  const candidateItems = useMemo(() => data.inventory.filter(i => i.dealerId === form.dealerId && i.status !== "Sold" && i.status !== "Returned to Dealer"), [data.inventory, form.dealerId]);
  const computedAmount = useMemo(() => candidateItems.filter(i => form.itemIds.includes(i.id)).reduce((s, i) => s + (Number(i.purchasePrice) || 0), 0), [candidateItems, form.itemIds]);
  const finalAmount = form.amountOverride !== "" ? Number(form.amountOverride) || 0 : computedAmount;

  function toggleItem(id) { setForm({ ...form, itemIds: form.itemIds.includes(id) ? form.itemIds.filter(x => x !== id) : [...form.itemIds, id] }); }
  function submit() {
    if (!form.dealerId) { alert("Select a dealer"); return; }
    if (form.itemIds.length === 0) { alert("Select at least one item to return"); return; }
    if (form.settlement === "cash" && !form.accountId) { alert("Select an account to receive the cash refund into"); return; }
    const items = candidateItems.filter(i => form.itemIds.includes(i.id)).map(i => ({ id: i.id, itemName: i.itemName, imei1: i.imei1 || "", purchasePrice: Number(i.purchasePrice) || 0 }));
    const entry = { id: uid("dret"), dealerId: form.dealerId, itemIds: form.itemIds, items, totalAmount: finalAmount, reason: form.reason, settlement: form.settlement, accountId: form.settlement === "cash" ? form.accountId : "", note: form.note, date: form.date, createdBy: currentUserName || "" };
    setData({ ...data, dealerReturns: [...(data.dealerReturns || []), entry], inventory: data.inventory.map(i => form.itemIds.includes(i.id) ? { ...i, status: "Returned to Dealer" } : i) });
    setForm(blankDealerReturnForm(data));
  }
  function undoReturn(r) {
    setData({ ...data, dealerReturns: (data.dealerReturns || []).filter(x => x.id !== r.id), inventory: data.inventory.map(i => r.itemIds.includes(i.id) ? { ...i, status: "Available" } : i) });
    setDeleting(null);
  }
  const history = [...(data.dealerReturns || [])].sort((a, b) => (b.date || "").localeCompare(a.date || ""));

  return (
    <div>
      <p className="text-xs text-slate-500 mb-4">Send defective/unwanted stock back to a dealer. Selected items are pulled out of sellable inventory and the dealer's balance (or your cash account, for a cash refund) is adjusted automatically.</p>
      {canAdd && (
        <div className="bg-white rounded-xl border border-slate-200 p-4 mb-6">

/* ---------- 2. Customer Sale Return ---------- */
function SaleReturnSection({ data, setData, canAdd, canDelete, currentUserName }) {
  const [form, setForm] = useState(() => blankSaleReturnForm(data));
  const [deleting, setDeleting] = useState(null);
  const sale = data.sales.find(s => s.id === form.saleId);
  const alreadyReturnedIds = useMemo(() => new Set((data.saleReturns || []).flatMap(r => r.itemIds || [])), [data.saleReturns]);
  const returnableUnits = useMemo(() => {
    if (!sale) return [];
    const out = [];
    saleLines(sale).forEach(l => {
      (l.itemIds && l.itemIds.length ? l.itemIds : (l.itemId ? [l.itemId] : [])).forEach(id => {
        if (alreadyReturnedIds.has(id)) return;
        const item = data.inventory.find(i => i.id === id);
        out.push({ id, unitPrice: Number(l.unitPrice) || 0, item });
      });
    });
    return out;
  }, [sale, alreadyReturnedIds, data.inventory]);
  const computedAmount = useMemo(() => returnableUnits.filter(u => form.itemIds.includes(u.id)).reduce((s, u) => s + u.unitPrice, 0), [returnableUnits, form.itemIds]);
  const finalAmount = form.amountOverride !== "" ? Number(form.amountOverride) || 0 : computedAmount;
  const customer = sale ? data.customers.find(c => c.id === sale.customerId) : null;

  function toggleItem(id) { setForm({ ...form, itemIds: form.itemIds.includes(id) ? form.itemIds.filter(x => x !== id) : [...form.itemIds, id] }); }
  function submit() {
    if (!form.saleId) { alert("Select a sale/invoice"); return; }
    if (form.itemIds.length === 0) { alert("Select at least one item to return"); return; }
    if (form.refundMethod === "cash" && !form.accountId) { alert("Select an account to pay the refund from"); return; }
    const items = returnableUnits.filter(u => form.itemIds.includes(u.id)).map(u => ({ id: u.id, itemName: u.item ? u.item.itemName : "(deleted item)", imei1: u.item ? (u.item.imei1 || "") : "", unitPrice: u.unitPrice }));
    const entry = { id: uid("sret"), saleId: form.saleId, customerId: sale.customerId, itemIds: form.itemIds, items, totalAmount: finalAmount, condition: form.condition, reason: form.reason, refundMethod: form.refundMethod, accountId: form.refundMethod === "cash" ? form.accountId : "", note: form.note, date: form.date, createdBy: currentUserName || "" };
    const newStatus = form.condition === "resalable" ? "Available" : "In-Repair";
    setData({ ...data, saleReturns: [...(data.saleReturns || []), entry], inventory: data.inventory.map(i => form.itemIds.includes(i.id) ? { ...i, status: newStatus } : i) });
    setForm(blankSaleReturnForm(data));
  }
  function undoReturn(r) {
    setData({ ...data, saleReturns: (data.saleReturns || []).filter(x => x.id !== r.id), inventory: data.inventory.map(i => r.itemIds.includes(i.id) ? { ...i, status: "Sold" } : i) });
    setDeleting(null);
  }
  const history = [...(data.saleReturns || [])].sort((a, b) => (b.date || "").localeCompare(a.date || ""));

  return (
    <div>
      <p className="text-xs text-slate-500 mb-4">Return item(s) from a completed sale. Resalable units go straight back into Available stock; damaged units go to In-Repair instead. The customer's balance or your cash account is adjusted automatically.</p>
      {canAdd && (
        <div className="bg-white rounded-xl border border-slate-200 p-4 mb-6">
          <h3 className="text-sm font-semibold text-slate-700 mb-3">New Sale Return / نئی فروخت واپسی</h3>
          <Field label="Sale / Invoice" ur="فروخت" required>
            <FilterSelect items={data.sales} value={form.saleId} onChange={e => setForm({ ...form, saleId: e.target.value, itemIds: [] })}
              getLabel={s => (s.invoiceId ? "Invoice " + s.invoiceId : s.id) + " — " + ((data.customers.find(c => c.id === s.customerId) || {}).name || "Walk-in") + " — " + fmtMoney(s.salePrice) + " — " + fmtDate(s.date)}
              getSearchText={s => (s.invoiceId || "") + " " + ((data.customers.find(c => c.id === s.customerId) || {}).name || "") + " " + saleItemsLabel(s, data)}
              placeholder="Search by invoice # or customer..." />
          </Field>
          {sale && (
            <div className="mt-3">
              <span className="text-sm font-medium text-slate-700">Items in This Sale / اس فروخت کی اشیاء</span>
              <div className="mt-1 border border-slate-200 rounded-lg max-h-56 overflow-y-auto divide-y divide-slate-100">
                {returnableUnits.map(u => (
                  <label key={u.id} className="flex items-center gap-2 px-3 py-2 text-sm hover:bg-slate-50 cursor-pointer">
                    <input type="checkbox" checked={form.itemIds.includes(u.id)} onChange={() => toggleItem(u.id)} />
                    <span className="flex-1">{u.item ? u.item.itemName : "(deleted item)"} {u.item && u.item.imei1 ? "· " + u.item.imei1 : ""}</span>
                    <span className="text-slate-500">{fmtMoney(u.unitPrice)}</span>
                  </label>
                ))}
                {returnableUnits.length === 0 && <div className="text-center text-slate-400 py-4 text-sm">All items from this sale have already been returned</div>}
              </div>
            </div>
          )}
          <div className="grid grid-cols-1 md:grid-cols-2 gap-3 mt-3">
            <Field label="Reason" ur="وجہ"><Select value={form.reason} onChange={e => setForm({ ...form, reason: e.target.value })} options={SALE_RETURN_REASONS} /></Field>
            <Field label="Condition on Return" ur="حالت">
              <Select value={form.condition} onChange={e => setForm({ ...form, condition: e.target.value })} options={[{ value: "resalable", label: "Resalable — Restock as Available" }, { value: "damaged", label: "Damaged — Send to In-Repair" }]} />
            </Field>
            <Field label="Total Refund Amount" ur="کل رقم"><TextInput type="number" value={form.amountOverride !== "" ? form.amountOverride : computedAmount} onChange={e => setForm({ ...form, amountOverride: e.target.value })} /></Field>
            <Field label="Refund Method" ur="ادائیگی کا طریقہ">
              <Select value={form.refundMethod} onChange={e => setForm({ ...form, refundMethod: e.target.value })} options={[{ value: "ledger", label: "Adjust Customer Ledger (Credit)" }, { value: "cash", label: "Cash Refund to Customer" }]} />
            </Field>
            {form.refundMethod === "cash" && (
              <Field label="Pay From Account" ur="اکاؤنٹ"><Select value={form.accountId} onChange={e => setForm({ ...form, accountId: e.target.value })} options={data.accounts.map(a => ({ value: a.id, label: a.name }))} /></Field>
            )}
            <div className="md:col-span-2"><Field label="Note" ur="نوٹ"><TextInput value={form.note} onChange={e => setForm({ ...form, note: e.target.value })} placeholder="optional" /></Field></div>
          </div>
          <div className="flex justify-between items-center mt-4">
            <div className="text-sm text-slate-600">{customer && <>{customer.name} — Outstanding Balance: <b className={customerLedgerSummary(data, customer.id).totalOutstanding > 0 ? "text-rose-600" : "text-emerald-600"}>{fmtMoney(customerLedgerSummary(data, customer.id).totalOutstanding)}</b></>}</div>
            <button onClick={submit} className="bg-[var(--accent-600)] hover:bg-[var(--accent-700)] text-[var(--button-text)] text-sm font-medium px-4 py-2 rounded-lg">Save Return / محفوظ کریں</button>
          </div>
        </div>
      )}
      <div className="bg-white rounded-xl border border-slate-200 overflow-x-auto">
        <table className="w-full text-sm">
          <thead className="bg-slate-50 text-slate-500 uppercase text-xs"><tr><th className="text-left px-3 py-2">Date</th><th className="text-left px-3 py-2">Customer</th><th className="text-left px-3 py-2">Items</th><th className="text-left px-3 py-2">Condition</th><th className="text-left px-3 py-2">Refund</th><th className="text-left px-3 py-2">Amount</th><th className="text-left px-3 py-2"></th></tr></thead>
          <tbody>
            {history.map(r => {
              const c = data.customers.find(x => x.id === r.customerId);
              return (
                <tr key={r.id} className="border-t border-slate-100 hover:bg-slate-50">
                  <td className="px-3 py-2">{fmtDate(r.date)}</td>
                  <td className="px-3 py-2 font-medium text-slate-800">{c ? c.name : "(deleted customer)"}</td>
                  <td className="px-3 py-2">{r.items.map(i => i.itemName).join(", ")}</td>
                  <td className="px-3 py-2">{r.condition === "resalable" ? "Resalable" : "Damaged"}</td>
                  <td className="px-3 py-2">{r.refundMethod === "cash" ? "Cash" : "Ledger Credit"}</td>
                  <td className="px-3 py-2 font-semibold text-rose-600">{fmtMoney(r.totalAmount)}</td>
                  <td className="px-3 py-2">{canDelete && <button onClick={() => setDeleting(r)} title="Undo / Delete" className="text-slate-500 hover:text-rose-600">&#128465;</button>}</td>
                </tr>
              );
            })}
            {history.length === 0 && <tr><td colSpan="7" className="text-center text-slate-400 py-8">No sale returns yet / کوئی واپسی نہیں</td></tr>}
          </tbody>
        </table>
      </div>
      {deleting && (
        <Modal title="Undo This Return?" onClose={() => setDeleting(null)}>
          <p className="text-sm text-slate-600">This puts the returned item(s) back to "Sold" status and reverses the customer/account adjustment. Continue?</p>
          <ConfirmBar onCancel={() => setDeleting(null)} onConfirm={() => undoReturn(deleting)} />
        </Modal>
      )}
    </div>
  );
}

/* ---------- 3. Used Mobile Buyback / Trade-In ---------- */
function BuybackSection({ data, setData, canAdd, canDelete, currentUserName }) {
  const [form, setForm] = useState(() => blankBuybackForm(data));
  const [deleting, setDeleting] = useState(null);

  function submit() {
    if (!form.itemName.trim()) { alert("Enter the item name (e.g. iPhone 13)"); return; }
    if (!form.agreedPrice || Number(form.agreedPrice) <= 0) { alert("Enter a valid agreed buyback price"); return; }
    if (!form.accountId) { alert("Select an account to pay the customer from"); return; }
    if (!form.sellerName.trim() && !form.customerId) { alert("Enter the seller's name (or link an existing customer)"); return; }
    const newItem = {
      id: uid("item"), itemName: form.itemName, brand: form.brand, model: form.model, category: form.category,
      imei1: form.imei1, imei2: form.imei2, serialNumber: "", ram: form.ram, storage: form.storage, color: form.color, specs: form.specs,
      condition: "Used", accessories: form.accessories, conditionPhoto: form.conditionPhoto, dealerId: "",
      purchasePrice: Number(form.agreedPrice) || 0, retailPrice: Number(form.retailPrice) || 0, minPrice: Number(form.minPrice) || 0,
      status: "Available", dateAdded: form.date, source: "Buyback",
    };
    const entry = {
      id: uid("bb"), customerId: form.customerId || "", sellerName: form.sellerName || "", sellerPhone: form.sellerPhone || "", sellerCnic: form.sellerCnic || "",
      inventoryItemId: newItem.id, itemSnapshot: { itemName: form.itemName, brand: form.brand, model: form.model, imei1: form.imei1 },
      conditionGrade: form.conditionGrade, agreedPrice: Number(form.agreedPrice) || 0, accountId: form.accountId, note: form.note, date: form.date, createdBy: currentUserName || "",
    };
    setData({ ...data, inventory: [...data.inventory, newItem], buybacks: [...(data.buybacks || []), entry] });
    setForm(blankBuybackForm(data));
  }
  function undoBuyback(b) {
    const item = data.inventory.find(i => i.id === b.inventoryItemId);
    if (item && item.status !== "Available") { alert("This traded-in item has already been sold/moved and can no longer be undone from here."); setDeleting(null); return; }
    setData({ ...data, buybacks: (data.buybacks || []).filter(x => x.id !== b.id), inventory: data.inventory.filter(i => i.id !== b.inventoryItemId) });
    setDeleting(null);
  }
  const history = [...(data.buybacks || [])].sort((a, b) => (b.date || "").localeCompare(a.date || ""));

  return (
    <div>
      <p className="text-xs text-slate-500 mb-4">Buy a used phone (or other device) from a walk-in customer and list it back into live inventory as a "Used" condition item, priced to resell.</p>
      {canAdd && (
        <div className="bg-white rounded-xl border border-slate-200 p-4 mb-6">
          <h3 className="text-sm font-semibold text-slate-700 mb-3">New Buyback / Trade-In / نئی خریداری</h3>
          <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
            <Field label="Link Existing Customer (optional)" ur="گاہک">
              <FilterSelect items={data.customers} value={form.customerId} onChange={e => { const c = data.customers.find(x => x.id === e.target.value); setForm({ ...form, customerId: e.target.value, sellerName: c ? c.name : form.sellerName, sellerPhone: c ? c.phone : form.sellerPhone }); }} getLabel={c => c.name + (c.phone ? " (" + c.phone + ")" : "")} getSearchText={c => c.name + " " + (c.phone || "")} placeholder="Search customer..." />
            </Field>
            <Field label="Seller Name" ur="بیچنے والے کا نام" required><TextInput value={form.sellerName} onChange={e => setForm({ ...form, sellerName: e.target.value })} /></Field>
            <Field label="Seller Phone" ur="فون"><TextInput value={form.sellerPhone} onChange={e => setForm({ ...form, sellerPhone: e.target.value })} /></Field>
            <Field label="Seller CNIC" ur="شناختی کارڈ"><TextInput value={form.sellerCnic} onChange={e => setForm({ ...form, sellerCnic: e.target.value })} placeholder="for used-mobile record keeping" /></Field>
            <Field label="Date" ur="تاریخ"><TextInput type="date" value={form.date} onChange={e => setForm({ ...form, date: e.target.value })} /></Field>
          </div>
          <div className="border-t border-slate-100 mt-4 pt-4 grid grid-cols-1 md:grid-cols-3 gap-3">
            <Field label="Item Name" ur="آئٹم کا نام" required><TextInput value={form.itemName} onChange={e => setForm({ ...form, itemName: e.target.value })} placeholder="e.g. iPhone 13" /></Field>
            <Field label="Brand" ur="برانڈ"><TextInput value={form.brand} onChange={e => setForm({ ...form, brand: e.target.value })} /></Field>
            <Field label="Model" ur="ماڈل"><TextInput value={form.model} onChange={e => setForm({ ...form, model: e.target.value })} /></Field>

/* ---------- 4. Day-End Cash Summary ---------- */
function DayEndCashSection({ data, setData, canAdd, canDelete, currentUserName }) {
  const cashAccounts = useMemo(() => data.accounts.filter(a => a.type === "Cash"), [data.accounts]);
  const [selDate, setSelDate] = useState(todayISO());
  const [accountId, setAccountId] = useState((cashAccounts[0] && cashAccounts[0].id) || "");
  const [counted, setCounted] = useState("");
  const [note, setNote] = useState("");
  const [deleting, setDeleting] = useState(null);
  useEffect(() => { if (!accountId && cashAccounts[0]) setAccountId(cashAccounts[0].id); }, [cashAccounts]);

  const figures = useMemo(() => {
    if (!accountId) return null;
    const onDate = (d) => d === selDate;
    const opening = accountBalanceAsOf(data, accountId, selDate);
    let cashSales = 0, collections = 0, expenses = 0, salary = 0, dealerPayments = 0, partnerDrawings = 0, dealerReturnCashIn = 0, saleReturnCashOut = 0, buybackCashOut = 0;
    data.sales.forEach(s => {
      if (s.accountId === accountId && onDate(s.date)) cashSales += Number(s.paidAmount) || 0;
      (s.installmentPayments || []).forEach(p => { if (p.type !== "discount" && p.accountId === accountId && onDate(p.date || s.date)) collections += Number(p.amount) || 0; });
    });
    data.customers.forEach(c => { (c.openingBalancePayments || []).forEach(p => { if (p.type !== "discount" && p.accountId === accountId && onDate(p.date)) collections += Number(p.amount) || 0; }); });
    (data.expenses || []).forEach(e => { if (e.accountId === accountId && onDate(e.date)) expenses += Number(e.amount) || 0; });
    (data.salaryPayments || []).forEach(p => { if (p.accountId === accountId && onDate(p.date)) salary += Number(p.amount) || 0; });
    data.dealerPayments.forEach(p => { if (p.accountId === accountId && onDate(p.date)) dealerPayments += Number(p.amount) || 0; });
    (data.partnerTransactions || []).forEach(t => { if (t.type === "drawing" && t.accountId === accountId && onDate(t.date)) partnerDrawings += Number(t.amount) || 0; });
    (data.dealerReturns || []).forEach(r => { if (r.settlement === "cash" && r.accountId === accountId && onDate(r.date)) dealerReturnCashIn += Number(r.totalAmount) || 0; });
    (data.saleReturns || []).forEach(r => { if (r.refundMethod === "cash" && r.accountId === accountId && onDate(r.date)) saleReturnCashOut += Number(r.totalAmount) || 0; });
    (data.buybacks || []).forEach(b => { if (b.accountId === accountId && onDate(b.date)) buybackCashOut += Number(b.agreedPrice) || 0; });
    const cashIn = cashSales + collections + dealerReturnCashIn;
    const cashOut = expenses + salary + dealerPayments + partnerDrawings + saleReturnCashOut + buybackCashOut;
    const expected = opening + cashIn - cashOut;
    return { opening, cashSales, collections, dealerReturnCashIn, cashIn, expenses, salary, dealerPayments, partnerDrawings, saleReturnCashOut, buybackCashOut, cashOut, expected };
  }, [data, accountId, selDate]);

  const existingForDay = (data.cashSummaries || []).find(c => c.date === selDate && c.accountId === accountId);
  useEffect(() => { setCounted(existingForDay ? String(existingForDay.counted) : ""); setNote(existingForDay ? existingForDay.note || "" : ""); }, [existingForDay && existingForDay.id, selDate, accountId]);
  const variance = counted !== "" && figures ? Number(counted) - figures.expected : null;

  function saveClosing() {
    if (!accountId) { alert("No Cash account found — add one in Accounts first."); return; }
    if (counted === "" || isNaN(Number(counted))) { alert("Enter the counted cash amount"); return; }
    const entry = { id: existingForDay ? existingForDay.id : uid("cshsum"), date: selDate, accountId, ...figures, counted: Number(counted), variance: Number(counted) - figures.expected, note, closedBy: currentUserName || "", closedAt: new Date().toISOString() };
    const list = existingForDay ? (data.cashSummaries || []).map(c => c.id === existingForDay.id ? entry : c) : [...(data.cashSummaries || []), entry];
    setData({ ...data, cashSummaries: list });
  }
  function doDelete() { setData({ ...data, cashSummaries: (data.cashSummaries || []).filter(c => c.id !== deleting.id) }); setDeleting(null); }
  const history = [...(data.cashSummaries || [])].sort((a, b) => (b.date || "").localeCompare(a.date || ""));

  if (cashAccounts.length === 0) {
    return <p className="text-sm text-slate-500">No Cash-type account exists yet. Add one from the Accounts / Bank Ledger tab first (Account Type = "Cash").</p>;
  }

  return (
    <div>
      <p className="text-xs text-slate-500 mb-4">Reconciles a day's cash drawer: today's cash sales + ledger collections, minus expenses/payouts, against what's actually in the drawer.</p>
      <div className="flex flex-wrap gap-3 mb-4">
        <div><span className="text-xs text-slate-500">Date</span><TextInput type="date" value={selDate} onChange={e => setSelDate(e.target.value)} /></div>
        <div><span className="text-xs text-slate-500">Cash Account</span><Select value={accountId} onChange={e => setAccountId(e.target.value)} options={cashAccounts.map(a => ({ value: a.id, label: a.name }))} className="min-w-[160px]" /></div>
      </div>
      {figures && (
        <>
          <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-3">
            <Card label="Opening Balance" value={fmtMoney(figures.opening)} />
            <Card label="Cash Sales" value={fmtMoney(figures.cashSales)} accent="text-emerald-600" />
            <Card label="Ledger Collections" value={fmtMoney(figures.collections)} accent="text-emerald-600" />
            <Card label="Dealer Return Cash In" value={fmtMoney(figures.dealerReturnCashIn)} accent="text-emerald-600" />
            <Card label="Expenses" value={fmtMoney(figures.expenses)} accent="text-rose-600" />
            <Card label="Staff Salary Paid" value={fmtMoney(figures.salary)} accent="text-rose-600" />
            <Card label="Dealer Payments" value={fmtMoney(figures.dealerPayments)} accent="text-rose-600" />
            <Card label="Partner Drawings" value={fmtMoney(figures.partnerDrawings)} accent="text-rose-600" />
            <Card label="Sale Return Refunds" value={fmtMoney(figures.saleReturnCashOut)} accent="text-rose-600" />
            <Card label="Buyback Payouts" value={fmtMoney(figures.buybackCashOut)} accent="text-rose-600" />
          </div>
          <div className="bg-white rounded-xl border border-slate-200 p-4 mb-4">
            <div className="flex flex-wrap justify-between items-center gap-3">
              <div><span className="text-sm text-slate-500">Total Cash In: </span><b className="text-emerald-600">{fmtMoney(figures.cashIn)}</b><span className="text-sm text-slate-500 ml-4">Total Cash Out: </span><b className="text-rose-600">{fmtMoney(figures.cashOut)}</b></div>
              <div className="text-lg"><span className="text-sm text-slate-500">Expected Cash in Drawer: </span><b className="text-[var(--accent-700)]">{fmtMoney(figures.expected)}</b></div>
            </div>
          </div>
          {canAdd && (
            <div className="bg-white rounded-xl border border-slate-200 p-4 mb-6">
              <h3 className="text-sm font-semibold text-slate-700 mb-3">Close the Day / دن بند کریں</h3>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                <Field label="Actual Counted Cash in Drawer" ur="گنی گئی رقم"><TextInput type="number" value={counted} onChange={e => setCounted(e.target.value)} /></Field>
                <Field label="Note" ur="نوٹ"><TextInput value={note} onChange={e => setNote(e.target.value)} placeholder="optional" /></Field>
              </div>
              {variance !== null && (
                <div className={"mt-2 text-sm font-medium " + (variance === 0 ? "text-emerald-600" : variance > 0 ? "text-sky-600" : "text-rose-600")}>
                  {variance === 0 ? "Balanced — matches exactly." : variance > 0 ? "Over by " + fmtMoney(variance) : "Short by " + fmtMoney(Math.abs(variance))}
                </div>
              )}
              <div className="flex justify-end mt-3">
                <button onClick={saveClosing} className="bg-[var(--accent-600)] hover:bg-[var(--accent-700)] text-[var(--button-text)] text-sm font-medium px-4 py-2 rounded-lg">{existingForDay ? "Update Closing" : "Save Closing"} / محفوظ کریں</button>
              </div>
            </div>
          )}
        </>
      )}
      <div className="bg-white rounded-xl border border-slate-200 overflow-x-auto">
        <table className="w-full text-sm">
          <thead className="bg-slate-50 text-slate-500 uppercase text-xs"><tr><th className="text-left px-3 py-2">Date</th><th className="text-left px-3 py-2">Account</th><th className="text-left px-3 py-2">Expected</th><th className="text-left px-3 py-2">Counted</th><th className="text-left px-3 py-2">Variance</th><th className="text-left px-3 py-2">Closed By</th><th className="text-left px-3 py-2"></th></tr></thead>
          <tbody>
            {history.map(c => {
              const acc = data.accounts.find(a => a.id === c.accountId);
              return (
                <tr key={c.id} className="border-t border-slate-100 hover:bg-slate-50">
                  <td className="px-3 py-2">{fmtDate(c.date)}</td>
                  <td className="px-3 py-2">{acc ? acc.name : "-"}</td>
                  <td className="px-3 py-2">{fmtMoney(c.expected)}</td>
                  <td className="px-3 py-2">{fmtMoney(c.counted)}</td>
                  <td className={"px-3 py-2 font-medium " + (c.variance === 0 ? "text-emerald-600" : c.variance > 0 ? "text-sky-600" : "text-rose-600")}>{c.variance === 0 ? "Balanced" : (c.variance > 0 ? "+" : "") + fmtMoney(c.variance)}</td>
                  <td className="px-3 py-2">{c.closedBy || "-"}</td>
                  <td className="px-3 py-2">{canDelete && <button onClick={() => setDeleting(c)} title="Delete" className="text-slate-500 hover:text-rose-600">&#128465;</button>}</td>
                </tr>
              );
            })}
            {history.length === 0 && <tr><td colSpan="7" className="text-center text-slate-400 py-8">No day-end closings saved yet</td></tr>}
          </tbody>
        </table>
      </div>
      {deleting && (
        <Modal title="Delete This Closing?" onClose={() => setDeleting(null)}>
          <p className="text-sm text-slate-600">Delete the saved cash closing for {fmtDate(deleting.date)}?</p>
          <ConfirmBar onCancel={() => setDeleting(null)} onConfirm={doDelete} />
        </Modal>
      )}
    </div>
  );
}

    setData({ ...data, partnerTransactions: [...data.partnerTransactions, entry], inventory: newInventory });

      {deleting && (
        <Modal title="Delete Partner?" onClose={() => setDeleting(null)}>
          <p className="text-sm text-slate-600">Delete <b>{deleting.name}</b>? Their drawing history will remain but be unlinked.</p>

/* ============================ SETTINGS TAB ============================ */
function blankUserForm() { return { username: "", password: "", name: "", email: "", role: "Sales Officer", permissions: defaultPermsForRole("Sales Officer") }; }
/* Toggles one CRUD action for one module inside a permissions object (used by both the Add/Edit
   User form and the standalone Permission Matrix). Checking "Add", "Edit", or "Delete" implicitly
   turns "View" on too (you can't add/edit/delete a module you can't see); unchecking "View" turns
   the other three off (nothing else makes sense without view access). */
function togglePermAction(perms, moduleId, action, checked) {
  const cur = perms[moduleId] || blankCrud(false);
  let next = { ...cur, [action]: checked };
  if (action === "view" && !checked) next = blankCrud(false);
  else if (action !== "view" && checked) next.view = true;
  return { ...perms, [moduleId]: next };
}
/* Groups the Settings screen into short, focused sub-tabs instead of one long scroll. Purely a
   presentational grouping — every card below keeps its exact existing markup/logic, just nested
   under whichever pill is active. */
/* In-app Firebase configuration editor (Cloud Sync -> shown to Admins). Fully self-contained:
   reads/writes localStorage directly and reloads the page to apply, so it needs no props from
   the App-level state tree. See FIREBASE_OVERRIDE_KEY / loadFirebaseOverride etc. above. */
function FirebaseSettingsPanel() {
  const existing = loadFirebaseOverride();
  const [enabled, setEnabled] = useState(!(existing && existing.enabled === false));
  const [useCustom, setUseCustom] = useState(!!(existing && existing.config));
  const [cfg, setCfg] = useState({
    apiKey: (existing && existing.config && existing.config.apiKey) || "",
    authDomain: (existing && existing.config && existing.config.authDomain) || "",

/* ============================ EXPORT / BACKUP TAB ============================ */
/* Same horizontal-tab pattern as SETTINGS_SECTIONS above, replacing the old vertical stack of
   accordions with three clean, switchable panels. Purely presentational — every export/import
   function below keeps its exact existing logic, just grouped under whichever tab is active. */
const EXPORT_SECTIONS = [
  { id: "reports", label: "Reports", ur: "رپورٹس", icon: "\u{1F4CA}" },
  { id: "backup", label: "Backup & Restore", ur: "بیک اپ", icon: "\u{1F4BE}" },
  { id: "import", label: "Import & Merge", ur: "درآمد", icon: "\u{1F4E5}" },
];
/* Phase 5: Google Drive Backup & Sync panel — self-contained UI on top of the useGoogleDriveBackup
   hook (see its definition near GOOGLE_DRIVE_CLIENT_ID above). Handles all four states a person can
   land in: not configured (no Client ID pasted in yet), signed-out, connected/syncing, and offline —
   plus the Restore flow, which lists every backup file actually sitting in the "Zahidy Mobiles
   Backups" Drive folder (by name/date) rather than guessing, so restoring onto a brand-new device
   works exactly the same as restoring on the original one. */
function GoogleDriveBackupPanel({ gdrive, isOnline, setData }) {
  const [showRestore, setShowRestore] = useState(false);
  const [backups, setBackups] = useState(null);
  const [restoreLoading, setRestoreLoading] = useState(false);
  const [restoreError, setRestoreError] = useState("");
  const [restoringId, setRestoringId] = useState(null);

  function openRestore() {
    setShowRestore(true); setBackups(null); setRestoreError(""); setRestoreLoading(true);
    gdrive.listBackups()
      .then(files => setBackups(files))
      .catch(e => setRestoreError(e.message || String(e)))
      .finally(() => setRestoreLoading(false));
  }
  function doRestore(file) {
    if (!confirm("Restore \"" + file.name + "\"? This will overwrite the current business's Inventory, Customers, Installment Ledgers, and Dealer data with what's in this backup. This cannot be undone.")) return;
    setRestoringId(file.id); setRestoreError("");
    gdrive.downloadBackup(file.id)
      .then(json => {
        const incoming = json.data || json;
        // Uses the same normalizeData() pass as every other restore path in this app (local JSON
        // import, Firebase pull), so a Drive-restored backup is guaranteed the same shape as one
        // restored any other way.
        setData(normalizeData(incoming));
        setShowRestore(false);
        alert("Data restored successfully from Google Drive.");
      })
      .catch(e => setRestoreError(e.message || String(e)))
      .finally(() => setRestoringId(null));
  }

  if (!gdrive.enabled) {
    return (
      <div className="bg-white rounded-xl border border-slate-200 p-5">
        <div className="flex items-center justify-between gap-3 mb-1">
          <h3 className="text-sm font-semibold text-slate-700">Google Drive Backup & Sync <span className="urdu text-slate-400 text-xs">/ گوگل ڈرائیو بیک اپ</span></h3>
          <span className="text-xs px-2 py-1 rounded-full bg-slate-100 text-slate-500 whitespace-nowrap">Not configured</span>
        </div>
        <p className="text-xs text-slate-500">
          This device's data is always safe locally regardless. To also mirror backups into a real Google Drive folder,
          an admin needs to create a free Google Cloud OAuth Client ID once and paste it into the app's code
          (<code className="bg-slate-100 px-1 rounded">GOOGLE_DRIVE_CLIENT_ID</code>) — see the setup steps in the comment
          right above it. Takes about five minutes and nothing else in the app is affected either way.
        </p>
      </div>
    );
  }

  const st = gdrive.status;
  const badge =
    st === "synced" ? { text: "Connected \u00b7 Synced", cls: "bg-emerald-100 text-emerald-700" } :
    st === "syncing" ? { text: "Syncing\u2026", cls: "bg-amber-100 text-amber-700" } :
    st === "offline" ? { text: "Offline \u2014 will resume automatically", cls: "bg-slate-100 text-slate-500" } :
    st === "error" ? { text: "Error", cls: "bg-rose-100 text-rose-700" } :
    { text: "Not connected", cls: "bg-slate-100 text-slate-500" };
  const connected = st === "synced" || st === "syncing" || st === "offline";

  return (
    <div className="bg-white rounded-xl border border-slate-200 p-5">
      <div className="flex items-center justify-between gap-3 mb-1">
        <h3 className="text-sm font-semibold text-slate-700">Google Drive Backup & Sync <span className="urdu text-slate-400 text-xs">/ گوگل ڈرائیو بیک اپ</span></h3>
        <span className={"text-xs px-2 py-1 rounded-full whitespace-nowrap " + badge.cls}>{badge.text}</span>
      </div>
      <p className="text-xs text-slate-500 mb-3">
        Backs up a full JSON snapshot of this business into a "{GOOGLE_DRIVE_FOLDER_NAME}" folder in your own Google
        Drive — created automatically the first time it's needed. Fully optional and 100% additional: daily billing,
        Inventory, Sales, and every other feature keep working normally with zero internet connection either way.
      </p>

      {!isOnline && (
        <div className="text-xs bg-slate-50 border border-slate-200 text-slate-500 rounded-lg px-3 py-2 mb-3">
          You're currently offline \u2014 the app keeps working normally from local storage. Drive backup/restore will resume the moment you're back online.
        </div>
      )}

      {connected && gdrive.account && (
        <div className="flex items-center gap-2 mb-3 text-xs text-slate-500">
          <span className="w-6 h-6 rounded-full bg-[var(--accent-100)] text-[var(--accent-700)] flex items-center justify-center font-semibold">
            {(gdrive.account.displayName || gdrive.account.emailAddress || "?").slice(0, 1).toUpperCase()}
          </span>
          <span>{gdrive.account.emailAddress || gdrive.account.displayName}</span>
        </div>
      )}
      {connected && gdrive.lastSyncedAt && <p className="text-xs text-slate-400 mb-3">Last backed up {relativeTime(gdrive.lastSyncedAt)}</p>}
      {gdrive.errorMsg && <p className="text-xs text-rose-600 mb-3">{gdrive.errorMsg}</p>}

      <div className="flex flex-wrap gap-2">
        {!connected && (
          <button onClick={gdrive.connect} disabled={st === "syncing"} className="bg-[var(--accent-600)] hover:bg-[var(--accent-700)] text-[var(--button-text)] text-xs font-medium px-3 py-2 rounded-lg disabled:opacity-50">
            Connect Google Drive
          </button>
        )}
        {connected && (
          <button onClick={gdrive.syncNow} disabled={st === "syncing"} className="bg-[var(--accent-600)] hover:bg-[var(--accent-700)] text-[var(--button-text)] text-xs font-medium px-3 py-2 rounded-lg disabled:opacity-50">
            {st === "syncing" ? "Backing up\u2026" : "Backup Now"}
          </button>
        )}
        <button onClick={openRestore} className="text-xs px-3 py-2 rounded-lg border border-slate-300 text-slate-600 hover:bg-slate-50">
          Restore from Google Drive
        </button>
        {connected && (

    { id: "itemPendency", title: "Item Pendency (Unsold Stock)", note: "Inventory not yet sold — status, age in stock, value.", build: () => buildItemPendencyReport(data) },
    { id: "salesReport", title: "Sales Report", note: "Every sale — item(s), amount, paid, and remaining balance.", build: () => buildSalesReport(data) },
    { id: "installmentDue", title: "Installment Dues", note: "Customers with a pending installment balance and next due date.", build: () => buildInstallmentDueReport(data) },
    { id: "dealerLedger", title: "Dealer Ledger", note: "Every purchase and payment-made transaction, chronologically.", build: () => buildDealerLedgerReport(data) },
    { id: "expenseReport", title: "Expense Report", note: "All recorded business expenses by date.", build: () => buildExpenseReport(data) },
  ];
  function runReportPDF(report) {
    const { columns, rows, totals } = report.build();
    let netOutstandingBox = null;
    if (report.id === "customerLedger" && totals) netOutstandingBox = { label: "Net Outstanding Balance (Receivable)", value: totals.totalOutstanding };
    if (report.id === "dealerLedger" && totals) netOutstandingBox = { label: "Net Outstanding Balance (Payable)", value: totals.amount };
    exportReportPDF(currentBiz, report.title, columns, rows, currentBiz.name.replace(/\s+/g, "_") + "_" + report.id, totals, netOutstandingBox);
  }
  function runReportExcel(report) {
    const { columns, rows } = report.build();
    exportReportExcel(currentBiz.name.replace(/\s+/g, "_") + "_" + report.id, report.title, columns, rows);
  }

  return (
    <div className="max-w-xl">
      <h2 className="text-lg font-semibold text-slate-800 mb-4"><Bi en="Backup & Export" ur="بیک اپ اور ایکسپورٹ" /></h2>

      <div className="flex flex-wrap gap-2 mb-6 border-b border-slate-200 pb-4">
        {EXPORT_SECTIONS.map(s => (
          <button
            key={s.id}
            onClick={() => setActiveSection(s.id)}
            className={"flex items-center gap-1.5 px-3 py-2 rounded-full text-xs sm:text-sm font-medium transition-all " + (activeSection === s.id ? "bg-gradient-to-r from-[var(--accent-600)] to-[var(--accent-500)] text-[var(--button-text)] shadow-md shadow-[var(--accent-900)]/20" : "bg-slate-100 text-slate-600 hover:bg-slate-200")}
          >
            <span>{s.icon}</span>{s.label}
          </button>
        ))}
      </div>

      {!activeSection && (
        <div className="bg-white rounded-xl border border-dashed border-slate-300 p-6 text-center text-sm text-slate-400">
          Select a section above to view its options.
        </div>

      {activeSection === "reports" && (
        <div className="bg-white rounded-xl border border-slate-200 p-5">
          <h3 className="text-sm font-semibold text-slate-700 mb-1">Reports (PDF & Excel) <span className="urdu text-slate-400 text-xs">/ رپورٹس</span></h3>

          <div className="space-y-2">
            {REPORTS.map(r => (
              <div key={r.id} className="flex items-center justify-between gap-3 border border-slate-100 rounded-lg px-3 py-2.5">
                <div className="min-w-0">

                <div className="flex gap-2 shrink-0">
                  <button onClick={() => runReportPDF(r)} className="bg-rose-50 hover:bg-rose-100 text-rose-700 text-xs font-medium px-3 py-1.5 rounded-lg">PDF</button>
                  <button onClick={() => runReportExcel(r)} className="bg-emerald-50 hover:bg-emerald-100 text-emerald-700 text-xs font-medium px-3 py-1.5 rounded-lg">Excel</button>

      {activeSection === "backup" && (
        <div className="space-y-4">
          <div className="bg-white rounded-xl border border-slate-200 p-5">
            <div className="flex items-center justify-between gap-3 mb-1">
              <h3 className="text-sm font-semibold text-slate-700">Auto-Backup <span className="urdu text-slate-400 text-xs">/ خودکار بیک اپ</span></h3>
              <span className="text-xs px-2 py-1 rounded-full bg-teal-100 text-teal-700 whitespace-nowrap">Active</span>
            </div>
            <p className="text-xs text-slate-500 mb-3">Every time a sale, customer, purchase, or payment is added or updated, a fresh JSON snapshot is saved in the background automatically \u2014 no action needed. It's a safety-net copy on top of the app's normal local storage.</p>

              <AutoBackupBadge lastAutoBackupAt={lastAutoBackupAt} full />
              <button onClick={onDownloadAutoBackup} className="text-teal-700 hover:text-teal-800 text-xs font-medium px-3 py-1.5 rounded-lg bg-white border border-teal-200">Download Latest Auto-Backup</button>

          </div>

          <div className="bg-white rounded-xl border border-slate-200 p-5">
            <h3 className="text-sm font-semibold text-slate-700 mb-1">Export Backup <span className="urdu text-slate-400 text-xs">/ مکمل بیک اپ</span></h3>

              <button onClick={() => exportCSV("inventory", data.inventory.map(i => ({ ...i, accessories: Object.keys(i.accessories || {}).filter(k => i.accessories[k]).join("|") })))} className="w-full text-left bg-slate-50 hover:bg-slate-100 text-slate-700 text-sm px-4 py-3 rounded-lg">Export Inventory (CSV)</button>
              <button onClick={() => exportCSV("dealers", data.dealers)} className="w-full text-left bg-slate-50 hover:bg-slate-100 text-slate-700 text-sm px-4 py-3 rounded-lg">Export Dealers (CSV)</button>

              <button onClick={() => exportCSV("sales", data.sales.map(s => ({ ...s, installmentPayments: JSON.stringify(s.installmentPayments || []) })))} className="w-full text-left bg-slate-50 hover:bg-slate-100 text-slate-700 text-sm px-4 py-3 rounded-lg">Export Sales (CSV)</button>
              <button onClick={() => exportCSV("installments", data.sales.filter(s => s.paymentType === "Installment").flatMap(s => (s.installmentPayments || []).map(p => ({ invoiceId: s.invoiceId, customerName: s.customerName, type: p.type, amount: p.amount, date: p.date, accountName: data.accounts.find(a => a.id === p.accountId)?.name || "", manualReceiptNumber: p.manualReceiptNumber || "" }))))} className="w-full text-left bg-slate-50 hover:bg-slate-100 text-slate-700 text-sm px-4 py-3 rounded-lg">Export Installment Ledger (CSV)</button>
              <button onClick={() => exportCSV("customers", data.customers.map(({ photo, cnicFront, cnicBack, guarantorProof, ...rest }) => rest))} className="w-full text-left bg-slate-50 hover:bg-slate-100 text-slate-700 text-sm px-4 py-3 rounded-lg">Export Customers (CSV)</button>

              <button onClick={() => exportCSV("dealer_ledger_payments", data.dealerPayments.map(p => ({ dealerName: data.dealers.find(d => d.id === p.dealerId)?.name || "", amount: p.amount, accountName: data.accounts.find(a => a.id === p.accountId)?.name || "", date: p.date, note: p.note || "" })))} className="w-full text-left bg-slate-50 hover:bg-slate-100 text-slate-700 text-sm px-4 py-3 rounded-lg">Export Dealer Ledger Payments (CSV)</button>
              <button onClick={() => exportCSV("expenses", data.expenses)} className="w-full text-left bg-slate-50 hover:bg-slate-100 text-slate-700 text-sm px-4 py-3 rounded-lg">Export Expenses (CSV)</button>
              <button onClick={() => exportCSV("staff_salaries", data.salaryPayments)} className="w-full text-left bg-slate-50 hover:bg-slate-100 text-slate-700 text-sm px-4 py-3 rounded-lg">Export Salary Payments (CSV)</button>
            </div>
          </div>

          <div className="bg-white rounded-xl border border-slate-200 p-5">
            <h3 className="text-sm font-semibold text-slate-700 mb-1">Restore Backup <span className="urdu text-slate-400 text-xs">/ مکمل بحالی</span></h3>
            <p className="text-xs text-slate-500 mb-2">This replaces Inventory, Customers, Installment Ledgers, and Dealer data entirely.</p>
            <input type="file" accept="application/json" onChange={handleImport} className="text-sm" />

            <div className="mt-4 pt-4 border-t border-slate-100">
              <div className="text-sm font-medium text-slate-700 mb-1">Import Full Excel Backup</div>
              <p className="text-xs text-slate-500 mb-2">Upload ONE .xlsx workbook — such as the file from "Export Full Backup (Excel, multi-sheet)" above — and every sheet it contains (Inventory, Dealers, Customers, Accounts, CustomCategories, CustomItemPresets) is imported together in a single step. Records matched by IMEI/Serial/phone/name are updated in place; everything else is added as new.</p>
              <input type="file" accept=".xlsx,.xls" onChange={handleFullExcelImport} className="text-sm" />
            </div>
          </div>

          <GoogleDriveBackupPanel gdrive={gdrive} isOnline={isOnline} setData={setData} />
        </div>
      )}

      {activeSection === "import" && (
        <div className="bg-white rounded-xl border border-slate-200 p-5">
          <h3 className="text-sm font-semibold text-slate-700 mb-1">Import / Merge from CSV or Excel <span className="urdu text-slate-400 text-xs">/ ڈیٹا امپورٹ</span></h3>
          <p className="text-xs text-slate-500 mb-3">One table at a time — pick exactly which table to update. Records matched by IMEI/Serial (stock), phone (customers), or name (dealers/accounts) are updated in place; everything else is added as new. Dealer Ledger Payments are historical transactions, so each row is always appended as a new ledger entry rather than merged.</p>
          <div className="space-y-3">
            <div><label className="text-sm text-slate-700 block mb-1">Import / Update Stock (Inventory)</label><input type="file" accept=".csv,.xlsx,.xls,.json" onChange={e => handleTableImport(e, "inventory")} className="text-sm" /></div>
            <div><label className="text-sm text-slate-700 block mb-1">Import / Update Customer Ledgers</label><input type="file" accept=".csv,.xlsx,.xls,.json,.pdf" onChange={e => handleTableImport(e, "customers")} className="text-sm" /><p className="text-xs text-slate-400 mt-1">Excel/CSV/JSON columns: name, phone, and optionally openingBalance/balance. PDF: DigiKhata "Customers List Report" exports are recognized automatically (Urdu names included) and shown in a preview before anything is imported; other PDFs fall back to a generic name + phone (+ optional balance) line scan. CNIC/address won't be picked up from a PDF and can be edited after import. Balance is stored as each customer's Opening Balance and added on top of their normal sales/installment ledger.</p></div>
            <div><label className="text-sm text-slate-700 block mb-1">Import / Update Supplier (Dealer) Data</label><input type="file" accept=".csv,.xlsx,.xls,.json" onChange={e => handleTableImport(e, "dealers")} className="text-sm" /></div>
            <div><label className="text-sm text-slate-700 block mb-1">Import / Update Accounts (Cash / Bank / Wallet)</label><input type="file" accept=".csv,.xlsx,.xls,.json" onChange={e => handleTableImport(e, "accounts")} className="text-sm" /></div>
            <div><label className="text-sm text-slate-700 block mb-1">Import Dealer Ledger Payments (adds new entries — columns: dealerName, amount, accountName, date, note)</label><input type="file" accept=".csv,.xlsx,.xls,.json" onChange={e => handleTableImport(e, "dealerLedger")} className="text-sm" /></div>
            <div><label className="text-sm text-slate-700 block mb-1">Import New Sales Records (columns: invoiceId, itemImeiOrSerial, customerPhone, salePrice, paymentType, date, soldBy...)</label><input type="file" accept=".csv,.xlsx,.xls,.json" onChange={e => handleTableImport(e, "sales")} className="text-sm" /></div>
            <div><label className="text-sm text-slate-700 block mb-1">Import Installment Payments (adds new entries — columns: invoiceId, amount, date, accountName, manualReceiptNumber)</label><input type="file" accept=".csv,.xlsx,.xls,.json" onChange={e => handleTableImport(e, "installments")} className="text-sm" /></div>
          </div>
        </div>
      )}

      <p className="text-xs text-slate-400 mt-4">All data is stored locally in this browser (LocalStorage) and persists automatically between sessions on this device.</p>

      {pdfImportPreview && (
        <Modal title="Preview PDF Import" ur="پیش نظارہ" onClose={() => setPdfImportPreview(null)} wide>
          <p className="text-xs text-slate-500 mb-3">{pdfImportPreview.length} customer(s) detected. Check that the names below look right — especially Urdu names — before importing. Rows matched by phone will UPDATE that customer; the rest are ADDED as new.</p>
          <div className="border border-slate-200 rounded-lg overflow-hidden max-h-[50vh] overflow-y-auto">
            <table className="w-full text-sm">
              <thead className="bg-slate-50 sticky top-0"><tr>
                <th className="text-left px-3 py-2 font-medium text-slate-600">Name</th>
                <th className="text-left px-3 py-2 font-medium text-slate-600">Phone</th>
                <th className="text-right px-3 py-2 font-medium text-slate-600">Opening Balance</th>
                <th className="text-left px-3 py-2 font-medium text-slate-600">Last Activity</th>
              </tr></thead>
              <tbody>
                {pdfImportPreview.map((r, i) => (
                  <tr key={i} className="border-t border-slate-100">
                    <td className={"px-3 py-1.5 text-slate-800" + (containsUrdu(r.name) ? " urdu" : "")}>{r.name || <span className="text-rose-500" style={{ fontFamily: "inherit", direction: "ltr" }}>(blank — existing name kept if matched)</span>}</td>
                    <td className="px-3 py-1.5 text-slate-600">{r.phone || <span className="text-amber-600">no phone — will be skipped</span>}</td>
                    <td className="px-3 py-1.5 text-right text-slate-600">{r.openingBalance ? fmtMoney(r.openingBalance) : "-"}</td>

            <button onClick={() => commitCustomerImportRows(pdfImportPreview.filter(r => r.phone))} className="px-4 py-2 text-sm rounded-lg bg-gradient-to-r from-[var(--accent-600)] to-[var(--accent-500)] text-[var(--button-text)] font-medium">Import {pdfImportPreview.filter(r => r.phone).length} Customer(s)</button>
          </div>
        </Modal>
      )}
    </div>
  );
}
