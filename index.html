/* ============================ INVENTORY TAB ============================ */
/* Groups a list of inventory items into an item-wise / variant-wise breakdown: items are grouped
   by category, then within each category by the combination of item name + brand + model + specs
   + color — so "iPhone 13" in Midnight and Blue count separately, and a "43-inch" LCD (typed into
   the item name or the appliance Specs field) is distinguished from a "32-inch" one of the same
   brand, without needing a dedicated "size" field on every category. */
function stockVariantKey(i) {
  return [i.category, i.itemName, i.brand, i.model, i.specs, i.color].map(v => (v || "").trim().toLowerCase()).join("\u241F");
}
function buildStockSummary(items) {
  const groups = {};
  items.forEach(i => {
    const key = stockVariantKey(i);
    if (!groups[key]) {
      groups[key] = { category: i.category || "Other", itemName: i.itemName || "(unnamed)", brand: i.brand || "", model: i.model || "", specs: i.specs || "", color: i.color || "", count: 0, purchaseValue: 0, retailValue: 0 };
    }
    groups[key].count += 1;
    groups[key].purchaseValue += Number(i.purchasePrice) || 0;
    groups[key].retailValue += Number(i.retailPrice) || 0;
  });
  const rows = Object.values(groups);
  const byCategory = {};
  rows.forEach(r => { (byCategory[r.category] = byCategory[r.category] || []).push(r); });
  Object.keys(byCategory).forEach(cat => byCategory[cat].sort((a, b) => b.count - a.count || a.itemName.localeCompare(b.itemName)));
  const categoryOrder = Object.keys(byCategory).sort((a, b) => {
    const totalA = byCategory[a].reduce((s, r) => s + r.count, 0);
    const totalB = byCategory[b].reduce((s, r) => s + r.count, 0);
    return totalB - totalA;
  });
  return { byCategory, categoryOrder };
}
function InventoryTab({ data, setData, role, dealers, biz, erpSettings, can, uiPrefs }) {
  const canAdd = can("add"), canEdit = can("edit"), canDelete = can("delete");
  const zebraOn = !!(uiPrefs && uiPrefs.zebraStripe && uiPrefs.zebraStripe.inventory);
  const [query, setQuery] = useState("");
  const [filterDealer, setFilterDealer] = useState("");
  const [filterStatus, setFilterStatus] = useState("");
  const [showForm, setShowForm] = useState(false);
  const [editing, setEditing] = useState(null);
  const [viewing, setViewing] = useState(null);
  const [deleting, setDeleting] = useState(null);
  const [item, setItem] = useState(blankItem());
  const [imeiError, setImeiError] = useState("");
  const [showSummary, setShowSummary] = useState(false);

  const filtered = useMemo(() => {
    const q = query.trim().toLowerCase();
    return data.inventory.filter(i => {
      if (filterDealer && i.dealerId !== filterDealer) return false;
      if (filterStatus && i.status !== filterStatus) return false;
      if (!q) return true;
      return [i.itemName, i.model, i.brand, i.imei1, i.imei2, i.serialNumber].some(v => (v || "").toLowerCase().includes(q));
    }).sort((a, b) => (b.dateAdded || "").localeCompare(a.dateAdded || ""));
  }, [data.inventory, query, filterDealer, filterStatus]);
  const { page, pageSize, setPage, pageRows: pagedInventory, changePageSize } = usePagedRows(filtered, 25);
  // Live search/filters should always land you back on page 1 — otherwise a narrower result set
  // can leave you stranded on a page number that no longer makes sense for what you just typed.
  useEffect(() => { setPage(1); }, [query, filterDealer, filterStatus]);

  // Stock summary reflects whatever is currently filtered/searched above (defaults to everything,
  // same as the table beneath it), so "show me washing machines" also narrows the breakdown.
  const stockSummary = useMemo(() => buildStockSummary(filtered), [filtered]);

  const itemDirty = useDirty(item, showForm);
  function openAdd() { setItem(blankItem()); setEditing(null); setImeiError(""); setShowForm(true); }
  function openEdit(it) { setItem({ ...blankItem(), ...it, accessories: { ...blankItem().accessories, ...it.accessories } }); setEditing(it.id); setImeiError(""); setShowForm(true); }
  function submit() {
    if (!item.itemName.trim()) { alert("Item Name is required"); return; }
    const cfg = categoryConfig(item.category);
    setImeiError("");
    if (cfg.idField) {
      if (cfg.idRequired && !String(item[cfg.idField] || "").trim()) { setImeiError(cfg.idLabel + " is required for this category."); return; }
      if (item[cfg.idField]) {
        const dup = data.inventory.find(i => i[cfg.idField] === item[cfg.idField] && i.id !== editing);
        if (dup) { setImeiError("This " + cfg.idLabel + " already exists in inventory."); return; }
      }
    }
    if (editing) {
      setData({ ...data, inventory: data.inventory.map(i => i.id === editing ? { ...item, id: editing, dateAdded: i.dateAdded } : i) });
    } else {
      // Quantity > 1 clones this entry into that many identical stock records (used for items
      // like appliances that don't carry a unique IMEI/Serial per unit). Locked to 1 whenever the
      // category requires a unique identifier, so unique-ID items are never silently duplicated.
      const qty = cfg.idRequired ? 1 : Math.max(1, Math.floor(Number(item.quantity) || 1));
      const { quantity, ...rest } = item;
      const newItems = [];
      for (let n = 0; n < qty; n++) {
        const row = { ...rest, id: uid("item"), dateAdded: todayISO() };
        if (qty > 1 && cfg.idField) row[cfg.idField] = "";
        newItems.push(row);
      }
      setData({ ...data, inventory: [...data.inventory, ...newItems] });
    }
    setShowForm(false);
  }
  function doDelete() { setData({ ...data, inventory: data.inventory.filter(i => i.id !== deleting.id) }); setDeleting(null); }

  return (
    <div>
      <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
        <h2 className="text-lg font-semibold text-slate-800"><Bi en="Inventory" ur="اسٹاک" /></h2>
        <div className="flex flex-wrap gap-2">
          <button onClick={() => setShowSummary(s => !s)} className="bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-medium px-4 py-2 rounded-lg">{showSummary ? "Hide" : "\u{1F4CA} Show"} Stock Summary</button>
          {canAdd && <button onClick={openAdd} className="bg-[var(--accent-600)] hover:bg-[var(--accent-700)] text-[var(--button-text)] text-sm font-medium px-4 py-2 rounded-lg">+ Add Item / نیا آئٹم</button>}
        </div>
      </div>
      <div className="flex flex-wrap gap-2 mb-4">
        <TextInput placeholder="Search name, model, IMEI 1/2..." value={query} onChange={e => setQuery(e.target.value)} className="max-w-xs" />
        <Select value={filterDealer} onChange={e => setFilterDealer(e.target.value)} options={[{ value: "", label: "All Dealers" }, ...dealers.map(d => ({ value: d.id, label: d.name }))]} className="max-w-[180px]" />
        <Select value={filterStatus} onChange={e => setFilterStatus(e.target.value)} options={[{ value: "", label: "All Status" }, ...STATUSES]} className="max-w-[160px]" />
      </div>
      {showSummary && (
        <div className="bg-white rounded-xl border border-slate-200 p-4 mb-4">
          <div className="flex flex-wrap items-center justify-between gap-2 mb-3">
            <h3 className="text-sm font-semibold text-slate-700">Stock Summary — Item &amp; Variant Breakdown <span className="urdu text-slate-400 text-xs">/ اسٹاک کی تفصیل</span></h3>
            <div className="text-xs text-slate-500">{filtered.length} unit(s) across {stockSummary.categoryOrder.length} categor{stockSummary.categoryOrder.length === 1 ? "y" : "ies"} — reflects the search/filters above</div>
          </div>
          {stockSummary.categoryOrder.length === 0 ? (
            <div className="text-center text-slate-400 py-8 text-sm">No stock matches the current filters.</div>
          ) : (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              {stockSummary.categoryOrder.map(cat => {
                const rows = stockSummary.byCategory[cat];
                const catTotal = rows.reduce((s, r) => s + r.count, 0);
                return (
                  <div key={cat} className="border border-slate-200 rounded-lg overflow-hidden">
                    <div className="bg-slate-50 px-3 py-2 flex items-center justify-between">
                      <span className="text-sm font-semibold text-slate-700">{cat}</span>
                      <span className="text-xs font-medium text-[var(--accent-600)]">{catTotal} unit{catTotal === 1 ? "" : "s"}</span>
                    </div>
                    <table className="w-full text-xs">
                      <tbody>
                        {rows.map((r, idx) => (
                          <tr key={idx} className="border-t border-slate-100">
                            <td className="px-3 py-1.5">
                              <div className="font-medium text-slate-700">{r.itemName}</div>
                              <div className="text-slate-400">{[r.brand, r.model, r.specs, r.color].filter(Boolean).join(" \u00B7 ") || "\u2014"}</div>
                            </td>
                            <td className="px-3 py-1.5 text-right font-semibold text-slate-800 whitespace-nowrap align-top">{r.count}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      )}
      <div className="bg-white rounded-xl border border-slate-200 overflow-x-auto">
        <table className="w-full text-sm">
          <thead className="bg-slate-50 text-slate-500 uppercase text-xs">
            <tr><th className="text-left px-3 py-2">Item</th><th className="text-left px-3 py-2">Category</th><th className="text-left px-3 py-2">IMEI 1</th><th className="text-left px-3 py-2">Condition</th><th className="text-left px-3 py-2">Dealer</th><th className="text-left px-3 py-2">Retail Price</th><th className="text-left px-3 py-2">Status</th><th className="text-left px-3 py-2">Actions</th></tr>
          </thead>
          <tbody>
            {pagedInventory.map((i, idx) => (
              <tr key={i.id} className={"border-t-2 border-slate-300 hover:bg-slate-50" + (zebraOn && idx % 2 === 1 ? " bg-slate-50" : " bg-white")}>
                <td className="px-3 py-2"><div className="font-medium text-slate-800">{i.itemName}</div><div className="text-xs text-slate-400">{i.brand} {i.model}</div></td>
                <td className="px-3 py-2">{i.category}</td>
                <td className="px-3 py-2 font-mono text-xs">{i.imei1 || "-"}</td>
                <td className="px-3 py-2">{i.condition}</td>
                <td className="px-3 py-2">{dealers.find(d => d.id === i.dealerId)?.name || "-"}</td>
                <td className="px-3 py-2">{fmtMoney(i.retailPrice)}</td>
                <td className="px-3 py-2"><StatusBadge status={i.status} /></td>
                <td className="px-3 py-2">
                  <div className="flex gap-2">
                    <button onClick={() => setViewing(i)} title="View" className="text-slate-500 hover:text-[var(--accent-600)]">&#128065;</button>
                    {canEdit && <button onClick={() => openEdit(i)} title="Edit" className="text-slate-500 hover:text-[var(--accent-600)]">&#9998;</button>}
                    {canDelete && <button onClick={() => setDeleting(i)} title="Delete" className="text-slate-500 hover:text-rose-600">&#128465;</button>}
                  </div>
                </td>
              </tr>
            ))}
            {filtered.length === 0 && <tr><td colSpan="8" className="text-center text-slate-400 py-8">No items found / کوئی آئٹم نہیں ملا</td></tr>}
          </tbody>
        </table>
        <Pagination page={page} pageSize={pageSize} total={filtered.length} onPage={setPage} onPageSize={changePageSize} />
      </div>

      {showForm && (
        <Modal title={editing ? "Edit Item" : "Add Item"} ur="آئٹم" onClose={() => setShowForm(false)} wide isDirty={itemDirty}>
          <ItemFormFields item={item} setItem={setItem} dealers={dealers} imeiError={imeiError} categories={allCategories(data)} presets={data.customItemPresets} isNew={!editing} bizId={biz.id} bizType={biz.businessType} erpSettings={erpSettings} />
          <div className="flex justify-end gap-2 mt-4">
            <button onClick={() => setShowForm(false)} className="px-4 py-2 text-sm rounded-lg border border-slate-300 text-slate-600">Cancel</button>
            <button onClick={submit} className="px-4 py-2 text-sm rounded-lg bg-[var(--accent-600)] text-[var(--button-text)] hover:bg-[var(--accent-700)]">Save Item</button>
          </div>
        </Modal>
      )}
      {viewing && (
        <Modal title="Item Details" ur="آئٹم کی تفصیلات" onClose={() => setViewing(null)}>
          <div className="space-y-1.5 text-sm">
            <div><span className="text-slate-500">Item:</span> <b>{viewing.itemName}</b></div>
            <div><span className="text-slate-500">Brand / Model:</span> {viewing.brand} {viewing.model}</div>
            <div><span className="text-slate-500">Category:</span> {viewing.category}</div>
            <div><span className="text-slate-500">IMEI 1:</span> <span className="font-mono">{viewing.imei1 || "-"}</span></div>
            <div><span className="text-slate-500">IMEI 2:</span> <span className="font-mono">{viewing.imei2 || "-"}</span></div>
            <div><span className="text-slate-500">RAM / Storage:</span> {viewing.ram} / {viewing.storage}</div>
            <div><span className="text-slate-500">Color:</span> {viewing.color}</div>
            <div><span className="text-slate-500">Condition:</span> {viewing.condition}</div>
            <div><span className="text-slate-500">Status:</span> <StatusBadge status={viewing.status} /></div>
            <div><span className="text-slate-500">Dealer:</span> {dealers.find(d => d.id === viewing.dealerId)?.name || "-"}</div>
            <div><span className="text-slate-500">Purchase Price:</span> {fmtMoney(viewing.purchasePrice)}{viewing.freightAllocated ? <span className="text-amber-600 text-xs"> (incl. {fmtMoney(viewing.freightAllocated)} freight/expenses)</span> : null}</div>
            <div><span className="text-slate-500">Retail Price:</span> {fmtMoney(viewing.retailPrice)}</div>
            <div><span className="text-slate-500">Minimum Price:</span> {fmtMoney(viewing.minPrice)}</div>
            <div><span className="text-slate-500">Accessories:</span> {ACCESSORY_KEYS.filter(a => viewing.accessories && viewing.accessories[a.key]).map(a => a.label).join(", ") || "None"}</div>
            <div><span className="text-slate-500">Date Added:</span> {fmtDate(viewing.dateAdded)}</div>
            {viewing.conditionPhoto && <div><div className="text-slate-500 mb-1">Condition Photo:</div><img src={viewing.conditionPhoto} className="h-24 rounded-lg border border-slate-200 object-cover" /></div>}
          </div>
        </Modal>
      )}
      {deleting && (
        <Modal title="Delete Item?" onClose={() => setDeleting(null)}>
          <p className="text-sm text-slate-600">Are you sure you want to delete <b>{deleting.itemName}</b>? This cannot be undone.</p>
          <ConfirmBar onCancel={() => setDeleting(null)} onConfirm={doDelete} />
        </Modal>
      )}
    </div>
  );
}

/* ============================ DEALERS TAB ============================ */
function blankDealer() { return { name: "", contactPerson: "", phone: "", city: "" }; }
function dealerBalance(data, dealerId) {
  const purch = data.purchases.filter(p => p.dealerId === dealerId).reduce((s, p) => s + (Number(p.totalAmount) || 0) - (Number(p.cashPaid) || 0) - (Number(p.onlinePaid) || 0), 0);
  const pay = data.dealerPayments.filter(p => p.dealerId === dealerId).reduce((s, p) => s + (Number(p.amount) || 0), 0);
  // Return to Dealer: a "ledger" (credit note) settlement reduces what we owe the dealer, exactly
  // like a payment. A "cash" settlement (dealer hands cash back) is recorded purely as an account
  // inflow instead (see accountBalance) and does NOT touch this balance a second time.
  const returns = (data.dealerReturns || []).filter(r => r.dealerId === dealerId && r.settlement !== "cash").reduce((s, r) => s + (Number(r.totalAmount) || 0), 0);
  return purch - pay - returns;
}
function dealerLastTxnDate(data, dealerId) {
  const dates = [
    ...data.purchases.filter(p => p.dealerId === dealerId).map(p => p.date),
    ...data.dealerPayments.filter(p => p.dealerId === dealerId).map(p => p.date),
    ...(data.dealerReturns || []).filter(r => r.dealerId === dealerId).map(r => r.date),
  ].filter(Boolean);
  return dates.length ? dates.sort().slice(-1)[0] : null;
}
function DealersTab({ data, setData, role, can, uiPrefs }) {
  const canAdd = can("add"), canEdit = can("edit"), canDelete = can("delete");
  const zebraOn = !!(uiPrefs && uiPrefs.zebraStripe && uiPrefs.zebraStripe.dealerLedger);
  const [showForm, setShowForm] = useState(false);
  const [editing, setEditing] = useState(null);
  const [dealer, setDealer] = useState(blankDealer());
  // Accordion: only one dealer's transaction breakdown is expanded at a time. The outer table
  // always shows just the one summary row per dealer (name/contact/balance/last txn); clicking
  // the row (or the Details button) toggles the nested panel below it.
  const [expandedDealerId, setExpandedDealerId] = useState(null);
  const [expandedPurchaseId, setExpandedPurchaseId] = useState(null); // 3-level dealer ledger: which purchase bill's item breakdown is open
  const [deleting, setDeleting] = useState(null);
  const [payAmount, setPayAmount] = useState("");
  const [payAccount, setPayAccount] = useState((data.accounts[0] && data.accounts[0].id) || "");
  const [payRef, setPayRef] = useState("");
  const [payNote, setPayNote] = useState("");
  const [deletingPay, setDeletingPay] = useState(null);

  const [query, setQuery] = useState("");
  const [statusFilter, setStatusFilter] = useState("all");
  const [sort, setSort] = useState("name:asc");

  function openAdd() { setDealer(blankDealer()); setEditing(null); setShowForm(true); }
  function openEdit(d) { setDealer(d); setEditing(d.id); setShowForm(true); }
  function submit() {
    if (!dealer.name.trim()) { alert("Dealer name required"); return; }
    if (editing) setData({ ...data, dealers: data.dealers.map(d => d.id === editing ? { ...dealer, id: editing } : d) });
    else setData({ ...data, dealers: [...data.dealers, { ...dealer, id: uid("dealer") }] });
    setShowForm(false);
  }
  function doDelete() {
    setData({ ...data, dealers: data.dealers.filter(d => d.id !== deleting.id) });
    if (expandedDealerId === deleting.id) setExpandedDealerId(null);
    setDeleting(null);
  }
  function toggleExpand(id) { setExpandedDealerId(prev => (prev === id ? null : id)); }
  const expandedDealer = expandedDealerId ? data.dealers.find(d => d.id === expandedDealerId) : null;
  useEffect(() => { setPayAmount(""); setPayNote(""); setPayRef(""); setExpandedPurchaseId(null); }, [expandedDealerId]);

  function recordPayment() {
    if (!expandedDealer) return;
    if (!payAmount || Number(payAmount) <= 0) { alert("Enter a valid amount"); return; }
    const acc = data.accounts.find(a => a.id === payAccount);
    const entry = { id: uid("pay"), dealerId: expandedDealer.id, amount: Number(payAmount), method: acc ? acc.type : "Cash", accountId: payAccount, bankRef: payRef, note: payNote, date: todayISO() };
    setData({ ...data, dealerPayments: [...data.dealerPayments, entry] });
    setPayAmount(""); setPayNote(""); setPayRef("");
  }
  function doDeletePay() { setData({ ...data, dealerPayments: data.dealerPayments.filter(p => p.id !== deletingPay.id) }); setDeletingPay(null); }

  // Parent grouped rows: one per dealer, with search + balance-status filter + sort applied here
  // so they keep working exactly as before against the summary rows (search/filter never touch
  // the itemized rows inside the expanded panel).
  const filtered = useMemo(() => {
    const q = query.trim().toLowerCase();
    let rows = data.dealers.filter(d => !q || [d.name, d.phone, d.contactPerson, d.city].some(v => (v || "").toLowerCase().includes(q)));
    const withBalance = rows.map(d => ({ ...d, __balance: dealerBalance(data, d.id), __lastTxn: dealerLastTxnDate(data, d.id) }));
    const statusFiltered = statusFilter === "all" ? withBalance : withBalance.filter(d => statusFilter === "payable" ? d.__balance > 0 : d.__balance <= 0);
    return sortRows(statusFiltered, sort, { name: d => d.name || "", balance: d => d.__balance });
  }, [data.dealers, data.purchases, data.dealerPayments, data.dealerReturns, query, statusFilter, sort]);

  // Itemized breakdown for whichever dealer is currently expanded (invoices, payments, running balance).
  const ledgerRows = useMemo(() => {
    if (!expandedDealer) return [];
    const purch = data.purchases.filter(p => p.dealerId === expandedDealer.id).map(p => {
      const paid = (Number(p.cashPaid) || 0) + (Number(p.onlinePaid) || 0);
      return { kind: "purchase", id: p.id, raw: p, type: "Purchase", date: p.date, ref: p.invoiceNumber, debit: Number(p.totalAmount) || 0, credit: paid, billRemaining: (Number(p.totalAmount) || 0) - paid };
    });
    const pays = data.dealerPayments.filter(p => p.dealerId === expandedDealer.id).map(p => {
      const acc = data.accounts.find(a => a.id === p.accountId);
      return { kind: "payment", id: p.id, raw: p, type: "Payment (" + (acc ? acc.name : p.method) + ")", date: p.date, ref: p.note || p.bankRef || "-", debit: 0, credit: Number(p.amount) || 0 };
    });
    const all = [...purch, ...pays].sort((a, b) => (a.date || "").localeCompare(b.date || ""));
    let running = 0;
    return all.map(r => { running += r.debit - r.credit; return { ...r, running }; });
  }, [data, expandedDealer]);

  return (
    <div>
      <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
        <h2 className="text-lg font-semibold text-slate-800"><Bi en="Dealer / Supplier Ledger" ur="ڈیلر کھاتہ" /></h2>
        {canAdd && <button onClick={openAdd} className="bg-[var(--accent-600)] hover:bg-[var(--accent-700)] text-[var(--button-text)] text-sm font-medium px-4 py-2 rounded-lg">+ Add Dealer / نیا ڈیلر</button>}
      </div>
      <ListFilterBar
        search={query} onSearch={setQuery} searchPlaceholder="Search dealer, contact, phone..."
        statusOptions={[{ value: "all", label: "All Dealers" }, { value: "payable", label: "Has Balance Payable" }, { value: "settled", label: "Fully Settled" }]}
        status={statusFilter} onStatus={setStatusFilter}
        sortOptions={[{ value: "name:asc", label: "Name: A-Z" }, { value: "name:desc", label: "Name: Z-A" }, { value: "balance:desc", label: "Balance: High to Low" }, { value: "balance:asc", label: "Balance: Low to High" }]}
        sort={sort} onSort={setSort}
      />
      <div className="bg-white rounded-xl border border-slate-200 overflow-x-auto">
        <table className="w-full text-sm">
          <thead className="bg-slate-50 text-slate-500 uppercase text-xs"><tr>
            <th className="text-left px-3 py-2 w-8"></th>
            <th className="text-left px-3 py-2">Dealer</th><th className="text-left px-3 py-2">Contact</th><th className="text-left px-3 py-2">Phone</th><th className="text-left px-3 py-2">City</th><th className="text-left px-3 py-2">Balance Payable</th><th className="text-left px-3 py-2">Last Transaction</th><th className="text-left px-3 py-2">Actions</th>
          </tr></thead>
          <tbody>
            {filtered.map((d, idx) => {
              const isOpen = expandedDealerId === d.id;
              return (
                <React.Fragment key={d.id}>
                  <tr className={"border-t-2 border-slate-300 hover:bg-slate-50 cursor-pointer" + (isOpen ? " bg-slate-50" : (zebraOn && idx % 2 === 1 ? " bg-slate-50" : " bg-white"))} onClick={() => toggleExpand(d.id)}>
                    <td className="px-3 py-2 text-slate-400">
                      <span className={"inline-block transition-transform duration-150" + (isOpen ? " rotate-90" : "")}>&#9656;</span>
                    </td>
                    <td className="px-3 py-2 font-medium text-slate-800">{d.name}</td>
                    <td className="px-3 py-2">{d.contactPerson}</td>
                    <td className="px-3 py-2">{d.phone}</td>
                    <td className="px-3 py-2">{d.city}</td>
                    <td className={"px-3 py-2 font-semibold " + (d.__balance > 0 ? "text-rose-600" : "text-emerald-600")}>{fmtMoney(d.__balance)}</td>
                    <td className="px-3 py-2 text-slate-500">{d.__lastTxn ? fmtDate(d.__lastTxn) : "-"}</td>
                    <td className="px-3 py-2" onClick={e => e.stopPropagation()}>
                      <div className="flex gap-2">
                        <button onClick={() => toggleExpand(d.id)} title={isOpen ? "Hide Details" : "View Ledger / Expand"} className="text-slate-500 hover:text-[var(--accent-600)] text-xs font-medium whitespace-nowrap">
                          {isOpen ? "\u25B4 Hide" : "\u25BE Details"}
                        </button>
                        {canEdit && <button onClick={() => openEdit(d)} title="Edit" className="text-slate-500 hover:text-[var(--accent-600)]">&#9998;</button>}
                        {canDelete && <button onClick={() => setDeleting(d)} title="Delete" className="text-slate-500 hover:text-rose-600">&#128465;</button>}
                      </div>
                    </td>
                  </tr>
                  {isOpen && (
                    <tr className="border-t border-slate-100 bg-slate-50/70">
                      <td colSpan="8" className="px-4 py-4">
                        <div className="mb-4 text-sm text-slate-600">Net Payable Balance: <b className={d.__balance > 0 ? "text-rose-600" : "text-emerald-600"}>{fmtMoney(d.__balance)}</b></div>
                        <div className="overflow-x-auto border border-slate-200 rounded-lg mb-4 bg-white">
                          <table className="w-full text-sm">
                            <thead className="bg-slate-50 text-slate-500 uppercase text-xs"><tr><th className="text-left px-3 py-2 w-6"></th><th className="text-left px-3 py-2">Date</th><th className="text-left px-3 py-2">Type</th><th className="text-left px-3 py-2">Bill / Ref</th><th className="text-right px-3 py-2">Billed</th><th className="text-right px-3 py-2">Paid</th><th className="text-right px-3 py-2">Bill Remaining</th><th className="text-right px-3 py-2">Running Balance</th><th className="text-right px-3 py-2"></th></tr></thead>
                            <tbody>
                              {ledgerRows.map((r, idx) => {
                                const isPurchase = r.kind === "purchase";
                                const isBillOpen = isPurchase && expandedPurchaseId === r.id;
                                const purchItems = isBillOpen ? (r.raw.items || []).map(iid => data.inventory.find(i => i.id === iid)).filter(Boolean) : [];
                                return (
                                  <React.Fragment key={idx}>
                                    <tr className={"border-t border-slate-100" + (isPurchase ? " cursor-pointer hover:bg-slate-50" : "")} onClick={isPurchase ? () => setExpandedPurchaseId(isBillOpen ? null : r.id) : undefined}>
                                      <td className="px-3 py-2 text-slate-400">{isPurchase && <span className={"inline-block transition-transform duration-150" + (isBillOpen ? " rotate-90" : "")}>&#9656;</span>}</td>
                                      <td className="px-3 py-2">{fmtDate(r.date)}</td><td className="px-3 py-2">{r.type}</td><td className="px-3 py-2">{r.ref}</td>
                                      <td className="px-3 py-2 text-right">{r.debit ? fmtMoney(r.debit) : "-"}</td><td className="px-3 py-2 text-right">{r.credit ? fmtMoney(r.credit) : "-"}</td>
                                      <td className="px-3 py-2 text-right">{isPurchase ? <span className={r.billRemaining > 0 ? "text-amber-600 font-medium" : "text-emerald-600 font-medium"}>{fmtMoney(Math.max(0, r.billRemaining))}</span> : "-"}</td>
                                      <td className="px-3 py-2 text-right font-medium">{fmtMoney(r.running)}</td>
                                      <td className="px-3 py-2 text-right" onClick={e => e.stopPropagation()}>{r.kind === "payment" && canDelete && <button onClick={() => setDeletingPay(r.raw)} className="text-slate-500 hover:text-rose-600">&#128465;</button>}</td>
                                    </tr>
                                    {isBillOpen && (
                                      <tr className="border-t border-slate-100 bg-slate-50/70">
                                        <td colSpan="9" className="px-4 py-3">
                                          <div className="text-xs font-semibold text-slate-500 uppercase mb-2">Items in this Bill</div>
                                          <div className="overflow-x-auto mb-2">
                                            <table className="w-full text-xs">
                                              <thead className="text-slate-400"><tr><th className="text-left py-1">Item</th><th className="text-left py-1">IMEI / Serial</th><th className="text-right py-1">Unit Purchase Price</th></tr></thead>
                                              <tbody>
                                                {purchItems.map(it => (
                                                  <tr key={it.id} className="border-t border-slate-100">
                                                    <td className="py-1">{it.itemName}{it.brand ? " (" + it.brand + ")" : ""}</td>
                                                    <td className="py-1">{it.imei1 || it.serialNumber || "-"}</td>
                                                    <td className="py-1 text-right">{fmtMoney(Number(it.purchasePrice) || 0)}</td>
                                                  </tr>
                                                ))}
                                                {purchItems.length === 0 && <tr><td colSpan="3" className="text-center text-slate-400 py-2">No item detail recorded for this bill</td></tr>}
                                              </tbody>
                                            </table>
                                          </div>
                                          <div className="text-xs text-slate-500">Paid via: {(r.raw.cashPaid ? "Cash " + fmtMoney(r.raw.cashPaid) : "")}{(r.raw.cashPaid && r.raw.onlinePaid) ? " + " : ""}{(r.raw.onlinePaid ? "Online " + fmtMoney(r.raw.onlinePaid) : "")}{(!r.raw.cashPaid && !r.raw.onlinePaid) ? "Not yet paid" : ""}</div>
                                        </td>
                                      </tr>
                                    )}
                                  </React.Fragment>
                                );
                              })}
                              {ledgerRows.length === 0 && <tr><td colSpan="9" className="text-center text-slate-400 py-6">No transactions yet</td></tr>}
                            </tbody>
                          </table>
                        </div>
                        {canAdd && (
                          <div className="border-t border-slate-200 pt-4">
                            <h4 className="text-sm font-semibold text-slate-700 mb-2">Record Payment to Dealer / ادائیگی درج کریں</h4>
                            <div className="flex flex-wrap gap-2 items-end">
                              <div><span className="text-xs text-slate-500">Amount</span><TextInput type="number" value={payAmount} onChange={e => setPayAmount(e.target.value)} className="w-32" /></div>
                              <div><span className="text-xs text-slate-500">Account</span><Select value={payAccount} onChange={e => setPayAccount(e.target.value)} options={data.accounts.map(a => ({ value: a.id, label: a.name }))} className="w-36" /></div>
                              <div><span className="text-xs text-slate-500">Bank Ref / Txn ID</span><TextInput value={payRef} onChange={e => setPayRef(e.target.value)} className="w-32" /></div>
                              <div className="flex-1 min-w-[150px]"><span className="text-xs text-slate-500">Note</span><TextInput value={payNote} onChange={e => setPayNote(e.target.value)} placeholder="optional" /></div>
                              <button onClick={recordPayment} className="bg-[var(--accent-600)] hover:bg-[var(--accent-700)] text-[var(--button-text)] text-sm px-4 py-2 rounded-lg">Add Payment</button>
                            </div>
                          </div>
                        )}
                      </td>
                    </tr>
                  )}
                </React.Fragment>
              );
            })}
            {filtered.length === 0 && <tr><td colSpan="8" className="text-center text-slate-400 py-8">No dealers yet / کوئی ڈیلر نہیں</td></tr>}
          </tbody>
        </table>
      </div>

      {showForm && (
        <Modal title={editing ? "Edit Dealer" : "Add Dealer"} ur="ڈیلر" onClose={() => setShowForm(false)}>
          <Field label="Dealer / Company Name" ur="ڈیلر کا نام" required><TextInput value={dealer.name} onChange={e => setDealer({ ...dealer, name: e.target.value })} /></Field>
          <Field label="Contact Person" ur="رابطہ کار"><TextInput value={dealer.contactPerson} onChange={e => setDealer({ ...dealer, contactPerson: e.target.value })} /></Field>
          <Field label="Phone" ur="فون"><TextInput value={dealer.phone} onChange={e => setDealer({ ...dealer, phone: e.target.value })} /></Field>
          <Field label="City" ur="شہر"><TextInput value={dealer.city} onChange={e => setDealer({ ...dealer, city: e.target.value })} /></Field>
          <div className="flex justify-end gap-2 mt-4">
            <button onClick={() => setShowForm(false)} className="px-4 py-2 text-sm rounded-lg border border-slate-300 text-slate-600">Cancel</button>
            <button onClick={submit} className="px-4 py-2 text-sm rounded-lg bg-[var(--accent-600)] text-[var(--button-text)] hover:bg-[var(--accent-700)]">Save</button>
          </div>
        </Modal>
      )}
      {deleting && (
        <Modal title="Delete Dealer?" onClose={() => setDeleting(null)}>
          <p className="text-sm text-slate-600">Delete <b>{deleting.name}</b>? Purchase/payment history linked to this dealer will remain but be unlinked.</p>
          <ConfirmBar onCancel={() => setDeleting(null)} onConfirm={doDelete} />
        </Modal>
      )}
      {deletingPay && (
        <Modal title="Delete Payment?" onClose={() => setDeletingPay(null)}>
          <p className="text-sm text-slate-600">Delete this payment of {fmtMoney(deletingPay.amount)}? The dealer's balance will be recalculated automatically.</p>
          <ConfirmBar onCancel={() => setDeletingPay(null)} onConfirm={doDeletePay} />
        </Modal>
      )}
    </div>
  );
}

/* ============================ PURCHASES TAB ============================ */
function blankBulk() { return { itemName: "", brand: "", model: "", category: "Mobile", condition: "New", ram: "", storage: "", color: "", purchasePrice: "", retailPrice: "", minPrice: "", imeisText: "", quantity: "1" }; }
function PurchasesTab({ data, setData, role, biz, erpSettings, can, uiPrefs }) {
  const canAdd = can("add"), canEdit = can("edit"), canDelete = can("delete");
  const zebraOn = !!(uiPrefs && uiPrefs.zebraStripe && uiPrefs.zebraStripe.purchases);
  const bizType = biz.businessType || "general";
  const purchaseFieldsUI = useFormCustomization(biz.id, bizType, "purchase");
  const [showForm, setShowForm] = useState(false);
  const [editingInvoice, setEditingInvoice] = useState(null);
  const [dealerId, setDealerId] = useState("");
  const [invoiceNumber, setInvoiceNumber] = useState("");
  const [totalAmount, setTotalAmount] = useState("");
  const [cashPaid, setCashPaid] = useState("");
  const [onlinePaid, setOnlinePaid] = useState("");
  const [date, setDate] = useState(todayISO());
  const [notes, setNotes] = useState("");
  const [freightCharges, setFreightCharges] = useState("");
  const [otherCharges, setOtherCharges] = useState("");
  const [pendingItems, setPendingItems] = useState([]);
  const [draftItem, setDraftItem] = useState(blankItem());
  const [bulkMode, setBulkMode] = useState(false);
  const [bulk, setBulk] = useState(blankBulk());
  const [viewing, setViewing] = useState(null);
  const [deleting, setDeleting] = useState(null);
  const remaining = (Number(totalAmount) || 0) - (Number(cashPaid) || 0) - (Number(onlinePaid) || 0);
  /* Landed cost: freight/other charges entered for this invoice are distributed across the items
     being added in this session, proportional to each item's own purchase price (equal split if
     none have a price yet) — so an expensive phone absorbs more of the freight than a cheap cable.
     The result becomes each item's actual purchasePrice everywhere else in the app (stock value,
     COGS, profit), with the pre-freight cost kept on the record as baseCost for transparency. */
  const totalExtraCharges = (Number(freightCharges) || 0) + (Number(otherCharges) || 0);
  const landedItems = useMemo(() => {
    const baseSum = pendingItems.reduce((s, i) => s + (Number(i.purchasePrice) || 0), 0);
    return pendingItems.map(i => {
      const base = Number(i.purchasePrice) || 0;
      const share = totalExtraCharges <= 0 ? 0 : (baseSum > 0 ? totalExtraCharges * (base / baseSum) : totalExtraCharges / pendingItems.length);
      return { ...i, baseCost: base, freightAllocated: Math.round(share), landedPrice: Math.round(base + share) };
    });
  }, [pendingItems, totalExtraCharges]);

  function addDraftItem() {
    if (!draftItem.itemName.trim()) { alert("Item name required"); return; }
    const cfg = categoryConfig(draftItem.category);
    // Same quantity-cloning rule as the standalone Inventory "Add Item" form: locked to 1 for
    // categories with a required unique ID, otherwise clones N identical rows into the queue.
    const qty = cfg.idRequired ? 1 : Math.max(1, Math.floor(Number(draftItem.quantity) || 1));
    const { quantity, ...rest } = draftItem;
    const rows = [];
    for (let n = 0; n < qty; n++) {
      const row = { ...rest, tempId: uid("tmp") };
      if (qty > 1 && cfg.idField) row[cfg.idField] = "";
      rows.push(row);
    }
    setPendingItems([...pendingItems, ...rows]);
    setDraftItem(blankItem());
  }
  function removeDraftItem(tempId) { setPendingItems(pendingItems.filter(i => i.tempId !== tempId)); }
  function addBulkItems() {
    if (!bulk.itemName.trim()) { alert("Item name required"); return; }
    const imeis = bulk.imeisText.split(/[\n,]/).map(s => s.trim()).filter(Boolean);
    const base = { itemName: bulk.itemName, brand: bulk.brand, model: bulk.model, category: bulk.category, condition: bulk.condition, ram: bulk.ram, storage: bulk.storage, color: bulk.color, purchasePrice: bulk.purchasePrice, retailPrice: bulk.retailPrice, minPrice: bulk.minPrice, accessories: { box: false, charger: false, cable: false, warranty: false }, status: "Available", imei2: "" };
    let newRows = [];
    if (imeis.length > 0) newRows = imeis.map(im => ({ ...base, imei1: im, tempId: uid("tmp") }));
    else { const qty = Math.max(1, Number(bulk.quantity) || 1); for (let i = 0; i < qty; i++) newRows.push({ ...base, imei1: "", tempId: uid("tmp") }); }
    setPendingItems([...pendingItems, ...newRows]);
    setBulk(blankBulk());
  }
  function resetForm() { setDealerId(""); setInvoiceNumber(""); setTotalAmount(""); setCashPaid(""); setOnlinePaid(""); setDate(todayISO()); setNotes(""); setFreightCharges(""); setOtherCharges(""); setPendingItems([]); setDraftItem(blankItem()); setBulk(blankBulk()); setEditingInvoice(null); }
  function openEditInvoice(p) {
    setEditingInvoice(p.id); setDealerId(p.dealerId); setInvoiceNumber(p.invoiceNumber); setTotalAmount(String(p.totalAmount));
    setCashPaid(String(p.cashPaid || 0)); setOnlinePaid(String(p.onlinePaid || 0)); setDate(p.date); setNotes(p.notes || "");
    setFreightCharges(""); setOtherCharges(""); setPendingItems([]); setShowForm(true);
  }
  function submitInvoice() {
    if (!dealerId) { alert("Select a dealer"); return; }
    if (!invoiceNumber.trim()) { alert("Enter dealer bill/invoice number"); return; }
    if (!totalAmount) { alert("Enter total bill amount"); return; }
    const freightNum = Number(freightCharges) || 0, otherNum = Number(otherCharges) || 0;
    if (editingInvoice) {
      const newItems = landedItems.map(({ tempId, purchasePrice, baseCost, freightAllocated, landedPrice, ...rest }) => ({ ...rest, id: uid("item"), dealerId, dateAdded: date, status: rest.status || "Available", purchasePrice: landedPrice, baseCost, freightAllocated }));
      setData({
        ...data,
        purchases: data.purchases.map(p => p.id === editingInvoice ? { ...p, dealerId, invoiceNumber, totalAmount: Number(totalAmount), cashPaid: Number(cashPaid) || 0, onlinePaid: Number(onlinePaid) || 0, date, notes, freightCharges: (Number(p.freightCharges) || 0) + freightNum, otherCharges: (Number(p.otherCharges) || 0) + otherNum, items: [...p.items, ...newItems.map(i => i.id)] } : p),
        inventory: [...data.inventory, ...newItems],
      });
    } else {
      const newItems = landedItems.map(({ tempId, purchasePrice, baseCost, freightAllocated, landedPrice, ...rest }) => ({ ...rest, id: uid("item"), dealerId, dateAdded: date, status: rest.status || "Available", purchasePrice: landedPrice, baseCost, freightAllocated }));
      const purchase = { id: uid("pur"), dealerId, invoiceNumber, totalAmount: Number(totalAmount), cashPaid: Number(cashPaid) || 0, onlinePaid: Number(onlinePaid) || 0, date, notes, freightCharges: freightNum, otherCharges: otherNum, items: newItems.map(i => i.id) };
      setData({ ...data, purchases: [...data.purchases, purchase], inventory: [...data.inventory, ...newItems] });
    }
    resetForm(); setShowForm(false);
  }
  function doDeleteInvoice() {
    setData({ ...data, purchases: data.purchases.filter(p => p.id !== deleting.id), inventory: data.inventory.filter(i => !deleting.items.includes(i.id)) });
    setDeleting(null);
  }

  return (
    <div>
      <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
        <h2 className="text-lg font-semibold text-slate-800"><Bi en="Purchase Invoices" ur="خریداری کے بل" /></h2>
        {canAdd && <button onClick={() => { resetForm(); setShowForm(true); }} className="bg-[var(--accent-600)] hover:bg-[var(--accent-700)] text-[var(--button-text)] text-sm font-medium px-4 py-2 rounded-lg">+ New Purchase Invoice</button>}
      </div>
      <div className="bg-white rounded-xl border border-slate-200 overflow-x-auto">
        <table className="w-full text-sm">
          <thead className="bg-slate-50 text-slate-500 uppercase text-xs"><tr><th className="text-left px-3 py-2">Date</th><th className="text-left px-3 py-2">Dealer</th><th className="text-left px-3 py-2">Invoice #</th><th className="text-left px-3 py-2">Total</th><th className="text-left px-3 py-2">Paid</th><th className="text-left px-3 py-2">Remaining</th><th className="text-left px-3 py-2">Items</th><th className="text-left px-3 py-2">Actions</th></tr></thead>
          <tbody>
            {[...data.purchases].sort((a, b) => (b.date || "").localeCompare(a.date || "")).map((p, idx) => {
              const paid = (Number(p.cashPaid) || 0) + (Number(p.onlinePaid) || 0);
              const rem = (Number(p.totalAmount) || 0) - paid;
              return (
                <tr key={p.id} className={"border-t-2 border-slate-300 hover:bg-slate-50" + (zebraOn && idx % 2 === 1 ? " bg-slate-50" : " bg-white")}>
                  <td className="px-3 py-2">{fmtDate(p.date)}</td><td className="px-3 py-2">{data.dealers.find(d => d.id === p.dealerId)?.name || "-"}</td><td className="px-3 py-2">{p.invoiceNumber}</td>
                  <td className="px-3 py-2">{fmtMoney(p.totalAmount)}</td><td className="px-3 py-2">{fmtMoney(paid)}</td>
                  <td className={"px-3 py-2 font-medium " + (rem > 0 ? "text-rose-600" : "text-emerald-600")}>{fmtMoney(rem)}</td>
                  <td className="px-3 py-2">{p.items.length}{(Number(p.freightCharges) || Number(p.otherCharges)) ? <span className="text-amber-600 text-xs block">+{fmtMoney((Number(p.freightCharges) || 0) + (Number(p.otherCharges) || 0))} freight</span> : null}</td>
                  <td className="px-3 py-2">
                    <div className="flex gap-2">
                      <button onClick={() => setViewing(p)} title="View" className="text-slate-500 hover:text-[var(--accent-600)]">&#128065;</button>
                      {canEdit && <button onClick={() => openEditInvoice(p)} title="Edit" className="text-slate-500 hover:text-[var(--accent-600)]">&#9998;</button>}
                      {canDelete && <button onClick={() => setDeleting(p)} title="Delete" className="text-slate-500 hover:text-rose-600">&#128465;</button>}
                    </div>
                  </td>
                </tr>
              );
            })}
            {data.purchases.length === 0 && <tr><td colSpan="8" className="text-center text-slate-400 py-8">No purchase invoices yet</td></tr>}
          </tbody>
        </table>
      </div>
      {showForm && (
        <Modal title={editingInvoice ? "Edit Purchase Invoice" : "New Purchase Invoice"} ur="بل" onClose={() => { setShowForm(false); resetForm(); }} wide>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-x-4">
            <Field label="Dealer" ur="ڈیلر" required><Select value={dealerId} onChange={e => setDealerId(e.target.value)} options={[{ value: "", label: "-- Select --" }, ...data.dealers.map(d => ({ value: d.id, label: d.name }))]} /></Field>
            <Field label="Dealer Bill / Invoice Number" ur="بل نمبر" required><TextInput value={invoiceNumber} onChange={e => setInvoiceNumber(e.target.value)} /></Field>
            <Field label="Date" ur="تاریخ"><TextInput type="date" value={date} onChange={e => setDate(e.target.value)} /></Field>
            <Field label="Total Bill Amount" ur="کل رقم" required><TextInput type="number" value={totalAmount} onChange={e => setTotalAmount(e.target.value)} /></Field>
            <Field label="Cash Paid" ur="نقد ادائیگی"><TextInput type="number" value={cashPaid} onChange={e => setCashPaid(e.target.value)} /></Field>
            <Field label="Online Paid" ur="آن لائن ادائیگی"><TextInput type="number" value={onlinePaid} onChange={e => setOnlinePaid(e.target.value)} /></Field>
            <Field label="Freight / Shipping Charges" ur="مال برداری خرچہ"><TextInput type="number" value={freightCharges} onChange={e => setFreightCharges(e.target.value)} placeholder="0" /></Field>
            <Field label="Other Expenses (customs, labor, etc.)" ur="دیگر اخراجات"><TextInput type="number" value={otherCharges} onChange={e => setOtherCharges(e.target.value)} placeholder="0" /></Field>
          </div>
          {totalExtraCharges > 0 && (
            <div className="text-xs text-slate-500 -mt-2 mb-3">{fmtMoney(totalExtraCharges)} in additional charges will be spread across the items added below, added to each item's purchase price (landed cost) — not charged separately to the dealer.</div>
          )}
          {purchaseFieldsUI.isVisible("showNotes") && (
            <Field label={purchaseFieldsUI.labelFor("showNotes")} ur="نوٹس"><textarea rows={2} value={notes} onChange={e => setNotes(e.target.value)} className={inputCls} /></Field>
          )}
          <div className="text-sm mb-4">Remaining Payable: <b className={remaining > 0 ? "text-rose-600" : "text-emerald-600"}>{fmtMoney(remaining)}</b></div>
          <div className="border-t border-slate-200 pt-4">
            <div className="flex items-center justify-between mb-2">
              <h4 className="text-sm font-semibold text-slate-700">Add Items to this Bill / اس بل کے آئٹمز</h4>
              <div className="flex gap-1 text-xs">
                <button onClick={() => setBulkMode(false)} className={"px-2 py-1 rounded-lg " + (!bulkMode ? "bg-[var(--accent-600)] text-[var(--button-text)]" : "bg-slate-100 text-slate-600")}>Single Item</button>
                <button onClick={() => setBulkMode(true)} className={"px-2 py-1 rounded-lg " + (bulkMode ? "bg-[var(--accent-600)] text-[var(--button-text)]" : "bg-slate-100 text-slate-600")}>Bulk IMEIs</button>
              </div>
            </div>
            {!bulkMode ? (
              <div className="bg-slate-50 rounded-lg p-3 mb-3">
                <ItemFormFields item={draftItem} setItem={setDraftItem} dealers={data.dealers} categories={allCategories(data)} presets={data.customItemPresets} isNew bizId={biz.id} bizType={biz.businessType} erpSettings={erpSettings} />
                <button onClick={addDraftItem} className="mt-1 bg-slate-700 hover:bg-slate-800 text-white text-sm px-3 py-1.5 rounded-lg">+ Add Item to List</button>
              </div>
            ) : (
              <div className="bg-slate-50 rounded-lg p-3 mb-3">
                <div className="grid grid-cols-1 md:grid-cols-2 gap-x-4">
                  <Field label="Item Name (common)" ur="آئٹم کا نام" required><TextInput value={bulk.itemName} onChange={e => setBulk({ ...bulk, itemName: e.target.value })} placeholder="e.g. Samsung A15" /></Field>
                  <Field label="Brand / Model" ur="برانڈ / ماڈل"><div className="flex gap-2"><TextInput value={bulk.brand} onChange={e => setBulk({ ...bulk, brand: e.target.value })} placeholder="Brand" /><TextInput value={bulk.model} onChange={e => setBulk({ ...bulk, model: e.target.value })} placeholder="Model" /></div></Field>
                  <Field label="Category" ur="قسم"><Select value={bulk.category} onChange={e => setBulk({ ...bulk, category: e.target.value })} options={allCategories(data)} /></Field>
                  <Field label="Condition" ur="حالت"><Select value={bulk.condition} onChange={e => setBulk({ ...bulk, condition: e.target.value })} options={CONDITIONS} /></Field>
                  <Field label="RAM / Storage" ur="ریم / اسٹوریج"><div className="flex gap-2"><TextInput value={bulk.ram} onChange={e => setBulk({ ...bulk, ram: e.target.value })} placeholder="RAM" /><TextInput value={bulk.storage} onChange={e => setBulk({ ...bulk, storage: e.target.value })} placeholder="Storage" /></div></Field>
                  <Field label="Color" ur="رنگ"><TextInput value={bulk.color} onChange={e => setBulk({ ...bulk, color: e.target.value })} /></Field>
                  <Field label="Purchase Price (each)" ur="خرید قیمت"><TextInput type="number" value={bulk.purchasePrice} onChange={e => setBulk({ ...bulk, purchasePrice: e.target.value })} /></Field>
                  <Field label="Retail Price (each)" ur="فروخت قیمت"><TextInput type="number" value={bulk.retailPrice} onChange={e => setBulk({ ...bulk, retailPrice: e.target.value })} /></Field>
                  <Field label="Minimum Price (each)" ur="کم از کم قیمت"><TextInput type="number" value={bulk.minPrice} onChange={e => setBulk({ ...bulk, minPrice: e.target.value })} /></Field>
                  <Field label="Quantity (if no IMEIs, e.g. accessories)" ur="تعداد"><TextInput type="number" value={bulk.quantity} onChange={e => setBulk({ ...bulk, quantity: e.target.value })} /></Field>
                </div>
                <Field label="Paste / Scan Multiple IMEIs (comma or newline separated)" ur="آئی ایم ای آئی کی فہرست">
                  <textarea value={bulk.imeisText} onChange={e => setBulk({ ...bulk, imeisText: e.target.value })} rows="4" className={inputCls} placeholder={"356789012345671\n356789012345672\n356789012345673"}></textarea>
                </Field>
                <div className="text-xs text-slate-500 mb-2">{bulk.imeisText.split(/[\n,]/).map(s => s.trim()).filter(Boolean).length} IMEIs detected — one stock record will be created per IMEI (or by quantity if left blank).</div>
                <button onClick={addBulkItems} className="bg-slate-700 hover:bg-slate-800 text-white text-sm px-3 py-1.5 rounded-lg">+ Add Bulk Items to List</button>
              </div>
            )}
            {pendingItems.length > 0 && (
              <div className="border border-slate-200 rounded-lg overflow-x-auto mb-3">
                <table className="w-full text-xs">
                  <thead className="bg-slate-50 text-slate-500 uppercase"><tr><th className="text-left px-2 py-1">Item</th><th className="text-left px-2 py-1">IMEI 1</th><th className="text-left px-2 py-1">Base Price</th>{totalExtraCharges > 0 && <><th className="text-left px-2 py-1">+ Freight</th><th className="text-left px-2 py-1">Landed Cost</th></>}<th></th></tr></thead>
                  <tbody>{landedItems.map(i => (<tr key={i.tempId} className="border-t border-slate-100"><td className="px-2 py-1">{i.itemName}</td><td className="px-2 py-1 font-mono">{i.imei1 || "-"}</td><td className="px-2 py-1">{fmtMoney(i.baseCost)}</td>{totalExtraCharges > 0 && <><td className="px-2 py-1 text-amber-600">+{fmtMoney(i.freightAllocated)}</td><td className="px-2 py-1 font-medium">{fmtMoney(i.landedPrice)}</td></>}<td className="px-2 py-1 text-right"><button onClick={() => removeDraftItem(i.tempId)} className="text-rose-500">&#128465;</button></td></tr>))}</tbody>
                </table>
                <div className="text-xs text-slate-500 px-2 py-1">{pendingItems.length} item(s) queued for this bill{totalExtraCharges > 0 ? " — purchase price shown includes allocated freight/expenses" : ""}.</div>
              </div>
            )}
          </div>
          <div className="flex justify-end gap-2 mt-4">
            <button onClick={() => { setShowForm(false); resetForm(); }} className="px-4 py-2 text-sm rounded-lg border border-slate-300 text-slate-600">Cancel</button>
            <button onClick={submitInvoice} className="px-4 py-2 text-sm rounded-lg bg-[var(--accent-600)] text-[var(--button-text)] hover:bg-[var(--accent-700)]">Save Purchase Invoice</button>
          </div>
        </Modal>
      )}
      {deleting && (
        <Modal title="Delete Purchase Invoice?" onClose={() => setDeleting(null)}>
          <p className="text-sm text-slate-600">Delete invoice <b>{deleting.invoiceNumber}</b>? This will also remove its {deleting.items.length} linked stock item(s) from Inventory. This cannot be undone.</p>
          <ConfirmBar onCancel={() => setDeleting(null)} onConfirm={doDeleteInvoice} />
        </Modal>
      )}
      {viewing && (
        <Modal title={"Invoice " + viewing.invoiceNumber} onClose={() => setViewing(null)} wide>
          <div className="text-sm space-y-1 mb-3">
            <div>Dealer: <b>{data.dealers.find(d => d.id === viewing.dealerId)?.name || "-"}</b></div>
            <div>Date: {fmtDate(viewing.date)}</div>
            <div>Total: {fmtMoney(viewing.totalAmount)} | Cash: {fmtMoney(viewing.cashPaid)} | Online: {fmtMoney(viewing.onlinePaid)}</div>
            {(Number(viewing.freightCharges) || Number(viewing.otherCharges)) ? (
              <div className="text-amber-600">Freight: {fmtMoney(viewing.freightCharges)} | Other Expenses: {fmtMoney(viewing.otherCharges)} — included in item purchase prices below</div>
            ) : null}
          </div>
          <div className="border border-slate-200 rounded-lg overflow-x-auto">
            <table className="w-full text-xs">
              <thead className="bg-slate-50 text-slate-500 uppercase"><tr><th className="text-left px-2 py-1">Item</th><th className="text-left px-2 py-1">IMEI 1</th><th className="text-left px-2 py-1">Purchase Price</th><th className="text-left px-2 py-1">Status</th></tr></thead>
              <tbody>{data.inventory.filter(i => viewing.items.includes(i.id)).map(i => (<tr key={i.id} className="border-t border-slate-100"><td className="px-2 py-1">{i.itemName}</td><td className="px-2 py-1 font-mono">{i.imei1 || "-"}</td><td className="px-2 py-1">{fmtMoney(i.purchasePrice)}{i.freightAllocated ? <span className="text-amber-600"> (incl. {fmtMoney(i.freightAllocated)} freight)</span> : null}</td><td className="px-2 py-1"><StatusBadge status={i.status} /></td></tr>))}</tbody>
            </table>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ============================ CUSTOM ITEMS / CATEGORIES TAB ============================ */
function blankPreset() { return { name: "", category: "Mobile", brand: "", model: "", ram: "", storage: "", color: "", purchasePrice: "", retailPrice: "", minPrice: "" }; }
function CustomItemsTab({ data, setData, role, can }) {
  const canAdd = can("add"), canEdit = can("edit"), canDelete = can("delete");
  const [newCategory, setNewCategory] = useState("");
  const [preset, setPreset] = useState(blankPreset());
  const [editingPreset, setEditingPreset] = useState(null);
  const [deletingPreset, setDeletingPreset] = useState(null);
  const [deletingCategory, setDeletingCategory] = useState(null);

  function addCategory() {
    const name = newCategory.trim();
    if (!name) { alert("Enter a category name"); return; }
    if (CATEGORIES.includes(name) || (data.customCategories || []).includes(name)) { alert("This category already exists."); return; }
    setData({ ...data, customCategories: [...(data.customCategories || []), name] });
    setNewCategory("");
  }
  function removeCategory(name) { setData({ ...data, customCategories: (data.customCategories || []).filter(c => c !== name) }); setDeletingCategory(null); }
  function openAddPreset() { setPreset(blankPreset()); setEditingPreset(null); }
  function openEditPreset(p) { setPreset(p); setEditingPreset(p.id); }
  function savePreset() {
    if (!preset.name.trim()) { alert("Preset name is required"); return; }
    if (editingPreset) setData({ ...data, customItemPresets: (data.customItemPresets || []).map(p => p.id === editingPreset ? { ...preset, id: editingPreset } : p) });
    else setData({ ...data, customItemPresets: [...(data.customItemPresets || []), { ...preset, id: uid("preset") }] });
    setPreset(blankPreset()); setEditingPreset(null);
  }
  function doDeletePreset() { setData({ ...data, customItemPresets: (data.customItemPresets || []).filter(p => p.id !== deletingPreset.id) }); setDeletingPreset(null); }

  return (
    <div>
      <h3 className="text-sm font-semibold text-slate-700 mb-1">Custom Items & Categories <span className="urdu text-slate-400 text-xs">/ اپنی مرضی کے آئٹمز</span></h3>
      <p className="text-xs text-slate-500 mb-4">Add your own product categories and reusable item presets/templates for anything not already built into the system. These become available immediately across Inventory and Purchases.</p>

      <div className="bg-white rounded-xl border border-slate-200 p-4 mb-6">
        <h3 className="text-sm font-semibold text-slate-700 mb-3">Custom Categories <span className="urdu text-slate-400 text-xs">/ اپنی قسمیں</span></h3>
        {canAdd && (
          <div className="flex flex-wrap gap-2 mb-3">
            <TextInput value={newCategory} onChange={e => setNewCategory(e.target.value)} placeholder="e.g. Washing Machine, Kitchen Appliance..." className="max-w-xs" />
            <button onClick={addCategory} className="bg-[var(--accent-600)] hover:bg-[var(--accent-700)] text-[var(--button-text)] text-sm font-medium px-4 py-2 rounded-lg">+ Add Category</button>
          </div>
        )}
        <div className="flex flex-wrap gap-2">
          {CATEGORIES.map(c => (<span key={c} className="text-xs bg-slate-100 text-slate-500 px-2.5 py-1 rounded-full">{c} <span className="text-slate-400">(built-in)</span></span>))}
          {(data.customCategories || []).map(c => (
            <span key={c} className="text-xs bg-[var(--accent-50)] text-[var(--accent-700)] px-2.5 py-1 rounded-full flex items-center gap-1.5">
              {c}
              {canDelete && <button onClick={() => setDeletingCategory(c)} title="Remove" className="text-[var(--accent-400)] hover:text-rose-600 font-bold">&times;</button>}
            </span>
          ))}
          {(data.customCategories || []).length === 0 && <span className="text-xs text-slate-400">No custom categories added yet.</span>}
        </div>
      </div>

      <div className="bg-white rounded-xl border border-slate-200 p-4">
        <h3 className="text-sm font-semibold text-slate-700 mb-3">Custom Item Presets / Product Templates</h3>
        {(canAdd || canEdit) && (
          <div className="bg-slate-50 rounded-lg p-3 mb-4">
            <div className="grid grid-cols-1 md:grid-cols-3 gap-x-4">
              <Field label="Preset Name" ur="نام" required><TextInput value={preset.name} onChange={e => setPreset({ ...preset, name: e.target.value })} placeholder="e.g. Dawlance Washing Machine 8kg" /></Field>
              <Field label="Category" ur="قسم"><Select value={preset.category} onChange={e => setPreset({ ...preset, category: e.target.value })} options={allCategories(data)} /></Field>
              <Field label="Brand" ur="برانڈ"><TextInput value={preset.brand} onChange={e => setPreset({ ...preset, brand: e.target.value })} /></Field>
              <Field label="Model" ur="ماڈل"><TextInput value={preset.model} onChange={e => setPreset({ ...preset, model: e.target.value })} /></Field>
              <Field label="RAM / Storage (if applicable)" ur="ریم / اسٹوریج"><div className="flex gap-2"><TextInput value={preset.ram} onChange={e => setPreset({ ...preset, ram: e.target.value })} placeholder="RAM" /><TextInput value={preset.storage} onChange={e => setPreset({ ...preset, storage: e.target.value })} placeholder="Storage" /></div></Field>
              <Field label="Color" ur="رنگ"><TextInput value={preset.color} onChange={e => setPreset({ ...preset, color: e.target.value })} /></Field>
              <Field label="Default Purchase Price" ur="خرید قیمت"><TextInput type="number" value={preset.purchasePrice} onChange={e => setPreset({ ...preset, purchasePrice: e.target.value })} /></Field>
              <Field label="Default Retail Price" ur="فروخت قیمت"><TextInput type="number" value={preset.retailPrice} onChange={e => setPreset({ ...preset, retailPrice: e.target.value })} /></Field>
              <Field label="Default Minimum Price" ur="کم از کم قیمت"><TextInput type="number" value={preset.minPrice} onChange={e => setPreset({ ...preset, minPrice: e.target.value })} /></Field>
            </div>
            <div className="flex gap-2 mt-2">
              {(editingPreset ? canEdit : canAdd) && <button onClick={savePreset} className="bg-slate-700 hover:bg-slate-800 text-white text-sm px-3 py-1.5 rounded-lg">{editingPreset ? "Update Preset" : "+ Add Preset"}</button>}
              {editingPreset && <button onClick={openAddPreset} className="px-3 py-1.5 text-sm rounded-lg border border-slate-300 text-slate-600">Cancel Edit</button>}
            </div>
          </div>
        )}
        <div className="border border-slate-200 rounded-lg overflow-x-auto">
          <table className="w-full text-sm">
            <thead className="bg-slate-50 text-slate-500 uppercase text-xs"><tr><th className="text-left px-3 py-2">Preset</th><th className="text-left px-3 py-2">Category</th><th className="text-left px-3 py-2">Brand/Model</th><th className="text-left px-3 py-2">Retail Price</th><th className="text-left px-3 py-2">Actions</th></tr></thead>
            <tbody>
              {(data.customItemPresets || []).map(p => (
                <tr key={p.id} className="border-t border-slate-100 hover:bg-slate-50">
                  <td className="px-3 py-2 font-medium text-slate-800">{p.name}</td>
                  <td className="px-3 py-2">{p.category}</td>
                  <td className="px-3 py-2">{p.brand} {p.model}</td>
                  <td className="px-3 py-2">{fmtMoney(p.retailPrice)}</td>
                  <td className="px-3 py-2">
                    <div className="flex gap-2">
                      {canEdit && <button onClick={() => openEditPreset(p)} title="Edit" className="text-slate-500 hover:text-[var(--accent-600)]">&#9998;</button>}
                      {canDelete && <button onClick={() => setDeletingPreset(p)} title="Delete" className="text-slate-500 hover:text-rose-600">&#128465;</button>}
                    </div>
                  </td>
                </tr>
              ))}
              {(data.customItemPresets || []).length === 0 && <tr><td colSpan="5" className="text-center text-slate-400 py-8">No custom item presets yet. Add one above to quick-fill items in Inventory/Purchases.</td></tr>}
            </tbody>
          </table>
        </div>
      </div>

      {deletingCategory && (
        <Modal title="Delete Category?" onClose={() => setDeletingCategory(null)}>
          <p className="text-sm text-slate-600">Remove custom category <b>{deletingCategory}</b>? Existing items already using it will keep showing it, but it will no longer appear in dropdowns.</p>
          <ConfirmBar onCancel={() => setDeletingCategory(null)} onConfirm={() => removeCategory(deletingCategory)} />
        </Modal>
      )}
      {deletingPreset && (
        <Modal title="Delete Preset?" onClose={() => setDeletingPreset(null)}>
          <p className="text-sm text-slate-600">Delete preset <b>{deletingPreset.name}</b>? This cannot be undone.</p>
          <ConfirmBar onCancel={() => setDeletingPreset(null)} onConfirm={doDeletePreset} />
        </Modal>
      )}
    </div>
  );
}

/* ============================ INSTALLMENT PANEL (shared) ============================ */
function InstallmentPanel({ data, setData, sale, biz, currentUserName, can }) {
  const canAdd = can ? can("add") : true, canEdit = can ? can("edit") : true, canDelete = can ? can("delete") : true;
  const items = saleItemsSummary(sale, data);
  const customer = data.customers.find(c => c.id === sale.customerId) || (sale.customerPhone ? { name: sale.customerName, phone: sale.customerPhone } : null);
  const credit = saleCredit(sale);
  const next = nextDueInfo(sale);
  const paidMonths = (sale.installmentPayments || []).filter(p => p.type === "payment" && p.month).map(p => p.month);
  const remainingMonths = (sale.installmentPlan || []).filter(pl => !paidMonths.includes(pl.month));

  const [showPay, setShowPay] = useState(false);
  const [payMonth, setPayMonth] = useState(remainingMonths[0] ? String(remainingMonths[0].month) : "");
  const [payAmount, setPayAmount] = useState(remainingMonths[0] ? String(remainingMonths[0].amount) : "");
  const [payReceipt, setPayReceipt] = useState("");
  const [payDate, setPayDate] = useState(todayISO());
  const [payAccount, setPayAccount] = useState((data.accounts[0] && data.accounts[0].id) || "");
  const [payRef, setPayRef] = useState("");
  const [payPhoto, setPayPhoto] = useState("");
  const [showDiscount, setShowDiscount] = useState(false);
  const [discAmount, setDiscAmount] = useState("");
  const [discNote, setDiscNote] = useState("");
  const [editingPaymentId, setEditingPaymentId] = useState(null);
  const [deletingPayment, setDeletingPayment] = useState(null);
  const [viewingPhoto, setViewingPhoto] = useState("");
  const [showImageReceipt, setShowImageReceipt] = useState(false);
  const [showImageReminder, setShowImageReminder] = useState(false);
  const pdfNodeRef = useRef(null);

  function submitPayment() {
    if (!payAmount || Number(payAmount) <= 0) { alert("Enter valid amount"); return; }
    if (editingPaymentId) {
      setData({ ...data, sales: data.sales.map(s => s.id === sale.id ? { ...s, installmentPayments: s.installmentPayments.map(p => p.id === editingPaymentId ? { ...p, month: payMonth ? Number(payMonth) : null, amount: Number(payAmount), manualReceiptNumber: payReceipt, date: payDate, accountId: payAccount, bankRef: payRef, photo: payPhoto } : p) } : s) });
    } else {
      const entry = { id: uid("ip"), type: "payment", month: payMonth ? Number(payMonth) : null, amount: Number(payAmount), manualReceiptNumber: payReceipt, date: payDate, accountId: payAccount, bankRef: payRef, photo: payPhoto, collectedBy: currentUserName };
      setData({ ...data, sales: data.sales.map(s => s.id === sale.id ? { ...s, installmentPayments: [...(s.installmentPayments || []), entry] } : s) });
    }
    setShowPay(false); setEditingPaymentId(null); setPayAmount(""); setPayReceipt(""); setPayRef(""); setPayPhoto("");
  }
  function submitDiscount() {
    if (!discAmount || Number(discAmount) <= 0) { alert("Enter valid amount"); return; }
    const entry = { id: uid("disc"), type: "discount", amount: Number(discAmount), note: discNote, date: todayISO(), collectedBy: currentUserName };
    setData({ ...data, sales: data.sales.map(s => s.id === sale.id ? { ...s, installmentPayments: [...(s.installmentPayments || []), entry] } : s) });
    setShowDiscount(false); setDiscAmount(""); setDiscNote("");
  }
  function startEditPayment(p) {
    setEditingPaymentId(p.id); setPayMonth(p.month ? String(p.month) : ""); setPayAmount(String(p.amount)); setPayReceipt(p.manualReceiptNumber || ""); setPayDate(p.date || todayISO()); setPayAccount(p.accountId || (data.accounts[0] && data.accounts[0].id) || ""); setPayRef(p.bankRef || ""); setPayPhoto(p.photo || ""); setShowPay(true); setShowDiscount(false);
  }
  function doDeletePayment() {
    setData({ ...data, sales: data.sales.map(s => s.id === sale.id ? { ...s, installmentPayments: s.installmentPayments.filter(p => p.id !== deletingPayment.id) } : s) });
    setDeletingPayment(null);
  }
  const waReceiptLink = customer && customer.phone ? waLink(customer.phone, buildReceiptMessage(biz, sale, items, customer)) : null;
  const dueInfo = next ? { next, overdue: new Date(next.dueDate) < new Date(todayISO()) } : null;
  const waReminderLink = customer && customer.phone ? waLink(customer.phone, buildReminderMessage(biz, sale, items, customer, dueInfo)) : null;

  return (
    <div className="bg-slate-50 border border-slate-200 rounded-lg p-3 mt-2 text-sm">
      <div className="flex flex-wrap gap-4 mb-2">
        <div>Remaining: <b className={credit.remaining > 0 ? "text-amber-600" : "text-emerald-600"}>{fmtMoney(credit.remaining)}</b></div>
        {next && <div>Next Due: <b>{fmtDate(next.dueDate)}</b> (Installment {next.month}, {fmtMoney(next.amount)})</div>}
        {credit.discountGiven > 0 && <div>Discount Given: {fmtMoney(credit.discountGiven)}</div>}
      </div>
      <div className="flex flex-wrap gap-2 mb-2">
        {credit.remaining > 0 && canAdd && <button onClick={() => { setEditingPaymentId(null); setShowPay(!showPay); setPayPhoto(""); }} className="bg-[var(--accent-600)] text-[var(--button-text)] text-xs px-3 py-1.5 rounded-lg">Record Payment</button>}
        {credit.remaining > 0 && canAdd && <button onClick={() => setShowDiscount(!showDiscount)} className="bg-slate-600 text-white text-xs px-3 py-1.5 rounded-lg">Grant Discount / Waiver</button>}
        {waReceiptLink && <a href={waReceiptLink} target="_blank" rel="noreferrer" className="bg-emerald-600 text-white text-xs px-3 py-1.5 rounded-lg no-underline">WhatsApp Receipt</a>}
        <button onClick={() => setShowImageReceipt(true)} className="bg-emerald-700 text-white text-xs px-3 py-1.5 rounded-lg">WhatsApp Image Receipt</button>
        <button onClick={() => printReceiptNode(pdfNodeRef.current, "Receipt " + (sale.invoiceId || ""))} className="bg-slate-800 text-white text-xs px-3 py-1.5 rounded-lg">Print / Save PDF</button>
        {credit.remaining > 0 && waReminderLink && <a href={waReminderLink} target="_blank" rel="noreferrer" className="bg-amber-600 text-white text-xs px-3 py-1.5 rounded-lg no-underline">WhatsApp Reminder</a>}
        {credit.remaining > 0 && <button onClick={() => setShowImageReminder(true)} className="bg-amber-700 text-white text-xs px-3 py-1.5 rounded-lg">WhatsApp Image Reminder</button>}
      </div>
      {/* Off-screen, always-rendered ReceiptDesign so "Print / Save PDF" above stays a single click —
          it prints this exact branded node's markup instead of a separate plain template. */}
      <div style={{ position: "fixed", top: 0, left: "-99999px", zIndex: -1 }} aria-hidden="true">
        <ReceiptDesign biz={biz} sale={sale} items={items} customer={customer} data={data} innerRef={pdfNodeRef} />
      </div>
      {showPay && (
        <div className="bg-white border border-slate-200 rounded-lg p-3 mb-2 grid grid-cols-1 md:grid-cols-2 gap-2">
          <Field label="Due Installment #" ur="قسط نمبر"><Select value={payMonth} onChange={e => { const m = e.target.value; setPayMonth(m); const pl = remainingMonths.find(x => String(x.month) === m); if (pl) setPayAmount(String(pl.amount)); }} options={[{ value: "", label: "-- General Payment --" }, ...remainingMonths.map(pl => ({ value: String(pl.month), label: "# " + pl.month + " (due " + fmtDate(pl.dueDate) + ") - " + fmtMoney(pl.amount) }))]} /></Field>
          <Field label="Amount Paid" ur="ادا شدہ رقم"><TextInput type="number" value={payAmount} onChange={e => setPayAmount(e.target.value)} /></Field>
          <Field label="Manual Receipt #" ur="رسید نمبر"><TextInput value={payReceipt} onChange={e => setPayReceipt(e.target.value)} /></Field>
          <Field label="Payment Date" ur="تاریخ"><TextInput type="date" value={payDate} onChange={e => setPayDate(e.target.value)} /></Field>
          <Field label="Account" ur="اکاؤنٹ"><Select value={payAccount} onChange={e => setPayAccount(e.target.value)} options={data.accounts.map(a => ({ value: a.id, label: a.name }))} /></Field>
          <Field label="Bank Ref / Txn ID" ur="ٹرانزیکشن آئی ڈی"><TextInput value={payRef} onChange={e => setPayRef(e.target.value)} /></Field>
          <div className="md:col-span-2">
            <ImageField label="Payment Proof / Receipt Photo (optional)" ur="ادائیگی کی تصویر" value={payPhoto} onChange={setPayPhoto} cloudPath={"businesses/installmentPayments/" + sale.id} />
          </div>
          <div className="md:col-span-2 text-right flex justify-end gap-2">
            {editingPaymentId && <button onClick={() => { setEditingPaymentId(null); setShowPay(false); setPayPhoto(""); }} className="text-slate-500 text-xs px-3 py-1.5">Cancel</button>}
            <button onClick={submitPayment} className="bg-[var(--accent-600)] text-[var(--button-text)] text-xs px-4 py-1.5 rounded-lg">{editingPaymentId ? "Update Payment" : "Save Payment"}</button>
          </div>
        </div>
      )}
      {showDiscount && (
        <div className="bg-white border border-slate-200 rounded-lg p-3 mb-2 grid grid-cols-1 md:grid-cols-2 gap-2">
          <Field label="Discount / Waiver Amount" ur="رعایت"><TextInput type="number" value={discAmount} onChange={e => setDiscAmount(e.target.value)} /></Field>
          <Field label="Note / Reason" ur="وجہ"><TextInput value={discNote} onChange={e => setDiscNote(e.target.value)} /></Field>
          <div className="md:col-span-2 text-right"><button onClick={submitDiscount} className="bg-slate-700 text-white text-xs px-4 py-1.5 rounded-lg">Save Waiver</button></div>
        </div>
      )}
      {(sale.installmentPayments || []).length > 0 && (
        <div className="mt-2">

/* Receive Payment / Waive against a customer's legacy Opening Balance (the figure carried over

      const entry = { id: uid("obp"), type: "payment", amount: Number(payAmount), manualReceiptNumber: payReceipt, date: payDate, accountId: payAccount, bankRef: payRef, collectedBy: currentUserName };
      updateCustomer(c => ({ ...c, openingBalancePayments: [...(c.openingBalancePayments || []), entry] }));

        {remaining > 0 && canAdd && <button onClick={() => { setShowDiscount(!showDiscount); setShowPay(false); }} className="bg-slate-600 text-white text-xs px-3 py-1.5 rounded-lg">Waive Balance</button>}

function generatePlan(installmentAmount, durationCount, firstDueDate, frequency) {
  const n = Number(durationCount) || 0, amt = Number(installmentAmount) || 0, plan = [];
  for (let m = 1; m <= n; m++) plan.push({ month: m, dueDate: freqAdvance(firstDueDate, m - 1, frequency || "Monthly"), amount: amt });
  return plan;
}
const MAX_IMAGE_BYTES = 1024 * 1024; // 1MB cap for locally-stored Base64 photos
/* cloudPath (optional): when provided AND Firebase Storage is configured, the image is also
   uploaded to Storage and `onChange` receives the resulting https:// download URL instead of a
   raw base64 string — keeping Firestore documents small and giving the photo a stable cloud URL.

function ImageField({ label, ur, value, onChange, cloudPath }) {
  const [error, setError] = useState("");
  const [uploading, setUploading] = useState(false);
  const browseInputRef = useRef(null);
  const cameraInputRef = useRef(null);
  async function handleFile(e) {
    const f = e.target.files[0]; if (!f) return;
    if (f.size > MAX_IMAGE_BYTES) { setError("Image is " + (f.size / 1024 / 1024).toFixed(1) + "MB — please choose one under 1MB."); e.target.value = ""; return; }
    setError("");
    const b64 = await fileToBase64(f);

    e.target.value = ""; // reset so picking/retaking the same photo again still fires onChange
    if (cloudPath && CLOUD_ENABLED) {
      setUploading(true);
      const url = await uploadDataUrlToStorage(b64, cloudPath + "_" + Date.now());
      setUploading(false);
      onChange(url); // upgrade to the Storage URL once the (background) upload completes
    }
  }

    <Field label={label} ur={ur}>

      <input ref={browseInputRef} type="file" accept="image/*" onChange={handleFile} className="hidden" />

      {uploading && <div className="text-xs text-slate-400 mt-1">Uploading to cloud storage…</div>}
      {value && <img src={value} alt={label} className="mt-2 h-20 rounded-lg border border-slate-200 object-cover" />}
      {value && <button type="button" onClick={() => onChange("")} className="block text-xs text-rose-500 mt-1">Remove image</button>}
    </Field>
