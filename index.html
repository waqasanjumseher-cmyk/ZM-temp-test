      if (cfg.idField && cfg.idRequired) { out.push(i); return; }
      const key = [i.category, i.itemName, i.brand, i.model, i.color, i.storage, i.ram].join("|");
      const existing = groups.get(key);
      if (existing) { existing.__groupCount++; }
      else { const rep = { ...i, __groupCount: 1 }; groups.set(key, rep); out.push(rep); }
    });
    return out;
  }, [availableItems]);
  const cartRetail = form.cart.reduce((s, l) => s + (Number(l.lineRetail) || 0), 0);
  // Retail Price box below is directly editable (not just derived from the cart) — it starts out
  // matching the cart total and re-syncs whenever items are added/removed or a line price is
  // changed, but staff can type over it any time; whatever value sits in the box when the sale is
  // saved is what's actually recorded as the sale's retail price.
  const [retailOverride, setRetailOverride] = useState(String(cartRetail));
  const netPrice = Math.max(0, (Number(retailOverride) || 0) - (Number(form.discount) || 0) + (Number(form.tax) || 0));
  const planPreview = form.paymentType === "Installment" ? generatePlan(form.monthlyInstallment, form.durationMonths, form.firstDueDate, form.frequency) : [];
  const saleDirty = useDirty(form, showForm);
  const newCustomerDirty = useDirty(newCustomer, showNewCustomer);

  function pickAndAddToCart(id) {
    const item = data.inventory.find(i => i.id === id);
    if (!item) return;
    // Selecting an item now adds it straight to the cart — no separate "Add to Cart" button, no
    // quantity step first. Picking the SAME item family (category/name/brand/model) again just
    // bumps that existing cart line's quantity by one (grabbing the next free matching unit) rather
    // than creating a duplicate line, so buying several of the same thing is just "select it again."
    const existingLine = form.cart.find(l => {
      const li = data.inventory.find(x => x.id === l.itemId);
      return li && li.category === item.category && li.itemName === item.itemName && li.brand === item.brand && li.model === item.model;
    });
    let newCart;
    if (existingLine) {
      const itemIds = [...existingLine.itemIds, item.id];
      newCart = form.cart.map(l => l.id === existingLine.id ? { ...l, itemIds, quantity: itemIds.length, lineRetail: l.unitPrice * itemIds.length } : l);
    } else {
      const unitPrice = Number(item.retailPrice) || 0;
      const line = { id: uid("line"), itemId: item.id, itemIds: [item.id], quantity: 1, unitPrice, lineRetail: unitPrice };
      newCart = [...form.cart, line];
    }
    setForm({ ...form, cart: newCart });
    setRetailOverride(String(newCart.reduce((s, l) => s + (Number(l.lineRetail) || 0), 0)));
    setPickItemId("");
  }
  // +/- on a cart line pulls/releases one matching unit from stock, replacing what used to be a
  // separate up-front quantity picker — quantity is now adjusted after the fact, right on the line.
  function incrementCartLine(lineId) {
    const line = form.cart.find(l => l.id === lineId);
    if (!line) return;
    const li = data.inventory.find(x => x.id === line.itemId);
    if (!li) return;
    const next = availableItems.find(i => i.category === li.category && i.itemName === li.itemName && i.brand === li.brand && i.model === li.model);
    if (!next) return; // no more matching stock free
    const itemIds = [...line.itemIds, next.id];
    const newCart = form.cart.map(l => l.id === lineId ? { ...l, itemIds, quantity: itemIds.length, lineRetail: l.unitPrice * itemIds.length } : l);
    setForm({ ...form, cart: newCart });
    setRetailOverride(String(newCart.reduce((s, l) => s + (Number(l.lineRetail) || 0), 0)));
  }
  function decrementCartLine(lineId) {
    const line = form.cart.find(l => l.id === lineId);
    if (!line || line.itemIds.length <= 1) return;
    const itemIds = line.itemIds.slice(0, -1);
    const newCart = form.cart.map(l => l.id === lineId ? { ...l, itemIds, quantity: itemIds.length, lineRetail: l.unitPrice * itemIds.length } : l);
    setForm({ ...form, cart: newCart });
    setRetailOverride(String(newCart.reduce((s, l) => s + (Number(l.lineRetail) || 0), 0)));
  }
  function removeCartLine(lineId) {
    const newCart = form.cart.filter(l => l.id !== lineId);
    setForm({ ...form, cart: newCart });
    setRetailOverride(String(newCart.reduce((s, l) => s + (Number(l.lineRetail) || 0), 0)));
  }
  /* Per-sale price override: lets staff adjust a line's unit price for this customer/negotiation
     without touching the item's master retailPrice in Inventory (which stays the shop's standard
     price for everyone else). Recomputes the line total, and the overall Retail Price box, on
     every keystroke. */
  function updateCartLinePrice(lineId, value) {
    const unitPrice = Number(value) || 0;
    const newCart = form.cart.map(l => l.id === lineId ? { ...l, unitPrice, lineRetail: unitPrice * (l.quantity || 1) } : l);
    setForm({ ...form, cart: newCart });
    setRetailOverride(String(newCart.reduce((s, l) => s + (Number(l.lineRetail) || 0), 0)));
  }

  function saveNewCustomer() {
    if (!newCustomer.name.trim()) { alert("Customer name required"); return; }
    const c = { ...newCustomer, id: uid("cust") };
    setData({ ...data, customers: [...data.customers, c] });
    setForm({ ...form, customerId: c.id });
    setShowNewCustomer(false); setNewCustomer(blankCustomer());
  }
  function openEdit(s) {
    setEditingSaleId(s.id);
    const cart = saleLines(s).map(l => {
      const itemIds = l.itemIds && l.itemIds.length ? l.itemIds : (l.itemId ? [l.itemId] : []);
      const quantity = itemIds.length || l.quantity || 1;
      const unitPrice = l.unitPrice != null ? Number(l.unitPrice) || 0 : (quantity ? (Number(l.lineRetail) || 0) / quantity : 0);
      return { id: uid("line"), itemId: l.itemId, itemIds, quantity, unitPrice, lineRetail: l.lineRetail != null ? Number(l.lineRetail) || 0 : unitPrice * quantity };
    });
    setForm({
      cart, customerId: s.customerId, manualReceiptNumber: s.manualReceiptNumber || "", discount: String(s.discount || 0), tax: String(s.tax || 0), notes: s.notes || "",
      paymentType: s.paymentType, accountId: s.accountId || (data.accounts[0] && data.accounts[0].id) || "", bankRef: s.bankRef || "", date: s.date || todayISO(),
      downPayment: String(s.downPayment || 0), monthlyInstallment: String(s.monthlyInstallment || 0), durationMonths: String(s.durationMonths || 6),
      firstDueDate: s.firstDueDate || addMonthsISO(todayISO(), 1), frequency: s.frequency || "Monthly", receiptScan: s.receiptScan || "",
    });
    setPickItemId(""); setRetailOverride(String(Number(s.retailPrice) || 0));
    setShowForm(true);
  }
  function submit() {
    if (!form.cart.length) { alert("Add at least one item to the cart"); return; }
    if (!form.customerId) { alert("Select or add a customer"); return; }
    const customer = data.customers.find(c => c.id === form.customerId);
    const saleItemIds = form.cart.flatMap(l => l.itemIds && l.itemIds.length ? l.itemIds : [l.itemId]);
    const saleLinesOut = form.cart.map(l => ({ itemId: l.itemId, itemIds: l.itemIds, quantity: l.itemIds ? l.itemIds.length : (l.quantity || 1), unitPrice: l.unitPrice, lineRetail: l.lineRetail }));
    const retail = Number(retailOverride) || 0;
    let paidAmount, plan = [], downPayment = 0, monthlyInstallment = 0, durationMonths = 0, firstDueDate = null;
    if (form.paymentType === "Full") { paidAmount = netPrice; }
    else {
      downPayment = Number(form.downPayment) || 0; monthlyInstallment = Number(form.monthlyInstallment) || 0;
      durationMonths = Number(form.durationMonths) || 0; firstDueDate = form.firstDueDate; paidAmount = downPayment;
      plan = generatePlan(monthlyInstallment, durationMonths, firstDueDate, form.frequency);
    }
    if (editingSaleId) {
      const original = data.sales.find(s => s.id === editingSaleId);
      const originalIds = saleAllItemIds(original);
      const updated = {
        ...original, manualReceiptNumber: form.manualReceiptNumber, items: saleLinesOut,
        itemId: saleItemIds[0] || "", itemIds: saleItemIds, quantity: saleItemIds.length, customerId: form.customerId,
        customerName: customer.name, customerPhone: customer.phone, retailPrice: retail, discount: Number(form.discount) || 0, tax: Number(form.tax) || 0, notes: form.notes || "", salePrice: netPrice,
        paymentType: form.paymentType, paidAmount, accountId: form.accountId, bankRef: form.bankRef, date: form.date, receiptScan: form.receiptScan,
        downPayment, monthlyInstallment, durationMonths, firstDueDate, frequency: form.frequency, installmentPlan: plan,
      };
      let newInventory = data.inventory.map(i => originalIds.includes(i.id) ? { ...i, status: "Available" } : i);
      newInventory = newInventory.map(i => saleItemIds.includes(i.id) ? { ...i, status: "Sold" } : i);
      setData({ ...data, sales: data.sales.map(s => s.id === editingSaleId ? updated : s), inventory: newInventory });
    } else {
      const counter = (data.invoiceCounter || 0) + 1;
      const invoiceId = padInvoice(counter);
      const sale = {
        id: uid("sale"), invoiceId, manualReceiptNumber: form.manualReceiptNumber, items: saleLinesOut,
        itemId: saleItemIds[0] || "", itemIds: saleItemIds, quantity: saleItemIds.length, customerId: form.customerId,
        customerName: customer.name, customerPhone: customer.phone, retailPrice: retail, discount: Number(form.discount) || 0, tax: Number(form.tax) || 0, notes: form.notes || "", salePrice: netPrice,
        paymentType: form.paymentType, paidAmount, accountId: form.accountId, bankRef: form.bankRef, date: form.date, receiptScan: form.receiptScan,
        downPayment, monthlyInstallment, durationMonths, firstDueDate, frequency: form.frequency, installmentPlan: plan, installmentPayments: [], soldBy: currentUserName,
      };
      // Loyalty Program (feature-toggle): earns points on brand-new sales only (not edits, to
      // avoid double-counting) — floor(net price / points-per-amount), added to the customer's
      // running total and visible on their ledger in Customers.
      let newCustomers = data.customers;
      if (erpSettings && erpSettings.enableLoyaltyProgram && form.customerId) {
        const earned = Math.floor(netPrice / (Number(erpSettings.loyaltyPointsPerAmount) || 100));
        if (earned > 0) newCustomers = data.customers.map(c => c.id === form.customerId ? { ...c, loyaltyPoints: (Number(c.loyaltyPoints) || 0) + earned } : c);
      }
      setData({ ...data, sales: [...data.sales, sale], customers: newCustomers, inventory: data.inventory.map(i => saleItemIds.includes(i.id) ? { ...i, status: "Sold" } : i), invoiceCounter: counter });
      setViewing(sale);
    }
    setShowForm(false); setEditingSaleId(null); setForm(blankSaleForm(data)); setRetailOverride("0");
  }
  function doDeleteSale() {
    const ids = saleAllItemIds(deletingSale);
    setData({ ...data, sales: data.sales.filter(s => s.id !== deletingSale.id), inventory: data.inventory.map(i => ids.includes(i.id) ? { ...i, status: "Available" } : i) });
    setDeletingSale(null);
  }

  const filteredSales = useMemo(() => {
    const q = query.trim().toLowerCase();
    let rows = data.sales.filter(s => {
      if (!inRange(s.date, dateFrom, dateTo)) return false;
      if (statusFilter !== "all") {
        const remaining = saleCredit(s).remaining;
        if (statusFilter === "paid" && remaining > 0) return false;
        if (statusFilter === "pending" && remaining <= 0) return false;
        if (statusFilter === "full" && s.paymentType !== "Full") return false;
        if (statusFilter === "installment" && s.paymentType !== "Installment") return false;
      }
      if (!q) return true;
      const items = saleItemsSummary(s, data).map(l => l.item).filter(Boolean);
      const itemFields = items.flatMap(it => [it.imei1, it.imei2, it.serialNumber]);
      return [s.customerName, s.customerPhone, s.invoiceId, s.manualReceiptNumber, ...itemFields].some(v => (v || "").toLowerCase().includes(q));
    });
    return sortRows(rows, sort, { date: s => s.date || "", name: s => s.customerName || "", amount: s => Number(s.salePrice) || 0, remaining: s => saleCredit(s).remaining });
  }, [data.sales, query, data.inventory, dateFrom, dateTo, statusFilter, sort]);

  return (
    <div>
      <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
        <h2 className="text-lg font-semibold text-slate-800"><Bi en="Sales" ur="فروخت" /></h2>
        {canAdd && <button onClick={() => { setEditingSaleId(null); setForm(blankSaleForm(data)); setRetailOverride("0"); setShowForm(true); }} className="bg-[var(--accent-600)] hover:bg-[var(--accent-700)] text-[var(--button-text)] text-sm font-medium px-4 py-2 rounded-lg">+ New Sale</button>}
      </div>
      <ListFilterBar
        search={query} onSearch={setQuery} searchPlaceholder="Search customer, phone, invoice #, receipt #, IMEI..."
        from={dateFrom} onFrom={setDateFrom} to={dateTo} onTo={setDateTo}
        statusOptions={[{ value: "all", label: "All Statuses" }, { value: "paid", label: "Fully Paid" }, { value: "pending", label: "Pending Balance" }, { value: "full", label: "Full Payment Sale" }, { value: "installment", label: "Installment Sale" }]}
        status={statusFilter} onStatus={setStatusFilter}
        sortOptions={[{ value: "date:desc", label: "Date: Newest First" }, { value: "date:asc", label: "Date: Oldest First" }, { value: "name:asc", label: "Customer: A-Z" }, { value: "amount:desc", label: "Amount: High to Low" }, { value: "amount:asc", label: "Amount: Low to High" }, { value: "remaining:desc", label: "Remaining: High to Low" }]}
        sort={sort} onSort={setSort}
      />
      <div className="bg-white rounded-xl border border-slate-200 overflow-x-auto">
        <table className="w-full text-sm">
          <thead className="bg-slate-50 text-slate-500 uppercase text-xs"><tr><th className="text-left px-3 py-2">Invoice #</th><th className="text-left px-3 py-2">Date</th><th className="text-left px-3 py-2">Item</th><th className="text-left px-3 py-2">Customer</th><th className="text-left px-3 py-2">Net Price</th><th className="text-left px-3 py-2">Type</th><th className="text-left px-3 py-2">Remaining</th><th className="text-left px-3 py-2">Actions</th></tr></thead>
          <tbody>
            {filteredSales.map(s => {
              const credit = saleCredit(s);
              return (
                <tr key={s.id} className="border-t border-slate-100 hover:bg-slate-50">
                  <td className="px-3 py-2 font-mono text-xs">{s.invoiceId || "-"}</td>
                  <td className="px-3 py-2">{fmtDate(s.date)}</td>
                  <td className="px-3 py-2">{saleItemsLabel(s, data)}</td>
                  <td className="px-3 py-2">{s.customerName || "-"}</td>
                  <td className="px-3 py-2">{fmtMoney(s.salePrice)}</td>
                  <td className="px-3 py-2">{s.paymentType}</td>
                  <td className={"px-3 py-2 font-medium " + (credit.remaining > 0 ? "text-amber-600" : "text-emerald-600")}>{fmtMoney(credit.remaining)}</td>
                  <td className="px-3 py-2">
                    <div className="flex gap-2">
                      <button onClick={() => setViewing(s)} title="View" className="text-slate-500 hover:text-[var(--accent-600)]">&#128065;</button>
                      {canEdit && <button onClick={() => openEdit(s)} title="Edit" className="text-slate-500 hover:text-[var(--accent-600)]">&#9998;</button>}
                      {canDelete && <button onClick={() => setDeletingSale(s)} title="Delete" className="text-slate-500 hover:text-rose-600">&#128465;</button>}
                    </div>
                  </td>
                </tr>
              );
            })}
            {filteredSales.length === 0 && <tr><td colSpan="8" className="text-center text-slate-400 py-8">No sales found</td></tr>}
          </tbody>
        </table>
      </div>

      {showForm && (
        <Modal title={editingSaleId ? "Edit Sale" : "New Sale"} ur="فروخت" onClose={() => { setShowForm(false); setEditingSaleId(null); }} wide isDirty={saleDirty}>
          <div className="space-y-4">
            {/* ---- Add item (searchable, name/specs hierarchy) — compact: search only, no separate
                 quantity step or button. Selecting an item adds it to the cart instantly; buy more
                 of the same thing by selecting it again, or use +/- on its cart line below. ---- */}
            <div className="bg-[var(--accent-50)]/60 border border-[var(--accent-100)] rounded-xl p-3">
              <div className="text-xs font-semibold text-slate-600 mb-1.5 flex items-center gap-1.5">
                <span>🔍</span> Add Item <span className="urdu text-slate-400 text-[11px] font-normal">/ آئٹم شامل کریں</span>
              </div>
              <SearchDropdown
                items={pickerItems}
                value={pickItemId}
                onSelect={(id) => { if (id) pickAndAddToCart(id); }}
                getSearchText={i => [i.itemName, i.brand, i.model, i.imei1, i.imei2, i.serialNumber].join(" ")}
                placeholder="Search item name, IMEI, or serial number..."
                searchPlaceholder="Type item name, IMEI, or serial..."
                emptyLabel="No matching items in stock"
                renderSelected={(i) => <span className="text-sm font-medium text-slate-800">{i.itemName}{i.model ? <span className="text-slate-400 font-normal"> &middot; {i.model}</span> : null}</span>}
                renderOption={(i) => {
                  const specs = [];
                  if (i.__groupCount > 1) specs.push(i.__groupCount + " in stock");
                  else if (i.imei1) specs.push("IMEI: " + i.imei1);
                  else if (i.serialNumber) specs.push("SN: " + i.serialNumber);
                  if (i.storage) specs.push(i.storage);
                  if (i.ram) specs.push(i.ram);
                  if (i.color) specs.push(i.color);
                  specs.push(fmtMoney(i.retailPrice));
                  return (
                    <div>
                      <div className="text-sm font-semibold text-slate-800 truncate">{i.itemName}{i.model ? <span className="text-slate-400 font-normal"> &middot; {i.model}</span> : null}</div>
                      <div className="text-xs text-slate-400 truncate mt-0.5">{specs.join(" · ")}</div>
                    </div>
                  );
                }}
              />
            </div>

            {/* ---- Cart (clean card-list, not a dense table) ---- */}
            <div>
              <div className="flex items-center gap-2 mb-2">
                <span className="text-sm font-semibold text-slate-700 flex items-center gap-1.5"><span>🛒</span> Cart</span>
                {form.cart.length > 0 && <span className="bg-[var(--accent-100)] text-[var(--accent-700)] text-xs font-semibold px-2 py-0.5 rounded-full">{form.cart.length}</span>}
                <span className="urdu text-slate-400 text-xs">/ ٹوکری</span>
              </div>
              {form.cart.length === 0 ? (
                <div className="border border-dashed border-slate-300 rounded-xl py-6 text-center text-sm text-slate-400">No items added yet — search above to add an item.</div>

                <div className="space-y-2">
                  {form.cart.map(l => {
                    const it = data.inventory.find(i => i.id === l.itemId);
                    const idBit = it && it.imei1 ? "IMEI: " + it.imei1 : (it && it.serialNumber ? "SN: " + it.serialNumber : null);
                    const li = it ? data.inventory.find(x => x.id === l.itemId) : null;
                    const canGrow = it && availableItems.some(i => i.category === it.category && i.itemName === it.itemName && i.brand === it.brand && i.model === it.model);
                    return (
                      <div key={l.id} className="flex flex-wrap items-center gap-3 bg-white border border-slate-200 rounded-xl px-3 py-2.5 hover:border-slate-300 transition">

                          <div className="text-sm font-medium text-slate-800 truncate">{it ? it.itemName : "(item)"}</div>

                          <span className="text-xs font-semibold text-slate-700 w-5 text-center">{l.quantity}</span>

                          <span>each</span>

                        <button type="button" onClick={() => removeCartLine(l.id)} title="Remove" className="text-slate-300 hover:text-rose-600 shrink-0 text-lg leading-none px-1">&#128465;</button>
                      </div>
                    );
                  })}
                  <div className="flex justify-end pt-1">
                    <div className="text-sm text-slate-500">Cart Subtotal: <span className="font-semibold text-slate-800">{fmtMoney(cartRetail)}</span></div>
                  </div>
                </div>
              )}
            </div>

            {/* ---- Customer (searchable, name/phone hierarchy) ---- */}
            <div>
              <span className="text-sm font-medium text-slate-700 flex items-center gap-1.5 mb-1"><span>👤</span> Customer<span className="text-rose-500"> *</span> <span className="urdu text-slate-400 text-xs font-normal ml-1">/ گاہک</span></span>
              <div className="flex gap-2">
                <div className="flex-1">
                  <SearchDropdown
                    items={data.customers}
                    value={form.customerId}
                    onSelect={(id) => setForm({ ...form, customerId: id })}
                    getSearchText={c => [c.name, c.phone, c.cnic].join(" ")}
                    placeholder="Search customer name or phone..."
                    searchPlaceholder="Type customer name or phone..."
                    emptyLabel="No matching customers"
                    renderSelected={(c) => <span className={"text-sm font-medium text-slate-800" + (containsUrdu(c.name) ? " urdu" : "")}>{c.name}</span>}
                    renderOption={(c) => (
                      <div>
                        <div className={"text-sm font-semibold text-slate-800 truncate" + (containsUrdu(c.name) ? " urdu" : "")}>{c.name}</div>
                        {c.phone && <div className="text-xs text-slate-400 truncate mt-0.5">{c.phone}</div>}
                      </div>
                    )}
                  />
                  {/* Phone stays out of the closed-state label to keep it clean, but is still shown here once a customer is picked, and remains searchable above. */}
                  {form.customerId && (() => { const sc = data.customers.find(c => c.id === form.customerId); return sc && sc.phone ? <div className="text-xs text-slate-400 mt-1">{sc.phone}</div> : null; })()}
                  {salesFieldsUI.isVisible("showCustomerAddress") && form.customerId && (() => {
                    const sc = data.customers.find(c => c.id === form.customerId);
                    return sc && sc.address ? <div className="text-xs text-slate-400 mt-0.5">{salesFieldsUI.labelFor("showCustomerAddress")}: {sc.address}</div> : null;
                  })()}
                </div>
                <button onClick={() => setShowNewCustomer(true)} className="bg-slate-700 hover:bg-slate-800 text-white text-sm px-3 rounded-lg whitespace-nowrap">+ New</button>
              </div>
            </div>

            {/* ---- Order / payment details ---- */}
            <div className="border-t border-slate-200 pt-3">
              <div className="grid grid-cols-1 md:grid-cols-2 gap-x-4">
                <Field label="System Invoice ID" ur="انوائس آئی ڈی"><TextInput disabled value={editingSaleId ? (data.sales.find(s => s.id === editingSaleId)?.invoiceId || "-") : padInvoice((data.invoiceCounter || 0) + 1) + " (auto)"} /></Field>
                <Field label="Manual / Paper Receipt Number" ur="مینوئل رسید نمبر"><TextInput value={form.manualReceiptNumber} onChange={e => setForm({ ...form, manualReceiptNumber: e.target.value })} /></Field>
                <Field label={"Retail Price (" + form.cart.length + " item line" + (form.cart.length === 1 ? "" : "s") + ")"} ur="ریٹیل قیمت"><TextInput type="number" value={retailOverride} onChange={e => setRetailOverride(e.target.value)} /></Field>
                {salesFieldsUI.isVisible("showDiscount") && <Field label={salesFieldsUI.labelFor("showDiscount")} ur="رعایت"><TextInput type="number" value={form.discount} onChange={e => setForm({ ...form, discount: e.target.value })} /></Field>}
                {salesFieldsUI.isVisible("showTax") && <Field label={salesFieldsUI.labelFor("showTax")} ur="ٹیکس"><TextInput type="number" value={form.tax} onChange={e => setForm({ ...form, tax: e.target.value })} /></Field>}
                <Field label="Net Sale Price" ur="خالص قیمت"><TextInput disabled value={fmtMoney(netPrice)} className="font-semibold text-emerald-700" /></Field>
                <Field label="Payment Type" ur="ادائیگی کی قسم"><Select value={form.paymentType} onChange={e => setForm({ ...form, paymentType: e.target.value })} options={["Full", "Installment"]} /></Field>
                <Field label="Sale Date" ur="تاریخ"><TextInput type="date" value={form.date} onChange={e => setForm({ ...form, date: e.target.value })} /></Field>
              </div>
              {salesFieldsUI.isVisible("showNotes") && (
                <Field label={salesFieldsUI.labelFor("showNotes")} ur="نوٹس"><textarea rows={2} value={form.notes} onChange={e => setForm({ ...form, notes: e.target.value })} className={inputCls} /></Field>
              )}
              <ImageField label="Receipt Scan (optional)" ur="رسید اسکین" value={form.receiptScan} onChange={v => setForm({ ...form, receiptScan: v })} />
            </div>

            {form.paymentType === "Full" && (
              <div className="grid grid-cols-1 md:grid-cols-2 gap-x-4 border-t border-slate-200 pt-3">
                <Field label="Payment Account" ur="اکاؤنٹ"><Select value={form.accountId} onChange={e => setForm({ ...form, accountId: e.target.value })} options={data.accounts.map(a => ({ value: a.id, label: a.name }))} /></Field>
                <Field label="Bank Ref / Transaction ID" ur="ٹرانزیکشن آئی ڈی"><TextInput value={form.bankRef} onChange={e => setForm({ ...form, bankRef: e.target.value })} /></Field>
              </div>
            )}

            {form.paymentType === "Installment" && (
              <div className="border-t border-slate-200 pt-3">
                <h4 className="text-sm font-semibold text-slate-700 mb-2 flex items-center gap-1.5"><span>📆</span> Installment Calculator <span className="urdu text-slate-400 text-xs font-normal">/ قسط کیلکولیٹر</span></h4>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-x-4">
                  <Field label="Down Payment" ur="پیشگی رقم"><TextInput type="number" value={form.downPayment} onChange={e => setForm({ ...form, downPayment: e.target.value })} /></Field>
                  <Field label="Down Payment Account" ur="اکاؤنٹ"><Select value={form.accountId} onChange={e => setForm({ ...form, accountId: e.target.value })} options={data.accounts.map(a => ({ value: a.id, label: a.name }))} /></Field>
                  <Field label="Bank Ref / Transaction ID" ur="ٹرانزیکشن آئی ڈی"><TextInput value={form.bankRef} onChange={e => setForm({ ...form, bankRef: e.target.value })} /></Field>
                  <Field label="Installment Frequency" ur="قسط کی مدت"><Select value={form.frequency} onChange={e => setForm({ ...form, frequency: e.target.value })} options={FREQUENCIES} /></Field>
                  <Field label="Installment Amount" ur="قسط کی رقم"><TextInput type="number" value={form.monthlyInstallment} onChange={e => setForm({ ...form, monthlyInstallment: e.target.value })} /></Field>
                  <Field label="Number of Installments" ur="اقساط کی تعداد"><TextInput type="number" value={form.durationMonths} onChange={e => setForm({ ...form, durationMonths: e.target.value })} /></Field>
                  <Field label="First Due Date" ur="پہلی قسط کی تاریخ"><TextInput type="date" value={form.firstDueDate} onChange={e => setForm({ ...form, firstDueDate: e.target.value })} /></Field>
                </div>
                <div className="text-xs text-slate-500 mb-2">Plan total: {fmtMoney(planPreview.reduce((s, p) => s + p.amount, 0))} + Down Payment {fmtMoney(form.downPayment)} — should roughly equal Net Sale Price {fmtMoney(netPrice)}.</div>
              </div>
            )}

            <div className="flex justify-end gap-2 pt-1">
              <button onClick={() => { setShowForm(false); setEditingSaleId(null); }} className="px-4 py-2 text-sm rounded-lg border border-slate-300 text-slate-600 hover:bg-slate-50">Cancel</button>
              <button onClick={submit} className="px-4 py-2 text-sm rounded-lg bg-[var(--accent-600)] text-[var(--button-text)] hover:bg-[var(--accent-700)] shadow-sm">{editingSaleId ? "Update Sale" : "Save Sale"}</button>
            </div>
          </div>
        </Modal>
      )}

      {showNewCustomer && (
        <Modal title="New Customer" ur="نیا گاہک" onClose={() => setShowNewCustomer(false)} isDirty={newCustomerDirty}>
          <Field label="Customer Name" ur="نام" required><TextInput value={newCustomer.name} onChange={e => setNewCustomer({ ...newCustomer, name: e.target.value })} /></Field>
          <Field label="Phone" ur="فون نمبر"><TextInput value={newCustomer.phone} onChange={e => setNewCustomer({ ...newCustomer, phone: e.target.value })} /></Field>
          <Field label="CNIC" ur="شناختی کارڈ"><TextInput value={newCustomer.cnic} onChange={e => setNewCustomer({ ...newCustomer, cnic: e.target.value })} /></Field>
          <Field label="Address" ur="پتہ"><TextInput value={newCustomer.address} onChange={e => setNewCustomer({ ...newCustomer, address: e.target.value })} /></Field>
          <Field label="Guarantor Name" ur="ضامن کا نام"><TextInput value={newCustomer.guarantorName} onChange={e => setNewCustomer({ ...newCustomer, guarantorName: e.target.value })} /></Field>
          <Field label="Guarantor Phone" ur="ضامن کا فون"><TextInput value={newCustomer.guarantorPhone} onChange={e => setNewCustomer({ ...newCustomer, guarantorPhone: e.target.value })} /></Field>
          <ImageField label="Customer Photo" ur="تصویر" value={newCustomer.photo} onChange={v => setNewCustomer({ ...newCustomer, photo: v })} />
          <ImageField label="CNIC Front" ur="شناختی کارڈ سامنے" value={newCustomer.cnicFront} onChange={v => setNewCustomer({ ...newCustomer, cnicFront: v })} />
          <ImageField label="CNIC Back" ur="شناختی کارڈ پیچھے" value={newCustomer.cnicBack} onChange={v => setNewCustomer({ ...newCustomer, cnicBack: v })} />
          <div className="flex justify-end gap-2 mt-4">
            <button onClick={() => setShowNewCustomer(false)} className="px-4 py-2 text-sm rounded-lg border border-slate-300 text-slate-600">Cancel</button>
            <button onClick={saveNewCustomer} className="px-4 py-2 text-sm rounded-lg bg-[var(--accent-600)] text-[var(--button-text)] hover:bg-[var(--accent-700)]">Save Customer</button>
          </div>
        </Modal>
      )}

      {deletingSale && (
        <Modal title="Delete Sale?" onClose={() => setDeletingSale(null)}>
          <p className="text-sm text-slate-600">Delete this sale ({deletingSale.invoiceId})? All linked item(s) will be returned to Available stock and its payment history will be removed. This cannot be undone.</p>
          <ConfirmBar onCancel={() => setDeletingSale(null)} onConfirm={doDeleteSale} />
        </Modal>
      )}

      {viewing && (
        <Modal title={"Sale " + (viewing.invoiceId || "")} onClose={() => setViewing(null)} wide>
          <div className="text-sm space-y-1 mb-3">
            <div className="text-slate-500 mb-1">Items:</div>
            <div className="border border-slate-200 rounded-lg overflow-hidden mb-2">
              <table className="w-full text-xs">
                <thead className="bg-slate-50 text-slate-500"><tr><th className="text-left px-2 py-1">Item</th><th className="text-left px-2 py-1">Qty</th><th className="text-left px-2 py-1">Unit Price</th><th className="text-left px-2 py-1">Total</th></tr></thead>
                <tbody>
                  {saleItemsSummary(viewing, data).map((l, idx) => (
                    <tr key={idx} className="border-t border-slate-100">
                      <td className="px-2 py-1">{l.item ? l.item.itemName : "(deleted item)"}</td>
                      <td className="px-2 py-1">{l.quantity || 1}</td>
                      <td className="px-2 py-1">{fmtMoney(l.unitPrice)}</td>
                      <td className="px-2 py-1">{fmtMoney(lineTotal(l))}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            <div>Customer: {viewing.customerName} {viewing.customerPhone}</div>
            <div>Manual Receipt #: {viewing.manualReceiptNumber || "-"}</div>
            <div>Retail: {fmtMoney(viewing.retailPrice)} | Discount: {fmtMoney(viewing.discount)}{viewing.tax ? " | Tax: " + fmtMoney(viewing.tax) : ""} | Net: {fmtMoney(viewing.salePrice)}</div>
            <div>Type: {viewing.paymentType} | Sold By: {viewing.soldBy}</div>
            <div>Date: {fmtDate(viewing.date)}</div>
            {viewing.notes && <div>Notes: {viewing.notes}</div>}
            {viewing.receiptScan && <div className="mt-2"><div className="text-slate-500 mb-1">Receipt Scan:</div><img src={viewing.receiptScan} className="h-24 rounded-lg border border-slate-200 object-cover" /></div>}
            {erpSettings && erpSettings.enableThermalPrinter && (
              <div className="mt-3 pt-3 border-t border-slate-100">
                <ThermalPrintButton getReceiptText={() => {
                  const lines = saleItemsSummary(viewing, data);
                  const rows = lines.map(l => (l.item ? l.item.itemName : "(deleted item)") + (l.quantity > 1 ? " x" + l.quantity : "") + "  " + fmtMoney(lineTotal(l)));
                  return [
                    biz.header || biz.name, biz.address || "", biz.phone || "", "--------------------------------",
                    "Invoice: " + (viewing.invoiceId || "-"), "Date: " + fmtDate(viewing.date), "Customer: " + (viewing.customerName || "-"),
                    "--------------------------------", ...rows, "--------------------------------",
                    "Retail: " + fmtMoney(viewing.retailPrice), "Discount: " + fmtMoney(viewing.discount),
                    viewing.tax ? "Tax: " + fmtMoney(viewing.tax) : null, "Net Total: " + fmtMoney(viewing.salePrice),
                    "--------------------------------", "Thank you!",
                  ].filter(Boolean).join("\n");
                }} />
              </div>
            )}
          </div>
          {viewing.paymentType === "Installment" && <InstallmentPanel data={data} setData={setData} sale={viewing} biz={biz} currentUserName={currentUserName} can={can} />}
          {viewing.paymentType !== "Installment" && (() => {
            const items = saleItemsSummary(viewing, data);
            const customer = data.customers.find(c => c.id === viewing.customerId) || (viewing.customerPhone ? { name: viewing.customerName, phone: viewing.customerPhone } : null);
            return <SaleReceiptActions biz={biz} sale={viewing} items={items} customer={customer} data={data} />;
          })()}
        </Modal>
      )}
    </div>
  );
}

/* ============================ CUSTOMERS TAB ============================ */
function CustomersTab({ data, setData, role, biz, currentUserName, erpSettings, can, uiPrefs }) {
  const canAdd = can("add"), canEdit = can("edit"), canDelete = can("delete");
  // Column visibility + zebra striping (Settings -> Display Preferences -> Customer List Display).
  // Defaults keep every column visible / stripes off, matching pre-existing behavior for anyone
  // who hasn't touched these settings.
  const listPrefs = (uiPrefs && uiPrefs.customerList) || { showCnic: true, showGuarantor: true, showLastActivity: true };
  const zebraOn = !!(uiPrefs && uiPrefs.zebraStripe && uiPrefs.zebraStripe.customers);
  const [query, setQuery] = useState("");
  const [statusFilter, setStatusFilter] = useState("all");
  const [sort, setSort] = useState("name:asc");
  const [showForm, setShowForm] = useState(false);
  const [editing, setEditing] = useState(null);
  const [customer, setCustomer] = useState(blankCustomer());
  const [ledgerCustomer, setLedgerCustomer] = useState(null);
  const [expandedBillId, setExpandedBillId] = useState(null); // 3-level ledger: which bill's itemized breakdown is open
  const [statementCustomer, setStatementCustomer] = useState(null);
  const [deleting, setDeleting] = useState(null);

  const filtered = useMemo(() => {
    const q = query.trim().toLowerCase();
    let rows = data.customers.filter(c => !q || [c.name, c.phone, c.cnic].some(v => (v || "").toLowerCase().includes(q)));
    const withLedger = rows.map(c => ({ ...c, __outstanding: customerLedgerSummary(data, c.id).totalOutstanding }));
    const statusFiltered = statusFilter === "all" ? withLedger : withLedger.filter(c => statusFilter === "outstanding" ? c.__outstanding > 0 : c.__outstanding <= 0);
    return sortRows(statusFiltered, sort, { name: c => c.name || "", outstanding: c => c.__outstanding, activity: c => c.lastActivity || "" });
  }, [data.customers, data.sales, query, statusFilter, sort]);
  const { page, pageSize, setPage, pageRows: pagedCustomers, changePageSize } = usePagedRows(filtered, 25);

  const customerDirty = useDirty(customer, showForm);
  function openAdd() { setCustomer(blankCustomer()); setEditing(null); setShowForm(true); }
  function openEdit(c) { setCustomer(c); setEditing(c.id); setShowForm(true); }
  function submit() {
    if (!customer.name.trim()) { alert("Customer name required"); return; }
    if (editing) setData({ ...data, customers: data.customers.map(c => c.id === editing ? { ...customer, id: editing } : c) });
    else setData({ ...data, customers: [...data.customers, { ...customer, id: uid("cust") }] });
    setShowForm(false);
  }
  function doDelete() { setData({ ...data, customers: data.customers.filter(c => c.id !== deleting.id) }); setDeleting(null); }

  // ledgerCustomer is set once (on "Ledger" click) from a row snapshot, so once OpeningBalancePanel
  // below records a payment/waiver against it, that snapshot goes stale — re-look-up the live
  // record from data on every render so the panel's remaining balance/history update immediately.
  const liveLedgerCustomer = ledgerCustomer ? (data.customers.find(c => c.id === ledgerCustomer.id) || ledgerCustomer) : null;
  const custSales = ledgerCustomer ? data.sales.filter(s => s.customerId === ledgerCustomer.id) : [];
  const totals = useMemo(() => {
    const base = custSales.reduce((acc, s) => {
      const credit = saleCredit(s);
      acc.purchased += Number(s.salePrice) || 0; acc.discount += (Number(s.discount) || 0) + credit.discountGiven - (Number(s.discount) || 0);
      acc.paid += credit.totalCredited; acc.remaining += Math.max(0, credit.remaining);
      return acc;
    }, { purchased: 0, discount: 0, paid: 0, remaining: 0 });
    // opening: legacy imported balance still owed, net of any Receive Payment / Waive Balance
    // entries recorded via OpeningBalancePanel (see customerLedgerSummary).
    const opening = ledgerCustomer ? customerLedgerSummary(data, ledgerCustomer.id).openingBalanceRemaining : 0;
    return { ...base, opening, remaining: base.remaining + opening };
  }, [custSales, ledgerCustomer, data]);

  const [ledgerQuery, setLedgerQuery] = useState("");
  const [ledgerFrom, setLedgerFrom] = useState("");
  const [ledgerTo, setLedgerTo] = useState("");
  const [ledgerStatus, setLedgerStatus] = useState("all");
  const [ledgerSort, setLedgerSort] = useState("date:desc");
  useEffect(() => { setLedgerQuery(""); setLedgerFrom(""); setLedgerTo(""); setLedgerStatus("all"); setLedgerSort("date:desc"); setExpandedBillId(null); }, [ledgerCustomer]);
  const custSalesFiltered = useMemo(() => {
    const q = ledgerQuery.trim().toLowerCase();
    let rows = custSales.filter(s => {
      if (!inRange(s.date, ledgerFrom, ledgerTo)) return false;
      const remaining = saleCredit(s).remaining;
      if (ledgerStatus === "paid" && remaining > 0) return false;
      if (ledgerStatus === "pending" && remaining <= 0) return false;
      if (!q) return true;
      return [s.invoiceId, s.manualReceiptNumber, saleItemsLabel(s, data)].some(v => (v || "").toLowerCase().includes(q));
    });
    return sortRows(rows, ledgerSort, { date: s => s.date || "", amount: s => Number(s.salePrice) || 0 });
  }, [custSales, ledgerQuery, ledgerFrom, ledgerTo, ledgerStatus, ledgerSort, data]);

  return (
    <div>
      <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
        <h2 className="text-lg font-semibold text-slate-800"><Bi en="Customers" ur="گاہک" /></h2>
        {canAdd && <button onClick={openAdd} className="bg-[var(--accent-600)] hover:bg-[var(--accent-700)] text-[var(--button-text)] text-sm font-medium px-4 py-2 rounded-lg">+ Add Customer / نیا گاہک</button>}
      </div>
      <ListFilterBar
        search={query} onSearch={setQuery} searchPlaceholder="Search name, phone, CNIC..."
        statusOptions={[{ value: "all", label: "All Customers" }, { value: "outstanding", label: "Has Outstanding Balance" }, { value: "settled", label: "Fully Settled" }]}
        status={statusFilter} onStatus={setStatusFilter}
        sortOptions={[{ value: "name:asc", label: "Name: A-Z" }, { value: "name:desc", label: "Name: Z-A" }, { value: "outstanding:desc", label: "Outstanding: High to Low" }, { value: "outstanding:asc", label: "Outstanding: Low to High" }, { value: "activity:asc", label: "Activity: Oldest First" }, { value: "activity:desc", label: "Activity: Newest First" }]}
        sort={sort} onSort={setSort}
      />
      <div className="bg-white rounded-xl border border-slate-200 overflow-x-auto">
        <table className="w-full text-sm">
          <thead className="bg-slate-50 text-slate-500 uppercase text-xs"><tr>
            <th className="text-left px-3 py-2">Name</th>
            <th className="text-left px-3 py-2">Phone</th>
            {listPrefs.showCnic && <th className="text-left px-3 py-2">CNIC</th>}
            {listPrefs.showGuarantor && <th className="text-left px-3 py-2">Guarantor</th>}
            {erpSettings && erpSettings.enableLoyaltyProgram && <th className="text-left px-3 py-2">Points</th>}
            <th className="text-left px-3 py-2">Outstanding</th>
            {listPrefs.showLastActivity && <th className="text-left px-3 py-2">Last Activity</th>}
            <th className="text-left px-3 py-2">Actions</th>
          </tr></thead>
          <tbody>
            {pagedCustomers.map((c, idx) => (
              <tr key={c.id} className={"border-t-2 border-slate-300 hover:bg-slate-50" + (zebraOn && idx % 2 === 1 ? " bg-slate-50" : " bg-white")}>
                <td className="px-3 py-2 font-medium text-slate-800 max-w-[140px] sm:max-w-none whitespace-normal break-words align-top">
                  <span className={containsUrdu(c.name) ? "urdu" : ""}>{c.name}</span>
                </td>
                <td className="px-3 py-2 align-top">{c.phone}</td>
                {listPrefs.showCnic && <td className="px-3 py-2 align-top">{c.cnic}</td>}
                {listPrefs.showGuarantor && <td className="px-3 py-2 align-top">{c.guarantorName || "-"}</td>}
                {erpSettings && erpSettings.enableLoyaltyProgram && <td className="px-3 py-2 text-[var(--accent-600)] font-medium align-top">{Number(c.loyaltyPoints) || 0}</td>}
                <td className={"px-3 py-2 font-medium align-top " + (c.__outstanding > 0 ? "text-amber-600" : "text-emerald-600")}>{fmtMoney(c.__outstanding)}</td>
                {listPrefs.showLastActivity && <td className="px-3 py-2 text-slate-500 align-top">{c.lastActivity ? fmtDate(c.lastActivity) : "-"}</td>}
                <td className="px-3 py-2 align-top">
                  <div className="flex gap-2">
                    <button onClick={() => setLedgerCustomer(c)} title="Ledger" className="text-slate-500 hover:text-[var(--accent-600)]">&#128065;</button>
                    <button onClick={() => setStatementCustomer(c)} title="View Ledger Report" className="text-slate-500 hover:text-[var(--accent-600)]">&#128196;</button>
                    {canEdit && <button onClick={() => openEdit(c)} title="Edit" className="text-slate-500 hover:text-[var(--accent-600)]">&#9998;</button>}
                    {canDelete && <button onClick={() => setDeleting(c)} title="Delete" className="text-slate-500 hover:text-rose-600">&#128465;</button>}
                  </div>
                </td>
              </tr>
            ))}
            {filtered.length === 0 && <tr><td colSpan="7" className="text-center text-slate-400 py-8">No customers yet / کوئی گاہک نہیں</td></tr>}
          </tbody>
        </table>
        <Pagination page={page} pageSize={pageSize} total={filtered.length} onPage={setPage} onPageSize={changePageSize} />
      </div>

      {showForm && (
        <Modal title={editing ? "Edit Customer" : "Add Customer"} ur="گاہک" onClose={() => setShowForm(false)} isDirty={customerDirty}>
          <Field label="Customer Name" ur="نام" required><TextInput className={containsUrdu(customer.name) ? "urdu" : ""} value={customer.name} onChange={e => setCustomer({ ...customer, name: e.target.value })} /></Field>
          <Field label="Phone" ur="فون نمبر"><TextInput value={customer.phone} onChange={e => setCustomer({ ...customer, phone: e.target.value })} /></Field>
          <Field label="CNIC" ur="شناختی کارڈ"><TextInput value={customer.cnic} onChange={e => setCustomer({ ...customer, cnic: e.target.value })} /></Field>
          <Field label="Address" ur="پتہ"><TextInput value={customer.address} onChange={e => setCustomer({ ...customer, address: e.target.value })} /></Field>
          <Field label="Guarantor Name" ur="ضامن کا نام"><TextInput value={customer.guarantorName} onChange={e => setCustomer({ ...customer, guarantorName: e.target.value })} /></Field>
          <Field label="Guarantor Phone" ur="ضامن کا فون"><TextInput value={customer.guarantorPhone} onChange={e => setCustomer({ ...customer, guarantorPhone: e.target.value })} /></Field>
          <Field label="Opening Balance (legacy outstanding, if any)" ur="ابتدائی بقایا رقم"><TextInput type="number" value={customer.openingBalance} onChange={e => setCustomer({ ...customer, openingBalance: e.target.value })} /></Field>
          <Field label="Last Activity" ur="آخری سرگرمی"><TextInput type="date" value={customer.lastActivity || ""} onChange={e => setCustomer({ ...customer, lastActivity: e.target.value })} /></Field>
          <Field label="Note" ur="نوٹ"><TextInput value={customer.note || ""} onChange={e => setCustomer({ ...customer, note: e.target.value })} placeholder="e.g. Outstanding Balance Digikhata" /></Field>
          <ImageField label="Customer Photo" ur="تصویر" value={customer.photo} onChange={v => setCustomer({ ...customer, photo: v })} />
          <ImageField label="CNIC Front" ur="شناختی کارڈ سامنے" value={customer.cnicFront} onChange={v => setCustomer({ ...customer, cnicFront: v })} />
          <ImageField label="CNIC Back" ur="شناختی کارڈ پیچھے" value={customer.cnicBack} onChange={v => setCustomer({ ...customer, cnicBack: v })} />
          <ImageField label="Guarantor Proof / Document" ur="ضامن کی دستاویز" value={customer.guarantorProof} onChange={v => setCustomer({ ...customer, guarantorProof: v })} />
          <div className="flex justify-end gap-2 mt-4">
            <button onClick={() => setShowForm(false)} className="px-4 py-2 text-sm rounded-lg border border-slate-300 text-slate-600">Cancel</button>
            <button onClick={submit} className="px-4 py-2 text-sm rounded-lg bg-[var(--accent-600)] text-[var(--button-text)] hover:bg-[var(--accent-700)]">Save</button>
          </div>
        </Modal>
      )}
      {deleting && (
        <Modal title="Delete Customer?" onClose={() => setDeleting(null)}>
          <p className="text-sm text-slate-600">Delete <b>{deleting.name}</b>? Their sales history will remain but be unlinked.</p>
          <ConfirmBar onCancel={() => setDeleting(null)} onConfirm={doDelete} />
        </Modal>
      )}
      {statementCustomer && (
        <CustomerStatementModal biz={biz} customer={data.customers.find(x => x.id === statementCustomer.id) || statementCustomer} data={data} onClose={() => setStatementCustomer(null)} />
      )}
      {ledgerCustomer && (
        <Modal title={"Customer Ledger: " + ledgerCustomer.name} ur="گاہک کھاتہ" onClose={() => setLedgerCustomer(null)} wide>
          <div className="text-sm mb-3 grid grid-cols-2 gap-2">
            <div><span className="text-slate-500">Phone:</span> {ledgerCustomer.phone || "-"}</div>
            <div><span className="text-slate-500">CNIC:</span> {ledgerCustomer.cnic || "-"}</div>
            <div><span className="text-slate-500">Address:</span> {ledgerCustomer.address || "-"}</div>
            <div><span className="text-slate-500">Guarantor:</span> {ledgerCustomer.guarantorName || "-"} {ledgerCustomer.guarantorPhone || ""}</div>
          </div>
          {(ledgerCustomer.photo || ledgerCustomer.cnicFront || ledgerCustomer.cnicBack || ledgerCustomer.guarantorProof) && (
            <div className="flex flex-wrap gap-3 mb-4">
              {ledgerCustomer.photo && <div><div className="text-xs text-slate-500 mb-1">Photo</div><img src={ledgerCustomer.photo} className="h-20 rounded-lg border border-slate-200 object-cover" /></div>}
              {ledgerCustomer.cnicFront && <div><div className="text-xs text-slate-500 mb-1">CNIC Front</div><img src={ledgerCustomer.cnicFront} className="h-20 rounded-lg border border-slate-200 object-cover" /></div>}
              {ledgerCustomer.cnicBack && <div><div className="text-xs text-slate-500 mb-1">CNIC Back</div><img src={ledgerCustomer.cnicBack} className="h-20 rounded-lg border border-slate-200 object-cover" /></div>}
              {ledgerCustomer.guarantorProof && <div><div className="text-xs text-slate-500 mb-1">Guarantor Proof</div><img src={ledgerCustomer.guarantorProof} className="h-20 rounded-lg border border-slate-200 object-cover" /></div>}
            </div>
          )}
          <div className="grid grid-cols-2 md:grid-cols-4 gap-2 mb-4">
            <Card label="Total Purchased" value={fmtMoney(totals.purchased)} />
            <Card label="Discounts Given" value={fmtMoney(totals.discount)} />
            <Card label="Total Paid" value={fmtMoney(totals.paid)} accent="text-emerald-600" />
            {totals.opening > 0 && <Card label="Opening Balance (legacy)" value={fmtMoney(totals.opening)} accent="text-amber-600" />}
            <Card label="Net Remaining" value={fmtMoney(totals.remaining)} accent={totals.remaining > 0 ? "text-amber-600" : "text-emerald-600"} />
            {erpSettings && erpSettings.enableLoyaltyProgram && <Card label="Loyalty Points" ur="لائلٹی پوائنٹس" value={Number(ledgerCustomer.loyaltyPoints) || 0} accent="text-[var(--accent-600)]" />}
          </div>
          <OpeningBalancePanel data={data} setData={setData} customer={liveLedgerCustomer} currentUserName={currentUserName} can={can} />
          {custSales.length > 0 && (
            <ListFilterBar
              search={ledgerQuery} onSearch={setLedgerQuery} searchPlaceholder="Search invoice #, receipt #, item..."
              from={ledgerFrom} onFrom={setLedgerFrom} to={ledgerTo} onTo={setLedgerTo}
              statusOptions={[{ value: "all", label: "All Statuses" }, { value: "paid", label: "Fully Paid" }, { value: "pending", label: "Pending Balance" }]}
              status={ledgerStatus} onStatus={setLedgerStatus}
              sortOptions={[{ value: "date:desc", label: "Date: Newest First" }, { value: "date:asc", label: "Date: Oldest First" }, { value: "amount:desc", label: "Amount: High to Low" }, { value: "amount:asc", label: "Amount: Low to High" }]}
              sort={ledgerSort} onSort={setLedgerSort}
            />
          )}
          {custSales.length === 0 && <p className="text-sm text-slate-400">No purchases recorded for this customer yet.</p>}
          {custSales.length > 0 && custSalesFiltered.length === 0 && <p className="text-sm text-slate-400">No transactions match these filters.</p>}
          {custSalesFiltered.map(s => {
            const credit = saleCredit(s);
            const lines = saleItemsSummary(s, data);
            const isBillOpen = expandedBillId === s.id;
            const initialAccount = data.accounts.find(a => a.id === s.accountId);
            return (
              <div key={s.id} className="border border-slate-200 rounded-lg mb-3 overflow-hidden">
                {/* Level 2: Bill #, Date, Amount Paid, Remaining Balance — click to open Level 3 */}
                <div className="flex flex-wrap justify-between items-center text-sm gap-2 p-3 cursor-pointer hover:bg-slate-50" onClick={() => setExpandedBillId(isBillOpen ? null : s.id)}>
                  <div className="min-w-0">
                    <div className="flex items-center gap-1.5">
                      <span className={"inline-block transition-transform duration-150 text-slate-400" + (isBillOpen ? " rotate-90" : "")}>&#9656;</span>
                      <b>Bill {s.invoiceId || "-"}</b>
                      {s.manualReceiptNumber && <span className="text-xs text-slate-400">· Receipt {s.manualReceiptNumber}</span>}
                    </div>
                    <div className="text-xs text-slate-400 ml-4">{saleItemsLabel(s, data)}</div>
                  </div>
                  <div className="text-right text-xs shrink-0">
                    <div className="text-slate-500">{fmtDate(s.date)}</div>
                    <div>Paid <span className="text-emerald-600 font-medium">{fmtMoney(credit.totalCredited)}</span></div>
                    <div>Remaining <span className={"font-medium " + (credit.remaining > 0 ? "text-amber-600" : "text-emerald-600")}>{fmtMoney(Math.max(0, credit.remaining))}</span></div>
                  </div>
                </div>
                {/* Level 3: itemized items, unit prices, payment method details */}
                {isBillOpen && (
                  <div className="border-t border-slate-100 bg-slate-50/60 p-3">
                    <div className="text-xs font-semibold text-slate-500 uppercase mb-2">Items Purchased</div>
                    <div className="overflow-x-auto mb-3">
                      <table className="w-full text-xs">
                        <thead className="text-slate-400"><tr><th className="text-left py-1">Item</th><th className="text-right py-1">Qty</th><th className="text-right py-1">Unit Price</th><th className="text-right py-1">Line Total</th></tr></thead>
                        <tbody>
                          {lines.map((l, idx) => (
                            <tr key={idx} className="border-t border-slate-100">
                              <td className="py-1">{l.item ? l.item.itemName : "(deleted item)"}</td>
                              <td className="py-1 text-right">{l.quantity || 1}</td>
                              <td className="py-1 text-right">{fmtMoney(l.unitPrice != null ? l.unitPrice : (lineTotal(l) / (l.quantity || 1)))}</td>
                              <td className="py-1 text-right">{fmtMoney(lineTotal(l))}</td>
                            </tr>
                          ))}
                          {lines.length === 0 && <tr><td colSpan="4" className="text-center text-slate-400 py-2">No item detail recorded</td></tr>}
                        </tbody>
                      </table>
                    </div>
                    <div className="text-xs font-semibold text-slate-500 uppercase mb-2">Payment Method Details</div>
                    <div className="space-y-1 text-xs">
                      {(Number(s.paidAmount) || 0) > 0 && <div>Paid at sale: <b>{fmtMoney(s.paidAmount)}</b> via {initialAccount ? initialAccount.name : (s.accountId || "-")}{s.bankRef ? " (Ref " + s.bankRef + ")" : ""}</div>}
                      {(s.installmentPayments || []).map((p, idx) => {
                        const acc = data.accounts.find(a => a.id === p.accountId);
                        return (
                          <div key={idx}>
                            {p.type === "discount" ? "Discount/Waiver" : "Installment"}{p.month ? " (Month " + p.month + ")" : ""}: <b>{fmtMoney(p.amount)}</b>
                            {p.type !== "discount" ? " via " + (acc ? acc.name : (p.accountId || "-")) : ""}
                            {p.manualReceiptNumber ? " · Receipt " + p.manualReceiptNumber : ""} — {fmtDate(p.date)}
                          </div>
                        );
                      })}
                      {!((Number(s.paidAmount) || 0) > 0) && (!s.installmentPayments || s.installmentPayments.length === 0) && <div className="text-slate-400">No payments recorded yet.</div>}
                    </div>
                  </div>
                )}
                {s.paymentType === "Installment" && <div className="border-t border-slate-100 p-3"><InstallmentPanel data={data} setData={setData} sale={s} biz={biz} currentUserName={currentUserName} can={can} /></div>}
              </div>
            );
          })}
        </Modal>
      )}
    </div>
  );
}

/* ============================ RECOVERY TAB ============================ */
function RecoveryTab({ data, setData, biz, currentUserName, can, uiPrefs }) {
  const zebraOn = !!(uiPrefs && uiPrefs.zebraStripe && uiPrefs.zebraStripe.recoveries);
  const pending = useMemo(() => data.sales.filter(s => s.paymentType === "Installment").map(s => {
    const credit = saleCredit(s);
    const next = nextDueInfo(s);
    let statusTag = "onTrack";
    if (next) {
      const diffDays = Math.round((new Date(next.dueDate) - new Date(todayISO())) / 86400000);
      statusTag = diffDays < 0 ? "overdue" : diffDays <= 7 ? "dueSoon" : "onTrack";
    }
    return { ...s, credit, next, statusTag };
  }).filter(s => s.credit.remaining > 0), [data]);
  const [query, setQuery] = useState("");
  const [dateFrom, setDateFrom] = useState("");
  const [dateTo, setDateTo] = useState("");
  const [statusFilter, setStatusFilter] = useState("all");
  const [sort, setSort] = useState("due:asc");
  const [expanded, setExpanded] = useState(null);
  const [imageReminderFor, setImageReminderFor] = useState(null);
  const reminders = useMemo(() => reminderList(data), [data]);

  const filtered = useMemo(() => {
    const q = query.trim().toLowerCase();
    let rows = pending.filter(s => {
      if (!inRange(s.date, dateFrom, dateTo)) return false;
      if (statusFilter !== "all" && s.statusTag !== statusFilter) return false;
      if (!q) return true;
      const imeis = saleItemsSummary(s, data).map(l => l.item && l.item.imei1).filter(Boolean);
      return [s.customerName, s.customerPhone, s.invoiceId, s.manualReceiptNumber, ...imeis].some(v => (v || "").toLowerCase().includes(q));
    });
    return sortRows(rows, sort, {
      date: s => s.date || "", name: s => s.customerName || "", amount: s => Number(s.salePrice) || 0,
      remaining: s => s.credit.remaining, due: s => (s.next ? s.next.dueDate : "9999-99-99"),
    });
  }, [pending, query, dateFrom, dateTo, statusFilter, sort, data]);

  return (
    <div>
      <h2 className="text-lg font-semibold text-slate-800 mb-4"><Bi en="Installment Collections" ur="بقایا اقساط کی وصولی" /></h2>

      {reminders.length > 0 && (
        <div className="bg-amber-50 border border-amber-200 rounded-xl p-4 mb-4">
          <h3 className="text-sm font-semibold text-amber-800 mb-2">Payment Reminders (Due within 7 days or Overdue) / یاد دہانیاں</h3>
          <div className="space-y-2">
            {reminders.map(r => {
              const customer = data.customers.find(c => c.id === r.sale.customerId) || (r.sale.customerPhone ? { name: r.sale.customerName, phone: r.sale.customerPhone } : null);
              const items = saleItemsSummary(r.sale, data);
              const dueInfo = { next: r.next, overdue: r.overdue };
              const link = customer && customer.phone ? waLink(customer.phone, buildReminderMessage(biz, r.sale, items, customer, dueInfo)) : null;
              return (
                <div key={r.sale.id} className="flex flex-wrap items-center justify-between gap-2 bg-white rounded-lg px-3 py-2 text-sm">
                  <div>
                    <b>{r.sale.customerName}</b> — {saleItemsLabel(r.sale, data)} — Due {fmtDate(r.next.dueDate)} ({fmtMoney(r.next.amount)})
                    {r.overdue ? <span className="ml-2 text-xs bg-rose-100 text-rose-700 px-2 py-0.5 rounded-full">Overdue</span> : <span className="ml-2 text-xs bg-amber-100 text-amber-700 px-2 py-0.5 rounded-full">Upcoming</span>}
                  </div>
                  <div className="flex gap-2">
                    {link && <a href={link} target="_blank" rel="noreferrer" className="bg-amber-600 text-white text-xs px-3 py-1.5 rounded-lg no-underline">Send WhatsApp Reminder</a>}
                    <button onClick={() => setImageReminderFor({ sale: r.sale, items, customer, dueInfo })} className="bg-amber-700 text-white text-xs px-3 py-1.5 rounded-lg">Image Reminder</button>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}
      {imageReminderFor && (
        <WhatsAppReminderModal biz={biz} sale={imageReminderFor.sale} items={imageReminderFor.items} customer={imageReminderFor.customer} dueInfo={imageReminderFor.dueInfo} onClose={() => setImageReminderFor(null)} />
      )}

      <ListFilterBar
        search={query} onSearch={setQuery} searchPlaceholder="Search customer, phone, invoice #, receipt #, IMEI..."
        from={dateFrom} onFrom={setDateFrom} to={dateTo} onTo={setDateTo}
        statusOptions={[{ value: "all", label: "All Statuses" }, { value: "overdue", label: "Overdue" }, { value: "dueSoon", label: "Due Soon (7 days)" }, { value: "onTrack", label: "On Track" }]}
        status={statusFilter} onStatus={setStatusFilter}
        sortOptions={[{ value: "due:asc", label: "Due Date: Soonest First" }, { value: "date:desc", label: "Sale Date: Newest First" }, { value: "date:asc", label: "Sale Date: Oldest First" }, { value: "name:asc", label: "Customer: A-Z" }, { value: "remaining:desc", label: "Remaining: High to Low" }, { value: "amount:desc", label: "Sale Amount: High to Low" }]}
        sort={sort} onSort={setSort}
      />
      <div className="bg-white rounded-xl border border-slate-200 overflow-x-auto">
        <table className="w-full text-sm">
          <thead className="bg-slate-50 text-slate-500 uppercase text-xs"><tr><th className="text-left px-3 py-2">Customer</th><th className="text-left px-3 py-2">Item</th><th className="text-left px-3 py-2">Sale Price</th><th className="text-left px-3 py-2">Paid</th><th className="text-left px-3 py-2">Remaining</th><th className="text-left px-3 py-2">Status</th><th className="text-left px-3 py-2"></th></tr></thead>
          <tbody>
            {filtered.map((s, idx) => {
              const badge = s.statusTag === "overdue" ? { text: "Overdue", cls: "bg-rose-100 text-rose-700" } : s.statusTag === "dueSoon" ? { text: "Due Soon", cls: "bg-amber-100 text-amber-700" } : { text: "On Track", cls: "bg-emerald-100 text-emerald-700" };
              return (
                <React.Fragment key={s.id}>
                  <tr className={"border-t-2 border-slate-300 hover:bg-slate-50 cursor-pointer" + (zebraOn && idx % 2 === 1 ? " bg-slate-50" : " bg-white")} onClick={() => setExpanded(expanded === s.id ? null : s.id)}>
                    <td className="px-3 py-2">{s.customerName || "-"} <div className="text-xs text-slate-400">{s.customerPhone}</div></td>
                    <td className="px-3 py-2">{saleItemsLabel(s, data)}</td>
                    <td className="px-3 py-2">{fmtMoney(s.salePrice)}</td>
                    <td className="px-3 py-2">{fmtMoney(s.credit.totalCredited)}</td>
                    <td className="px-3 py-2 font-semibold text-amber-600">{fmtMoney(s.credit.remaining)}</td>
                    <td className="px-3 py-2"><span className={"text-xs font-medium px-2 py-0.5 rounded-full " + badge.cls}>{badge.text}</span></td>
                    <td className="px-3 py-2 text-[var(--accent-600)] text-xs">{expanded === s.id ? "Hide ▲" : "Manage ▼"}</td>
                  </tr>
                  {expanded === s.id && (
                    <tr><td colSpan="7" className="px-3 pb-3"><InstallmentPanel data={data} setData={setData} sale={s} biz={biz} currentUserName={currentUserName} can={can} /></td></tr>
                  )}
                </React.Fragment>
              );
            })}
            {filtered.length === 0 && <tr><td colSpan="7" className="text-center text-slate-400 py-8">No pending installments match these filters &#127881;</td></tr>}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ============================ ACCOUNTS TAB ============================ */
function blankAccount() { return { name: "", type: "Cash", openingBalance: "0" }; }
function AccountsTab({ data, setData, role, can }) {
  const canAdd = can("add"), canEdit = can("edit"), canDelete = can("delete");
  const [showForm, setShowForm] = useState(false);
  const [editing, setEditing] = useState(null);
  const [account, setAccount] = useState(blankAccount());
  const [ledgerAccount, setLedgerAccount] = useState(null);
  const [deleting, setDeleting] = useState(null);

  function openAdd() { setAccount(blankAccount()); setEditing(null); setShowForm(true); }
  function openEdit(a) { setAccount(a); setEditing(a.id); setShowForm(true); }
  function submit() {
    if (!account.name.trim()) { alert("Account name required"); return; }
    if (editing) setData({ ...data, accounts: data.accounts.map(a => a.id === editing ? { ...account, id: editing } : a) });
    else setData({ ...data, accounts: [...data.accounts, { ...account, id: uid("acct") }] });
    setShowForm(false);
  }
  function doDelete() {
    if (data.accounts.length <= 1) { alert("At least one account must remain."); return; }
    setData({ ...data, accounts: data.accounts.filter(a => a.id !== deleting.id) }); setDeleting(null);
  }
  const ledgerRows = useMemo(() => {
    if (!ledgerAccount) return [];
    const rows = [];
    data.sales.forEach(s => {
      if (s.accountId === ledgerAccount.id && s.paidAmount) rows.push({ date: s.date, desc: "Sale - " + (s.customerName || "Customer") + " (" + (s.invoiceId || "") + ")", inAmt: Number(s.paidAmount) || 0, outAmt: 0 });
      (s.installmentPayments || []).forEach(p => { if (p.type !== "discount" && p.accountId === ledgerAccount.id) rows.push({ date: p.date, desc: "Installment - " + (s.customerName || "Customer"), inAmt: Number(p.amount) || 0, outAmt: 0 }); });
    });
    data.dealerPayments.forEach(p => { if (p.accountId === ledgerAccount.id) rows.push({ date: p.date, desc: "Dealer Payment - " + (data.dealers.find(d => d.id === p.dealerId)?.name || ""), inAmt: 0, outAmt: Number(p.amount) || 0 }); });
    (data.expenses || []).forEach(e => { if (e.accountId === ledgerAccount.id) rows.push({ date: e.date, desc: "Expense - " + e.category, inAmt: 0, outAmt: Number(e.amount) || 0 }); });
    (data.salaryPayments || []).forEach(p => { if (p.accountId === ledgerAccount.id) rows.push({ date: p.date, desc: "Salary - " + (data.staff.find(st => st.id === p.staffId)?.name || ""), inAmt: 0, outAmt: Number(p.amount) || 0 }); });
    (data.partnerTransactions || []).forEach(t => { if (t.type === "drawing" && t.accountId === ledgerAccount.id) rows.push({ date: t.date, desc: "Partner Drawing - " + (data.partners.find(pt => pt.id === t.partnerId)?.name || ""), inAmt: 0, outAmt: Number(t.amount) || 0 }); });
    rows.sort((a, b) => (a.date || "").localeCompare(b.date || ""));
    let running = Number(ledgerAccount.openingBalance) || 0;
    return rows.map(r => { running += r.inAmt - r.outAmt; return { ...r, running }; });
  }, [data, ledgerAccount]);

  return (
    <div>
      <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
        <h2 className="text-lg font-semibold text-slate-800"><Bi en="Accounts / Bank Ledger" ur="اکاؤنٹس" /></h2>
        {canAdd && <button onClick={openAdd} className="bg-[var(--accent-600)] hover:bg-[var(--accent-700)] text-[var(--button-text)] text-sm font-medium px-4 py-2 rounded-lg">+ Add Account</button>}
      </div>
      <div className="grid grid-cols-1 md:grid-cols-3 gap-3 mb-4">
        {data.accounts.map(a => (
          <div key={a.id} className="bg-white rounded-xl border border-slate-200 p-4 cursor-pointer hover:shadow-md" onClick={() => setLedgerAccount(a)}>
            <div className="text-xs uppercase text-slate-500">{a.type}</div>
            <div className="font-semibold text-slate-800">{a.name}</div>
            <div className="text-xl font-bold text-[var(--accent-600)] mt-1">{fmtMoney(accountBalance(data, a.id))}</div>
            {(canEdit || canDelete) && <div className="flex gap-2 mt-2" onClick={e => e.stopPropagation()}>
              {canEdit && <button onClick={() => openEdit(a)} className="text-xs text-slate-500 hover:text-[var(--accent-600)]">Edit</button>}
              {canDelete && <button onClick={() => setDeleting(a)} className="text-xs text-slate-500 hover:text-rose-600">Delete</button>}
            </div>}
          </div>
        ))}
      </div>

      {showForm && (
        <Modal title={editing ? "Edit Account" : "Add Account"} ur="اکاؤنٹ" onClose={() => setShowForm(false)}>
          <Field label="Account Name" ur="نام" required><TextInput value={account.name} onChange={e => setAccount({ ...account, name: e.target.value })} placeholder="e.g. Meezan Bank, JazzCash" /></Field>
          <Field label="Type" ur="قسم"><Select value={account.type} onChange={e => setAccount({ ...account, type: e.target.value })} options={ACCOUNT_TYPES} /></Field>
          <Field label="Opening Balance" ur="ابتدائی رقم"><TextInput type="number" value={account.openingBalance} onChange={e => setAccount({ ...account, openingBalance: e.target.value })} /></Field>
          <div className="flex justify-end gap-2 mt-4">
            <button onClick={() => setShowForm(false)} className="px-4 py-2 text-sm rounded-lg border border-slate-300 text-slate-600">Cancel</button>
            <button onClick={submit} className="px-4 py-2 text-sm rounded-lg bg-[var(--accent-600)] text-[var(--button-text)] hover:bg-[var(--accent-700)]">Save</button>
          </div>
        </Modal>
      )}
      {deleting && (
        <Modal title="Delete Account?" onClose={() => setDeleting(null)}>
          <p className="text-sm text-slate-600">Delete <b>{deleting.name}</b>? Historical transactions referencing it will remain but show as unlinked.</p>
          <ConfirmBar onCancel={() => setDeleting(null)} onConfirm={doDelete} />
        </Modal>
      )}
      {ledgerAccount && (
        <Modal title={"Ledger: " + ledgerAccount.name} ur="اکاؤنٹ کھاتہ" onClose={() => setLedgerAccount(null)} wide>
          <div className="mb-3 text-sm">Current Balance: <b className="text-[var(--accent-600)]">{fmtMoney(accountBalance(data, ledgerAccount.id))}</b></div>
          <div className="overflow-x-auto border border-slate-200 rounded-lg">
            <table className="w-full text-sm">
              <thead className="bg-slate-50 text-slate-500 uppercase text-xs"><tr><th className="text-left px-3 py-2">Date</th><th className="text-left px-3 py-2">Description</th><th className="text-right px-3 py-2">In</th><th className="text-right px-3 py-2">Out</th><th className="text-right px-3 py-2">Balance</th></tr></thead>
              <tbody>
                {ledgerRows.map((r, idx) => (<tr key={idx} className="border-t border-slate-100"><td className="px-3 py-2">{fmtDate(r.date)}</td><td className="px-3 py-2">{r.desc}</td><td className="px-3 py-2 text-right text-emerald-600">{r.inAmt ? fmtMoney(r.inAmt) : "-"}</td><td className="px-3 py-2 text-right text-rose-600">{r.outAmt ? fmtMoney(r.outAmt) : "-"}</td><td className="px-3 py-2 text-right font-medium">{fmtMoney(r.running)}</td></tr>))}
                {ledgerRows.length === 0 && <tr><td colSpan="5" className="text-center text-slate-400 py-6">No transactions yet</td></tr>}
              </tbody>
            </table>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ============================ STAFF / PAYROLL TAB ============================ */
function blankStaff() { return { name: "", phone: "", role: "Sales Staff", baseSalary: "", joiningDate: todayISO() }; }
function StaffTab({ data, setData, role, can }) {
  const canAdd = can("add"), canEdit = can("edit"), canDelete = can("delete");
  const [showForm, setShowForm] = useState(false);
  const [editing, setEditing] = useState(null);
  const [staff, setStaff] = useState(blankStaff());
  const [deleting, setDeleting] = useState(null);
  const [payingStaff, setPayingStaff] = useState(null);
  const [editingPayId, setEditingPayId] = useState(null);
  const [payAmount, setPayAmount] = useState("");
  const [payType, setPayType] = useState("Salary");
  const [payDate, setPayDate] = useState(todayISO());

  const [historyStaff, setHistoryStaff] = useState(null);
  const [deletingPay, setDeletingPay] = useState(null);

  function openAdd() { setStaff(blankStaff()); setEditing(null); setShowForm(true); }

  function submit() {
    if (!staff.name.trim()) { alert("Staff name required"); return; }
    if (editing) setData({ ...data, staff: data.staff.map(s => s.id === editing ? { ...staff, id: editing } : s) });
    else setData({ ...data, staff: [...data.staff, { ...staff, id: uid("staff") }] });
    setShowForm(false);
  }
  function doDelete() { setData({ ...data, staff: data.staff.filter(s => s.id !== deleting.id) }); setDeleting(null); }
  function openPay(s) { setPayingStaff(s); setEditingPayId(null); setPayAmount(String(s.baseSalary || "")); setPayType("Salary"); setPayDate(todayISO()); setPayNote(""); }
  function openEditPay(s, p) { setPayingStaff(s); setEditingPayId(p.id); setPayAmount(String(p.amount)); setPayType(p.type); setPayDate(p.date); setPayAccount(p.accountId || (data.accounts[0] && data.accounts[0].id) || ""); setPayNote(p.note || ""); }
  function recordSalary() {
    if (!payAmount || Number(payAmount) <= 0) { alert("Enter valid amount"); return; }
    if (editingPayId) setData({ ...data, salaryPayments: data.salaryPayments.map(p => p.id === editingPayId ? { ...p, amount: Number(payAmount), type: payType, date: payDate, accountId: payAccount, note: payNote } : p) });
    else setData({ ...data, salaryPayments: [...data.salaryPayments, { id: uid("sal"), staffId: payingStaff.id, amount: Number(payAmount), type: payType, date: payDate, accountId: payAccount, note: payNote }] });
    setPayingStaff(null); setEditingPayId(null); setPayAmount(""); setPayNote("");
  }
  function doDeletePay() { setData({ ...data, salaryPayments: data.salaryPayments.filter(p => p.id !== deletingPay.id) }); setDeletingPay(null); }
  function staffTotalPaid(staffId) { return data.salaryPayments.filter(p => p.staffId === staffId).reduce((s, p) => s + (Number(p.amount) || 0), 0); }
  function staffThisMonth(staffId) {
    const ym = todayISO().slice(0, 7);
    return data.salaryPayments.filter(p => p.staffId === staffId && (p.date || "").slice(0, 7) === ym).reduce((s, p) => s + (Number(p.amount) || 0), 0);
  }

  return (
    <div>
      <div className="flex flex-wrap items-center justify-between gap-3 mb-4">

      <div className="bg-white rounded-xl border border-slate-200 overflow-x-auto">
        <table className="w-full text-sm">
          <thead className="bg-slate-50 text-slate-500 uppercase text-xs"><tr><th className="text-left px-3 py-2">Name</th><th className="text-left px-3 py-2">Role</th><th className="text-left px-3 py-2">Base Salary</th><th className="text-left px-3 py-2">Paid This Month</th><th className="text-left px-3 py-2">Total Paid</th><th className="text-left px-3 py-2">Actions</th></tr></thead>
          <tbody>
            {data.staff.map(s => (
              <tr key={s.id} className="border-t border-slate-100 hover:bg-slate-50">
                <td className="px-3 py-2 font-medium text-slate-800">{s.name}<div className="text-xs text-slate-400">{s.phone}</div></td>
                <td className="px-3 py-2">{s.role}</td><td className="px-3 py-2">{fmtMoney(s.baseSalary)}</td>
                <td className="px-3 py-2">{fmtMoney(staffThisMonth(s.id))}</td><td className="px-3 py-2">{fmtMoney(staffTotalPaid(s.id))}</td>
                <td className="px-3 py-2">
                  <div className="flex gap-2">
                    {canAdd && <button onClick={() => openPay(s)} className="bg-[var(--accent-600)] text-[var(--button-text)] text-xs px-2.5 py-1 rounded-lg">Pay</button>}
                    <button onClick={() => setHistoryStaff(s)} className="bg-slate-600 text-white text-xs px-2.5 py-1 rounded-lg">History</button>
                    {canEdit && <button onClick={() => openEdit(s)} title="Edit" className="text-slate-500 hover:text-[var(--accent-600)]">&#9998;</button>}
                    {canDelete && <button onClick={() => setDeleting(s)} title="Delete" className="text-slate-500 hover:text-rose-600">&#128465;</button>}
                  </div>
                </td>
              </tr>
            ))}
            {data.staff.length === 0 && <tr><td colSpan="6" className="text-center text-slate-400 py-8">No staff added yet</td></tr>}
          </tbody>
        </table>
      </div>

      {showForm && (
        <Modal title={editing ? "Edit Staff" : "Add Staff"} ur="سٹاف" onClose={() => setShowForm(false)}>
          <Field label="Name" ur="نام" required><TextInput value={staff.name} onChange={e => setStaff({ ...staff, name: e.target.value })} /></Field>
          <Field label="Phone" ur="فون"><TextInput value={staff.phone} onChange={e => setStaff({ ...staff, phone: e.target.value })} /></Field>
          <Field label="Role" ur="کردار"><Select value={staff.role} onChange={e => setStaff({ ...staff, role: e.target.value })} options={STAFF_ROLES} /></Field>
          <Field label="Monthly Base Salary" ur="ماہانہ تنخواہ"><TextInput type="number" value={staff.baseSalary} onChange={e => setStaff({ ...staff, baseSalary: e.target.value })} /></Field>
          <Field label="Joining Date" ur="تاریخ شمولیت"><TextInput type="date" value={staff.joiningDate} onChange={e => setStaff({ ...staff, joiningDate: e.target.value })} /></Field>
          <div className="flex justify-end gap-2 mt-4">
            <button onClick={() => setShowForm(false)} className="px-4 py-2 text-sm rounded-lg border border-slate-300 text-slate-600">Cancel</button>
            <button onClick={submit} className="px-4 py-2 text-sm rounded-lg bg-[var(--accent-600)] text-[var(--button-text)] hover:bg-[var(--accent-700)]">Save</button>
          </div>
        </Modal>
      )}
      {deleting && (
        <Modal title="Delete Staff?" onClose={() => setDeleting(null)}>

      {payingStaff && (
        <Modal title={(editingPayId ? "Edit Payment: " : "Pay Salary: ") + payingStaff.name} ur="تنخواہ ادا کریں" onClose={() => { setPayingStaff(null); setEditingPayId(null); }}>
