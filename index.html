<style>
  :root {
    /* Default accent palette (Indigo) — overridden at runtime per logged-in user's chosen theme

    --accent-50: #eef2ff; --accent-100: #e0e7ff; --accent-200: #c7d2fe; --accent-400: #818cf8;

       and bg-slate-900 (sidebar) exactly, so nothing visually changes until a user picks a custom
       color in Settings > Theme Settings. */
    --app-bg: #f1f5f9; --sidebar-bg: #0f172a;
    /* Phase 6: derived surface/text variables so a custom theme color reaches INSIDE the app too —
       cards, forms, modals, inputs, and table headers/hover rows — not just the outer page. Defaults
       below match the exact previous hardcoded colors (white cards, slate-50 table headers, slate-800
       body text) so nothing changes until a color is customized; see applyCustomSurface() which
       recomputes all three from the chosen page-background color whenever it changes. */
    --card-bg: #ffffff; --surface-alt-bg: #f8fafc; --page-text: #1e293b;
    /* Text painted on top of solid accent-colored buttons/pills (bg-[var(--accent-600)] etc).
       Defaults to white, matching every button's previous hardcoded look; recomputed per-contrast
       whenever the accent changes (preset OR Phase 4 custom "Buttons" color) — see
       pickButtonTextColor() below — so a pale custom button color can never make its own label
       invisible the way it used to. */
    --button-text: #ffffff;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: var(--app-bg); color: var(--page-text); }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  .urdu { font-family: 'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', serif; direction: rtl; }
  /* Personal display preference: hides every bilingual Urdu label app-wide when a user turns off
     "Show Urdu labels" in Customize Display. */
  .hide-urdu .urdu { display: none !important; }

  /* ---- Global form-control text color fix ----
     Tailwind's Preflight reset sets `color: inherit` on input/select/textarea/option, so a form
     field's typed/selected text picks up whatever text color surrounds it instead of having its
     own. That's invisible the moment a field sits inside (or near) anything using a light/white
     text color — a colored banner, a card header styled text-white, the Buttons/accent color
     cascading in, etc. — because the field then silently inherits that light color while its own
     background stays white, and what you type disappears. Pin an explicit, always-readable dark
     color here so typed text and selected dropdown text are never at the mercy of an ancestor's
     color. `.dark-mode input/select/textarea` below is more specific (class + type selector) so it
     still correctly wins and swaps this for a light color when dark mode is on. */
  input, select, textarea, option { color: #1e293b !important; }
  input::placeholder, textarea::placeholder { color: #94a3b8 !important; opacity: 1; }


  /* ---- Phase 6: Active Screens & Forms Color Fix ----
     The app is styled entirely with Tailwind's utility classes rather than a component-level theme
     system, so — same technique as Dark Mode just below — this remaps the two utility classes that
     make up virtually every card, form, modal, input, and table header in the app (bg-white and
     bg-slate-50) to the two derived CSS variables above, instead of touching each of the hundreds of
     elements that use them individually. Both variables are always kept as light/near-white tints
     (see applyCustomSurface — it blends the chosen color TOWARD white, never uses it raw), so normal
     dark body text stays fully readable inside them no matter how bold a page-background color is
     picked; anyone who wants an actually-dark UI still uses the separate Dark Mode toggle, whose own
     .dark-mode rules below take precedence over these (higher-specificity selector, so it always wins
     when active). !important matches the same technique Dark Mode already uses to reliably win against
     the Tailwind CDN's own injected utility stylesheet. */
  .bg-white { background-color: var(--card-bg) !important; }
  .bg-slate-50 { background-color: var(--surface-alt-bg) !important; }

  /* ---- Phase 7: user-selectable text color + Bold Text accessibility mode ----
     Fixes text becoming unreadable against certain custom background/color combinations, and adds a
     low-vision-friendly bold mode. Both are opt-in and scoped to a wrapper class (added on the root
     div only when actually turned on — see App()) so nothing changes for anyone who never touches
     these two settings.
       .custom-text-color — forces the app's main text classes to the one color the user picked in
       Theme Settings, overriding the automatic light/dark pick for those elements. Deliberately
       leaves already-muted/secondary grays (text-slate-400 and lighter), status colors (success/
       error/warning), and text-white (used on solid color buttons) alone, since repainting those the
       same as body text would erase meaning (errors no longer look like errors) or break contrast the
       other way (white-on-white buttons).
       .bold-text — a low-vision accessibility aid: raises the app's base/inherited font-weight from
       normal to semibold. Anything that already sets its OWN explicit weight (headings using
       font-semibold/font-bold, etc.) keeps that weight untouched, since an element's own declared
       weight always wins over an inherited one — so this bolds plain body/label/paragraph text
       without flattening the existing visual hierarchy. */
  .custom-text-color .text-slate-500,
  .custom-text-color .text-slate-600,
  .custom-text-color .text-slate-700,
  .custom-text-color .text-slate-800 { color: var(--custom-text-color) !important; }
  .bold-text { font-weight: 600; }

  /* ---- Dark Mode ----
     The app is styled entirely with Tailwind's utility classes (bg-white, text-slate-700, etc.)
     rather than a component-level theme system, so rather than touch every element individually
     this remaps the handful of surface/text/border utility classes that make up the app's visual
     backbone, scoped under a `.dark-mode` class applied to the root wrapper (see App()). Anything
     already dark by design (the sidebar's app-sidebar background) is intentionally left alone.
     The explicit `color` here (on top of background-color) matters: a handful of elements — table
     TOTAL rows, a few table cells — carry no text-color utility class at all and simply inherit
     whatever color the page sets. Without this, they'd keep inheriting `--page-text`, which is
     computed from the LIGHT custom Page Background color and knows nothing about Dark Mode being
     on, so it can resolve to dark text sitting on one of the dark surfaces below — invisible. This
     line gives everything inside .dark-mode a readable light default; any element with its own
     explicit text-color class (the vast majority) is unaffected, since a direct rule always wins
     over an inherited one. */
  .dark-mode { background-color: #0f172a; color-scheme: dark; color: #e2e8f0; }
  .dark-mode .bg-white { background-color: #1e293b !important; }
  .dark-mode .bg-slate-50 { background-color: #0f172a !important; }
  .dark-mode .bg-slate-100 { background-color: #334155 !important; }
  .dark-mode .border-slate-100 { border-color: #1e293b !important; }
  .dark-mode .border-slate-200 { border-color: #334155 !important; }
  .dark-mode .border-slate-300 { border-color: #475569 !important; }
  .dark-mode .text-slate-800 { color: #f1f5f9 !important; }
  .dark-mode .text-slate-700 { color: #e2e8f0 !important; }
  .dark-mode .text-slate-600 { color: #cbd5e1 !important; }
  .dark-mode .text-slate-500 { color: #94a3b8 !important; }
  .dark-mode .text-slate-400 { color: #64748b !important; }
  .dark-mode .divide-slate-100 > * + * { border-color: #334155 !important; }
  .dark-mode input, .dark-mode select, .dark-mode textarea {
    background-color: #1e293b !important; color: #e2e8f0 !important; border-color: #475569 !important;
  }
  .dark-mode ::placeholder { color: #64748b !important; }
  .dark-mode .shadow-sm, .dark-mode .shadow, .dark-mode .shadow-md { box-shadow: none !important; }
  /* Sidebar/navbar custom color (Phase 4) — replaces the previously-hardcoded bg-slate-900 utility
     class on the sidebar element itself; default value above matches that exact color. */
  .app-sidebar { background-color: var(--sidebar-bg); }
</style>

<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;

/* ============================ CONSTANTS ============================ */
const CATEGORIES = ["Mobile","Tablet","Laptop","Smartwatch","Solar System","Home Appliance","Electronics","Accessory","Other"];
/* Category-driven form config: controls which identifier/spec fields show per product type,
   and whether that identifier is required. This lets Sale/Inventory entry skip IMEI/Serial/LCD
   fields entirely for products that don't need them. */
const CATEGORY_CONFIG = {
  "Mobile":          { idField: "imei1", idLabel: "IMEI 1 (Primary)", idRequired: true,  showImei2: true,  showRamStorage: true,  showSpecs: false, specsLabel: "" },
  "Tablet":          { idField: "imei1", idLabel: "IMEI 1 / Serial Number", idRequired: false, showImei2: true,  showRamStorage: true,  showSpecs: false, specsLabel: "" },
  "Laptop":          { idField: "serialNumber", idLabel: "Serial Number", idRequired: true,  showImei2: false, showRamStorage: true,  showSpecs: true,  specsLabel: "LCD / Screen Specs" },
  "Smartwatch":      { idField: "serialNumber", idLabel: "Serial Number", idRequired: false, showImei2: false, showRamStorage: false, showSpecs: false, specsLabel: "" },
  "Solar System":    { idField: "serialNumber", idLabel: "Serial Number", idRequired: false, showImei2: false, showRamStorage: false, showSpecs: true,  specsLabel: "Panel / Battery / Inverter Specs" },
  "Home Appliance":  { idField: "serialNumber", idLabel: "Serial Number", idRequired: false, showImei2: false, showRamStorage: false, showSpecs: true,  specsLabel: "Appliance Specs (Capacity, Power, etc.)" },
  "Electronics":     { idField: "serialNumber", idLabel: "Serial Number", idRequired: false, showImei2: false, showRamStorage: false, showSpecs: true,  specsLabel: "Technical Specs" },

  "Other":           { idField: "serialNumber", idLabel: "Serial Number (optional)", idRequired: false, showImei2: false, showRamStorage: false, showSpecs: true, specsLabel: "Specifications" },
};
function categoryConfig(category) { return CATEGORY_CONFIG[category] || CATEGORY_CONFIG["Other"]; }
/* Merges the built-in categories with any shop-defined custom categories (added from the
   "Custom Items" tab) so every category dropdown across the app stays in sync automatically. */
function allCategories(data) { return [...CATEGORIES, ...((data && data.customCategories) || [])]; }
const CONDITIONS = ["New","Used"];
const STATUSES = ["Available","Reserved","Sold","In-Repair","Partner Drawing","Returned to Dealer"];
/* ---- Advanced Shop Operations (Phase 3): Return to Dealer, Customer Sale Return, Used Mobile
   Buyback/Trade-In, Day-End Cash Summary. Kept as small shared constants near the other lookup
   lists above so every Operations form/report can reference the same wording. ---- */
const DEALER_RETURN_REASONS = ["Defective / Dead on Arrival","Wrong Item Supplied","Damaged in Transit","Customer Refused / Unsold","Other"];
const SALE_RETURN_REASONS = ["Defective / Not Working","Customer Changed Mind","Wrong Item Sold","Damaged","Other"];
const BUYBACK_CONDITIONS = ["Excellent","Good","Fair","For Parts / Repair"];
const ROLES = ["Admin","Sales Officer","Recovery Officer"];

const ACCOUNT_TYPES = ["Cash","Bank","Mobile Wallet"];
const EXPENSE_CATEGORIES = ["Rent","Electricity","Refreshment","Transport/Freight","Maintenance","Salary","Other"];
const STAFF_ROLES = ["Sales Staff","Recovery Officer","Manager","Technician","Admin","Other"];

const ROLE_TABS = {
  "Admin": ["dashboard","inventory","dealers","purchases","sales","customers","recovery","accounts","staff","expenses","partners","operations","settings","exportdata"],
  "Sales Officer": ["dashboard","inventory","sales"],

const TABS = [
  { id: "dashboard", en: "Dashboard", ur: "ڈیش بورڈ", icon: "\u25A6" },
  { id: "inventory", en: "Inventory", ur: "اسٹاک", icon: "\u{1F4E6}" },
  { id: "dealers", en: "Dealer Ledger", ur: "ڈیلر کھاتہ", icon: "\u{1F4D2}" },
  { id: "purchases", en: "Purchases", ur: "خریداری", icon: "\u{1F9FE}" },
  { id: "sales", en: "Sales", ur: "فروخت", icon: "\u{1F4B0}" },
  { id: "customers", en: "Customers", ur: "گاہک", icon: "\u{1F465}" },
  { id: "recovery", en: "Recovery / Installments", ur: "وصولی", icon: "\u23F3" },
  { id: "accounts", en: "Accounts / Bank Ledger", ur: "اکاؤنٹس", icon: "\u{1F3E6}" },
  { id: "staff", en: "Staff / Payroll", ur: "سٹاف تنخواہیں", icon: "\u{1F464}" },
  { id: "expenses", en: "Shop Expenses", ur: "شاپ اخراجات", icon: "\u{1F9FE}" },

  { id: "exportdata", en: "Backup / Export", ur: "بیک اپ", icon: "\u2B07" },

/* ---- Customizable Display: which sidebar tabs, Dashboard cards, and look-and-feel options a
   user has chosen. Purely a personal display preference (independent of the role-based CRUD
   permission system above) — a hidden tab/card just isn't rendered; it can always be re-enabled
   from Business Settings -> Customize Display. "settings" itself is intentionally never
   hideable, so a user can never lock themselves out of the screen that controls this.
   Stored per LOGIN (per user id), not per device/business — so two people sharing the same
   business and the same computer each get their own layout, theme, and defaults. ---- */
const DASHBOARD_CARDS = [
  { id: "availableStock", label: "Available Stock", ur: "دستیاب" },
  { id: "soldItems", label: "Sold Items", ur: "فروخت شدہ" },
  { id: "reserved", label: "Reserved", ur: "محفوظ" },
  { id: "inRepair", label: "In Repair", ur: "مرمت میں" },
  { id: "pendingInstallments", label: "Pending Installments", ur: "بقایا اقساط" },
  { id: "dueReminders", label: "Due/Overdue Installments", ur: "واجب الادا اقساط" },
  { id: "customerOutstanding", label: "Total Customer Outstanding", ur: "کل بقایا رقم" },
  { id: "stockValue", label: "Stock Value (Cost)", ur: "اسٹاک ویلیو", adminOnly: true },
  { id: "cashBankBalance", label: "Cash & Bank Balance", ur: "کیش بیلنس", adminOnly: true },
  { id: "financialReport", label: "Financial Report section", ur: "مالیاتی رپورٹ", adminOnly: true },

/* Accent color palettes a user can pick in Customize Display. Values match Tailwind's own color
   scale exactly, so the chosen accent looks native everywhere it's applied via the
   var(--accent-NNN) CSS custom properties (see the <style> block in <head> and applyAccentTheme
   below). Add more palettes here any time — nothing else needs to change. */
const ACCENT_THEMES = {
  indigo: { name: "Indigo", 50: "#eef2ff", 100: "#e0e7ff", 200: "#c7d2fe", 400: "#818cf8", 500: "#6366f1", 600: "#4f46e5", 700: "#4338ca", 800: "#3730a3", 900: "#312e81" },
  teal: { name: "Teal", 50: "#f0fdfa", 100: "#ccfbf1", 200: "#99f6e4", 400: "#2dd4bf", 500: "#14b8a6", 600: "#0d9488", 700: "#0f766e", 800: "#115e59", 900: "#134e4a" },
  rose: { name: "Rose", 50: "#fff1f2", 100: "#ffe4e6", 200: "#fecdd3", 400: "#fb7185", 500: "#f43f5e", 600: "#e11d48", 700: "#be123c", 800: "#9f1239", 900: "#881337" },
  amber: { name: "Amber", 50: "#fffbeb", 100: "#fef3c7", 200: "#fde68a", 400: "#fbbf24", 500: "#f59e0b", 600: "#d97706", 700: "#b45309", 800: "#92400e", 900: "#78350f" },
  emerald: { name: "Emerald", 50: "#ecfdf5", 100: "#d1fae5", 200: "#a7f3d0", 400: "#34d399", 500: "#10b981", 600: "#059669", 700: "#047857", 800: "#065f46", 900: "#064e3b" },
  violet: { name: "Violet", 50: "#f5f3ff", 100: "#ede9fe", 200: "#ddd6fe", 400: "#a78bfa", 500: "#8b5cf6", 600: "#7c3aed", 700: "#6d28d9", 800: "#5b21b6", 900: "#4c1d95" },
};
function applyAccentTheme(key) {
  const t = ACCENT_THEMES[key] || ACCENT_THEMES.indigo;
  Object.keys(t).forEach(shade => { if (shade !== "name") document.documentElement.style.setProperty("--accent-" + shade, t[shade]); });
  document.documentElement.style.setProperty("--button-text", pickButtonTextColor(t[600]));
}
/* ---- Phase 4: Theme & Color Customizer ----
   Lets a user override the accent (button) color, the sidebar/navbar color, and the page
   background with their own hex code, saved per user via uiPrefs.customTheme (see
   defaultUiPrefs/loadUiPrefs) — so it's independent per login AND per device, exactly like the
   rest of Customize Display. Leaving a field blank keeps the existing preset-palette / default
   look untouched; nothing changes for anyone who never opens the customizer. */
function hexToRgb(hex) {
  const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec((hex || "").trim());
  return m ? { r: parseInt(m[1], 16), g: parseInt(m[2], 16), b: parseInt(m[3], 16) } : null;
}
function rgbToHex(r, g, b) { return "#" + [r, g, b].map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, "0")).join(""); }
/* Blends `hex` toward white (weight>0) or black (weight<0); weight is -1..1. Mirrors how Tailwind's
   own 50/100/200 (lighter) and 700/800/900 (darker) shades relate to a 500/600 base color, so a
   single custom hex still produces a full, usable --accent-50..900 ramp. */
function shadeHex(hex, weight) {
  const c = hexToRgb(hex); if (!c) return hex;
  const mix = weight >= 0 ? { r: 255, g: 255, b: 255 } : { r: 0, g: 0, b: 0 };
  const w = Math.abs(weight);
  return rgbToHex(c.r + (mix.r - c.r) * w, c.g + (mix.g - c.g) * w, c.b + (mix.b - c.b) * w);
}
function isValidHex(hex) { return !!hexToRgb(hex); }
function applyCustomAccent(hex) {
  if (!isValidHex(hex)) return;
  const shades = { 50: shadeHex(hex, 0.94), 100: shadeHex(hex, 0.86), 200: shadeHex(hex, 0.7), 400: shadeHex(hex, 0.18), 500: hex, 600: shadeHex(hex, -0.08), 700: shadeHex(hex, -0.22), 800: shadeHex(hex, -0.38), 900: shadeHex(hex, -0.55) };
  Object.keys(shades).forEach(shade => document.documentElement.style.setProperty("--accent-" + shade, shades[shade]));
  document.documentElement.style.setProperty("--button-text", pickButtonTextColor(shades[600]));
}
/* Page background and sidebar/navbar are single flat colors (not a shade ramp) bound to their own
   CSS vars — see :root defaults and body/.app-sidebar rules in the <style> block, and applyTheme
   below which is called once per uiPrefs change. */
/* Relative luminance (WCAG formula) of a hex color, 0 (black) to 1 (white) — used only to pick a
   readable fallback text color for the handful of headings/labels that sit directly on the page
   background rather than inside a themed card (see --page-text below). */
function relLuminance(hex) {
  const c = hexToRgb(hex); if (!c) return 1;
  const lin = (v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
  return 0.2126 * lin(c.r) + 0.7152 * lin(c.g) + 0.0722 * lin(c.b);
}
/* WCAG contrast ratio between two colors, 1 (identical/invisible) to 21 (black on white). */
function contrastRatio(hex1, hex2) {
  const l1 = relLuminance(hex1), l2 = relLuminance(hex2);

   the moment someone picks a light/pale color in the "Buttons" swatch (Phase 4 customizer) since
   there was no check at all for that pairing. White wins whenever it's readable (matches every
   button's original look); otherwise falls back to a dark slate, whichever of the two actually

     broke on saturated hues like pure red/blue/magenta: WCAG's luminance formula weights green

     Light text picked for "dark" red on top of a near-white card is invisible — exactly this bug.

     the contrast guardrail (effectiveCustomTextColor) — this is the fix for text becoming unreadable:
     both from a background/text mismatch, AND from the text-color picker itself being set to
     something that doesn't work. A rejected color simply isn't applied (falls back to the safe
     automatic behavior); the Settings screen shows why (see the Text Color field below). */
  const effText = effectiveCustomTextColor(uiPrefs);

const FORM_FIELDS_KEY = (bizId, formType) => "erp_form_fields_" + bizId + "_" + formType;

   fields, tagged with where each came from. */
function getAllFieldDefs(bizType, formType) {

  const presetFields = formType === "inventory" ? (preset.inventoryFields || []).map(f => ({ ...f, source: "preset" })) : [];
  return [...core, ...presetFields];

  const [custom, setCustom] = useState(() => getEffectiveFormCustomization(bizId, bizType, formType));
  useEffect(() => { setCustom(getEffectiveFormCustomization(bizId, bizType, formType)); }, [bizId, bizType, formType]);
  useEffect(() => { if (bizId) saveFormCustomization(bizId, formType, custom); }, [bizId, formType, custom]);

/* Best-effort parse of a short date fragment pulled off a DigiKhata PDF row (e.g. "12 Jan 25" or
   "12 Jan 2025") into an ISO yyyy-mm-dd string for storage as a customer's lastActivity. Returns

   silently dropped. */
function parseDigikhataDateFragment(raw) {
  const s = String(raw || "").trim();
  if (!s) return "";

  if (!m) return s;

  const mo = months[m[2].slice(0, 3).toLowerCase()];

  let yr = parseInt(m[3], 10);
  if (yr < 100) yr += yr < 70 ? 2000 : 1900;
  const dt = new Date(yr, mo, parseInt(m[1], 10));

}
function saveJSON(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { console.error(e); } }

}

    const c = text[i];
    if (inQuotes) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQuotes = false; }
      else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ""; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ""; }
      else if (c === '\r') { }
      else field += c;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  if (rows.length === 0) return [];
  const headers = rows[0];
  return rows.slice(1).filter(r => r.length > 1 || (r[0] && r[0].trim())).map(r => { const obj = {}; headers.forEach((h, idx) => obj[h] = r[idx] !== undefined ? r[idx] : ""); return obj; });

/* Reads a legacy/opening-balance value out of an imported row under any of a few common column

   and thousands separators. Returns "" (leave unchanged on update) when the row has no such column
   at all, so importing a file without a balance column never wipes an existing customer's balance. */
function pickBalanceValue(r) {
  const raw = r.openingBalance ?? r.balance ?? r.outstandingBalance ?? r.outstanding;
  if (raw === undefined || raw === null || raw === "") return "";
  const num = parseFloat(String(raw).replace(/[^0-9.-]/g, ""));
  return isNaN(num) ? "" : num;

/* Reads a last-activity date off an imported row (currently populated by the DigiKhata PDF

/* Reconstructs real per-row lines of text from a PDF page. pdf.js only hands back a flat list of
   text runs with x/y positions and no notion of "this is one table row" — items are grouped by
   y-position (with a small tolerance for sub-pixel jitter) into visual lines, then each line's
   items are ordered left-to-right by x-position. This is also what makes DigiKhata's own row-order
   bug detectable downstream: DigiKhata's PDF export lays a short (single-line) table row out
   right-to-left on the page, so reading it back in physical left-to-right order yields the row's
   columns in REVERSE order (date, amount, phone, name, #) — see parseDigikhataCustomersList below,
   which knows how to undo exactly that. */

    if (!line) { line = { y, items: [] }; lines.push(line); }
    line.items.push(it);

  const [lastSyncedAt, setLastSyncedAt] = useState(() => loadJSON(GOOGLE_DRIVE_LAST_SYNC_KEY(bizId), null));
  const [errorMsg, setErrorMsg] = useState("");
  const connectedRef = useRef(false);
  const syncTimerRef = useRef(null);
  const bizRef = useRef(biz); bizRef.current = biz;
  const dataRef = useRef(data); dataRef.current = data;
  const bizIdRef = useRef(bizId); bizIdRef.current = bizId;

  async function performSync(interactive) {
    // Offline-first: local storage is always the source of truth and every POS/ERP feature keeps
    // working with zero connectivity. Drive sync is a background convenience on top of that, so a
    // silent (non-interactive) attempt while offline just quietly skips instead of throwing an
    // error the user would have to dismiss. An interactive "Backup Now"/"Connect" click still shows
    // a clear message, since that's a deliberate action the user is waiting on.
    if (!navigator.onLine) {
      if (!interactive) { setStatus(connectedRef.current ? "offline" : "signed-out"); return; }
      setStatus("error"); setErrorMsg("No internet connection right now. Your data is safely saved locally — this will sync automatically once you're back online.");
      return;
    }
    setStatus("syncing"); setErrorMsg("");
    const token = await requestGoogleDriveToken(interactive);
    const user = await gDriveGetUserInfo(token);
    setAccount(user);
    await gDriveUploadBackup(token, bizIdRef.current, bizRef.current, dataRef.current);
    const now = new Date().toISOString();
    setLastSyncedAt(now);
    saveJSON(GOOGLE_DRIVE_LAST_SYNC_KEY(bizIdRef.current), now);
    connectedRef.current = true;
    saveJSON(GOOGLE_DRIVE_CONNECTED_KEY, true);
    setStatus("synced");
  }
  function connect() { performSync(true).catch(e => { setStatus("error"); setErrorMsg(e.message || String(e)); }); }
  function syncNow() { if (connectedRef.current) performSync(false).catch(e => { setStatus("error"); setErrorMsg(e.message || String(e)); }); }
  function disconnect() {
    connectedRef.current = false; gDriveAccessToken = null; setAccount(null);
    setStatus(GOOGLE_DRIVE_ENABLED ? "signed-out" : "disabled");
    localStorage.removeItem(GOOGLE_DRIVE_CONNECTED_KEY);
  }
  /* Restoring is deliberately NOT tied to `bizId` — see gDriveListBackups above. */
  async function listBackups() {
    if (!navigator.onLine) throw new Error("No internet connection — connect to Wi-Fi/mobile data and try again. Nothing on this device is affected while offline.");
    const token = await requestGoogleDriveToken(!connectedRef.current);
    return gDriveListBackups(token);
  }
  async function downloadBackup(fileId) {
    if (!navigator.onLine) throw new Error("No internet connection — connect to Wi-Fi/mobile data and try again.");
    const token = await requestGoogleDriveToken(!connectedRef.current);
    return gDriveDownloadFile(token, fileId);
  }

  // On load: if previously connected, try a silent (non-interactive) reconnect. May fail quietly
  // if the browser's Google session has since ended — that's fine, the badge just shows
  // "Connect Google Drive" again and one click restarts it.
  useEffect(() => {
    if (!GOOGLE_DRIVE_ENABLED || !loadJSON(GOOGLE_DRIVE_CONNECTED_KEY, false)) return;
    performSync(false).catch(() => { setStatus("signed-out"); });
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  // Debounced auto-upload whenever data changes, exactly like the local AutoBackupBadge effect,
  // just pushed to Drive instead of (in addition to) localStorage. Only runs once connected.
  useEffect(() => {
    if (!GOOGLE_DRIVE_ENABLED || !connectedRef.current) return;
    if (syncTimerRef.current) clearTimeout(syncTimerRef.current);
    syncTimerRef.current = setTimeout(() => { performSync(false).catch(e => { setStatus("error"); setErrorMsg(e.message || String(e)); }); }, 3000);
    return () => { if (syncTimerRef.current) clearTimeout(syncTimerRef.current); };
  }, [data, bizId]);

  // Offline-first resilience: the moment connectivity returns, quietly catch up any backup that
  // was skipped while offline — no popup, no interruption to whatever the person is doing (billing,
  // adding stock, etc. all kept working locally the entire time this was disconnected).
  useEffect(() => {
    if (!GOOGLE_DRIVE_ENABLED) return;
    function onOnline() { if (connectedRef.current) performSync(false).catch(e => { setStatus("error"); setErrorMsg(e.message || String(e)); }); }
    window.addEventListener("online", onOnline);
    return () => window.removeEventListener("online", onOnline);
  }, []);

  return { enabled: GOOGLE_DRIVE_ENABLED, account, status, lastSyncedAt, errorMsg, connect, disconnect, syncNow, listBackups, downloadBackup };
}

/* ---- Cloud data document helpers (Firestore) ---- */
function cloudBizDocRef(bizId) { return fbDb.collection("businesses").doc(bizId); }
/* Self-provisions the signed-in user as a member of this business the first time they touch it,
   so cloud sync works immediately after signing in rather than needing an Admin to manually add
   them in the Firebase Console. Idempotent (merge: true) — safe to call on every sign-in/business
   switch. Requires the "allow create" rule on /members/{uid} in FIRESTORE_RULES_REFERENCE below;
   without that rule update pasted into the Firebase Console, this write (and therefore all cloud
   sync) will fail with "permission denied". */
function cloudEnsureMembership(bizId, uid) {
  if (!CLOUD_ENABLED || !fbDb || !bizId || !uid) return Promise.resolve();
  return cloudBizDocRef(bizId).collection("members").doc(uid)
    .set({ addedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
}
/* ---- Device & Browser Login Approval (Settings -> Security) ----
   Every browser/device gets its own persistent deviceId (see getOrCreateDeviceId). The FIRST
   device ever seen for a business is auto-approved (otherwise nobody could ever get in to approve
   anything) — every device after that starts "pending_approval" until an Admin approves it from
   another already-approved device. Enforcement is client-side (same trust model the rest of this
   app already uses for permissions — there's no server-side role check without Cloud Functions,
   which this project doesn't use), so treat this as a real deterrent against someone opening the
   shop's link on a random device, not as airtight security against a determined attacker who can
   read/edit this file's own source. */
function cloudDevicesCollectionRef(bizId) { return cloudBizDocRef(bizId).collection("approved_devices"); }
function cloudDeviceDocRef(bizId, deviceId) { return cloudDevicesCollectionRef(bizId).doc(deviceId); }
async function cloudRegisterDevice(bizId, deviceId, userInfo) {
  if (!CLOUD_ENABLED || !fbDb || !bizId || !deviceId) return "disabled";
  const ref = cloudDeviceDocRef(bizId, deviceId);
  const snap = await ref.get();
  if (snap.exists) {
    // Already known — just refresh "last seen" info, never touch its approval status here.
    await ref.set({ lastSeenAt: firebase.firestore.FieldValue.serverTimestamp(), lastUser: userInfo }, { merge: true });
    return snap.data().status || "pending_approval";
  }
  // New device for this business — is it the first APPROVED device, not merely the first device
  // doc ever created? (Checking "zero devices at all" would only bootstrap once, ever — if that
  // first device somehow ended up not-approved, or its registration write failed/was incomplete,
  // every subsequent login would see a non-empty collection and never re-bootstrap, permanently
  // locking everyone out on what's supposed to be a fresh deployment. Checking for zero APPROVED
  // devices instead makes this self-healing: as long as literally nobody is approved yet, whoever
  // logs in next becomes the bootstrap admin.)
  const existingApproved = await cloudDevicesCollectionRef(bizId).where("status", "==", "approved").limit(1).get();
  const status = existingApproved.empty ? "approved" : "pending_approval";
  await ref.set({
    deviceId, status, label: deviceLabel(),
    firstSeenAt: firebase.firestore.FieldValue.serverTimestamp(),
    lastSeenAt: firebase.firestore.FieldValue.serverTimestamp(),
    lastUser: userInfo,
  }, { merge: true });
  return status;
}
function cloudSetDeviceStatus(bizId, deviceId, status, approverName) {
  if (!CLOUD_ENABLED || !fbDb) return;
  cloudDeviceDocRef(bizId, deviceId).set({
    status,
    reviewedAt: firebase.firestore.FieldValue.serverTimestamp(),
    reviewedBy: approverName || "",
  }, { merge: true }).catch(err => console.warn("Device approval update failed:", err.message));
}
/* SHA-256 hex digest via the browser's built-in Web Crypto API — no library needed. Used only to
   avoid storing the Emergency Master PIN in plain text in Firestore; this is light obfuscation
   against a casual look at the database, NOT strong security — anyone able to read this file's own
   source (which is what enforces the whole approval system client-side to begin with) could extract
   an entered PIN just as easily as they could patch around the check entirely. Treat the PIN the
   same way as everything else in this feature: a real deterrent, not a vault. */
async function sha256Hex(text) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
}
/* Self-approve THIS device — used by both the Primary Admin Email shortcut and the Emergency
   Master PIN unlock on the blocked screen. Writes straight to Firestore rather than going through
   an Admin's separate device; if this write itself fails (most likely: the approved_devices-subcollection
   Firestore rule hasn't been pasted into the Console yet), the caller shows that specific guidance
   rather than a generic error, since this exact write is the one most likely to fail on a brand-new
   deployment. */
async function cloudEmergencyApproveDevice(bizId, deviceId, approverLabel) {
  await cloudDeviceDocRef(bizId, deviceId).set({
    deviceId, status: "approved", label: deviceLabel(),
    firstSeenAt: firebase.firestore.FieldValue.serverTimestamp(),
    lastSeenAt: firebase.firestore.FieldValue.serverTimestamp(),
    reviewedAt: firebase.firestore.FieldValue.serverTimestamp(),
    reviewedBy: approverLabel || "Emergency access",
  }, { merge: true });
}
/* Registers this device on login and keeps listening live so an approval/block from another
   device takes effect immediately, without needing a reload. STRICT / fail-CLOSED: only a
   confirmed "approved" status read back from Firestore ever grants access — "checking",
   "pending_approval", "blocked", and "error" (registration/listener failure, most likely because
   the approved_devices-subcollection Firestore rule below hasn't been pasted into the Console yet) are ALL
   treated as not-approved by the caller (App component) and by useCloudSync's `deviceApproved`
   gate. This is a deliberate change from an earlier fail-open design: if you're setting this up
   fresh, make sure FIRESTORE_RULES_REFERENCE's devices rule is live BEFORE relying on this, or
   every device (including the first/bootstrap one) can end up stuck on the block screen. */
/* Two-Tier Authentication Architecture — Step 1 (Device Level Security).
   This hook deliberately does NOT depend on `currentUser` — it must resolve BEFORE anyone has
   logged in, since the device-approval gate in App() now runs ahead of the User Login Screen
   (Step 2). `currentUser` is accepted only to attach a friendly "lastUser" label to the device
   record when someone happens to already be logged in (e.g. re-checking mid-session after a
   business switch); it's optional and the whole flow works fine when it's null. STRICT / fail-
   closed: "checking", "pending_approval", "blocked", and "error" are all treated as NOT approved
   by the caller — only a confirmed "approved" read back from Firestore ever unlocks Step 2. */
function useDeviceApproval(bizId, cloudUser, currentUser) {
  const deviceId = useMemo(() => getOrCreateDeviceId(), []);
  const [status, setStatus] = useState(CLOUD_ENABLED ? "checking" : "disabled");
  useEffect(() => {
    if (!CLOUD_ENABLED || !cloudUser || !bizId) { setStatus(CLOUD_ENABLED ? "checking" : "disabled"); return; }
    let cancelled = false, unsub = null;
    setStatus("checking");

        // Calling it here too removes a race: without this, device registration could try to write
        // before membership exists yet (both effects fire together and neither awaits the other),
        // which the Firestore rule below would reject. Harmless if it's already been created.
        await cloudEnsureMembership(bizId, cloudUser.uid);
        initial = await cloudRegisterDevice(bizId, deviceId, currentUser ? { name: currentUser.name, username: currentUser.username } : { name: "(not logged in yet)", username: "" });
      } catch (err) {
        console.warn("Device registration failed:", err.message);
        if (!cancelled) setStatus("error");
        return;
      }
      if (cancelled) return;
      setStatus(initial);
      unsub = cloudDeviceDocRef(bizId, deviceId).onSnapshot(
        snap => { if (snap.exists) setStatus(snap.data().status || "pending_approval"); },
        err => console.warn("Device status listener failed:", err.message)
      );
    })();
    return () => { cancelled = true; if (unsub) unsub(); };
  }, [bizId, cloudUser]);
  // Once someone logs in (Step 2), silently refresh the device record's "lastUser" label so the
  // Security panel shows who's actually using an already-approved device — purely cosmetic, never
  // re-gates status, so it can't interfere with the strict check above.
  useEffect(() => {
    if (!CLOUD_ENABLED || !cloudUser || !bizId || !currentUser || status !== "approved") return;
    cloudRegisterDevice(bizId, deviceId, { name: currentUser.name, username: currentUser.username }).catch(() => {});
  }, [currentUser && currentUser.id, status]);
  return { status, deviceId };
}
/* Pushes the local `data` blob to Firestore. Safe to call while offline — the SDK queues the
   write in its local cache and flushes it automatically once connectivity returns. */
function cloudPushData(bizId, data) {
  if (!CLOUD_ENABLED || !fbDb) return;
  cloudBizDocRef(bizId).set({ data, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: false })
    .catch(err => console.warn("Cloud sync (push) failed — will retry automatically:", err.message));
}
/* The user/role roster (unlike `data`, which is per-business) is shared across all businesses on
   this shop's account, so it lives in one fixed document rather than one per business. This is
   what makes self-registration + Admin approval work across devices: someone can register from
   their own phone, and the Admin sees + approves them from the shop's computer, because both are
   reading/writing the same cloud document instead of each device's own LocalStorage copy. */
function cloudUsersDocRef() { return fbDb.collection("system").doc("shop_users"); }
function cloudPushUsers(users) {
  if (!CLOUD_ENABLED || !fbDb) return;
  cloudUsersDocRef().set({ users, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: false })
    .catch(err => console.warn("Cloud user sync (push) failed — will retry automatically:", err.message));
}
/* One-shot pull, used on load (and after registering/approving) so this device sees the latest
   roster from the cloud. Returns null on any failure or if cloud isn't configured, so callers can
   simply keep whatever they already have locally. */
async function cloudPullUsers() {
  if (!CLOUD_ENABLED || !fbDb) return null;
  try {
    const snap = await cloudUsersDocRef().get();
    if (!snap.exists) return null;
    const remote = snap.data().users;
    return Array.isArray(remote) ? remote : null;
  } catch (err) { console.warn("Cloud user sync (pull) failed:", err.message); return null; }
}
/* Merge remote + local rosters by id: the cloud copy wins for any user that exists in both places
   (so an Admin's approval / edit made elsewhere is respected), while any purely-local user not
   yet seen in the cloud (e.g. the very first "admin" account before cloud was ever turned on) is
   kept too, rather than silently dropped. */
function mergeUsersFromCloud(local, remote) {
  if (!remote) return local;
  const byId = new Map(remote.map(u => [u.id, u]));
  local.forEach(u => { if (!byId.has(u.id)) byId.set(u.id, u); });
  return Array.from(byId.values());
}
/* The list of businesses itself (name/address/phone/header per shop) needs the exact same shared-
   document treatment as the user roster above — and for the same underlying reason. Each business's
   actual data (inventory/sales/customers/etc, see cloudBizDocRef) already syncs correctly by bizId
   once a device knows which bizId to use. But bizId itself used to be invented LOCALLY the first
   time the app opened in a browser with empty localStorage (see the businesses useState initializer
   in App()) — so a second device opening the app for the first time generated its OWN new business
   with its own new id and sample data, and would sync THAT to the cloud instead of ever discovering
   the real shop's existing business. Two devices would then each faithfully sync to Firestore, just
   to two totally different documents — which is exactly what "data mismatch between browsers" looks
   like. Mirroring cloudUsersDocRef/cloudPushUsers/cloudPullUsers/mergeUsersFromCloud here, plus the
   App()-level pull-and-adopt effect below, is what lets a brand-new device discover and switch to
   the shop's real cloud business instead of quietly working on its own disconnected local one. */
function cloudBusinessesDocRef() { return fbDb.collection("system").doc("businesses"); }
function cloudPushBusinesses(businesses) {
  if (!CLOUD_ENABLED || !fbDb) return;
  cloudBusinessesDocRef().set({ businesses, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: false })
    .catch(err => console.warn("Cloud business-list sync (push) failed — will retry automatically:", err.message));
}
async function cloudPullBusinesses() {
  if (!CLOUD_ENABLED || !fbDb) return null;
  try {
    const snap = await cloudBusinessesDocRef().get();
    if (!snap.exists) return null;
    const remote = snap.data().businesses;
    return Array.isArray(remote) && remote.length ? remote : null;
  } catch (err) { console.warn("Cloud business-list sync (pull) failed:", err.message); return null; }
}
function mergeBusinessesFromCloud(local, remote) {
  if (!remote) return local;
  const byId = new Map(remote.map(b => [b.id, b]));
  local.forEach(b => { if (!byId.has(b.id)) byId.set(b.id, b); });
  return Array.from(byId.values());
}
/* React hook: subscribes to remote changes for the active business and mirrors them into local
   state, while also pushing local changes up (debounced). `skipNextPush` guards against feedback
   loops when a snapshot we just wrote ourselves echoes back.
   Returns a small status object the UI reads to show a Google-Sheets-style indicator:
     state: "disabled" | "signed-out" | "connecting" | "syncing" | "offline-queued" | "synced" | "error"
     lastSyncedAt: ISO string of the last confirmed server sync, or null
   "syncing"/"offline-queued" both mean "there are local changes not yet confirmed by the server" —
   they're split only so the UI can say *why* (still flushing vs. genuinely offline right now). The
   underlying mechanism is identical either way: Firestore's local cache queues the write and the
   SDK retries automatically the instant the connection returns, no extra code needed for that part. */
/* `deviceApproved` (default true) gates ALL Firestore reads/writes of the actual business `data`
   blob behind the Device & Browser Approval system below — pass `false` while a device's status is
   anything other than a confirmed "approved" and this hook won't subscribe to or push the business
   data document at all, no matter what `data`/`cloudUser`/`bizId` are. This is the strict/fail-closed
   half of device enforcement; the other half is the full-app render gate in App(). */
function useCloudSync(bizId, data, setData, cloudUser, deviceApproved) {
  const pushTimer = useRef(null);
  const lastPushedJSON = useRef(null);
  // True once we've heard from the server at least once for the CURRENT bizId. Pushes are blocked
  // until then — see the push effect below for why this is the actual fix for cross-device data
  // loss, not just the hasPendingWrites issue fixed earlier.
  const initialSyncDone = useRef(false);
  const [status, setStatus] = useState({ state: CLOUD_ENABLED ? "connecting" : "disabled", lastSyncedAt: null });

  useEffect(() => {
    if (!CLOUD_ENABLED) { setStatus({ state: "disabled", lastSyncedAt: null }); return; }
    if (deviceApproved === false) { setStatus(s => ({ ...s, state: "device-unapproved" })); return; }
    if (!cloudUser || !bizId) { setStatus(s => ({ ...s, state: "signed-out" })); return; }
    setStatus(s => ({ ...s, state: "connecting" }));
    // Reset for the new bizId/session — this device must hear from the server again before it's
    // allowed to push anything for it (see push effect below).
    initialSyncDone.current = false;
    lastPushedJSON.current = null;
    let cancelled = false, unsub = null;
    (async () => {
      // Provision membership BEFORE subscribing — an onSnapshot listener that starts before the
      // membership doc exists gets a permission-denied error and stops, it doesn't just retry
      // once permissions later become valid.
      try { await cloudEnsureMembership(bizId, cloudUser.uid); }
      catch (err) { console.warn("Cloud membership provisioning failed:", err.message); }
      if (cancelled) return;
      unsub = cloudBizDocRef(bizId).onSnapshot({ includeMetadataChanges: true }, (snap) => {
        // Hearing from the server AT ALL (even "no document yet") means this device now has a
        // real baseline for this bizId and may push from here on.
        initialSyncDone.current = true;
        if (!snap.exists) { setStatus(s => ({ ...s, state: "synced", lastSyncedAt: new Date().toISOString() })); return; }
        // BUG (fixed earlier): this used to also return here whenever snap.metadata.hasPendingWrites
        // was true. hasPendingWrites reflects whether THIS device has ANY of its own unconfirmed
        // writes, not whether the incoming snapshot carries something new from another device — so
        // any device with even a small edit in flight would silently drop every incoming update,
        // including real changes from other phones. Fixed by always doing the JSON comparison below
        // regardless of pending-write status; pendingWrites now only affects the status badge text.
        const remote = snap.data();
        // BUG (fixed): this used to store the RAW remote.data JSON in lastPushedJSON, but the
        // local `data` state actually gets set to normalizeData(remote.data) two lines below — a
        // different object (normalizeData fills in defaults, coerces types, etc.) with different
        // JSON text. So the very next time the push effect ran, JSON.stringify(data) (normalized)
        // never matched lastPushedJSON.current (raw) even though nothing had genuinely changed —
        // every single incoming update from another device triggered an immediate, unnecessary
        // round-trip push of the just-normalized copy right back to the server. Harmless in that
        // it didn't lose data, but it meant extra writes and extra listener churn on every device
        // for every sync, and moved the whole thing one step further from "this is really settled"
        // being observable in the status badge. Fixed by normalizing BEFORE computing the JSON used
        // for comparison/storage, so both sides of every comparison in this hook are in the same
        // "already normalized" shape — matching what the push effect below always sends (`data` is
        // always normalized-shaped locally).
        const normalized = normalizeData(remote.data);
        const normalizedJSON = JSON.stringify(normalized);
        if (normalizedJSON !== lastPushedJSON.current) {
          lastPushedJSON.current = normalizedJSON;
          setData(normalized);
        }
        setStatus(snap.metadata.hasPendingWrites
          ? { state: navigator.onLine ? "syncing" : "offline-queued", lastSyncedAt: null }
          : { state: "synced", lastSyncedAt: new Date().toISOString() });
      }, (err) => { console.warn("Cloud sync (listen) failed:", err.message); setStatus(s => ({ ...s, state: "error" })); });
    })();
    return () => { cancelled = true; if (unsub) unsub(); };
  }, [bizId, cloudUser, deviceApproved]);

  /* BIGGER BUG (fixed): there was no gate stopping this effect from pushing BEFORE the subscribe
     effect above had ever heard from the server. On every fresh page load (and on every business
     switch), `data` starts out as whatever's sitting in this device's own localStorage — which
     could easily be stale (this device hasn't synced in a while) or flat-out empty/placeholder
     (this device has never opened this business before). That state differs from lastPushedJSON
     (null at that point), so this effect would happily schedule a push of it 1200ms later — a race
     against the subscribe effect's own network round-trip to fetch the REAL server state. If the
     stale local push won that race, it overwrote perfectly good cloud data (written by another
     device) with this device's outdated local copy, silently. This is very likely the actual cause
     behind "changes on one phone don't show up on the other" persisting even after the
     hasPendingWrites fix — that fix stopped a device from ignoring incoming updates, but did
     nothing to stop a device from stomping the server with its own stale state on load. Gating on
     initialSyncDone means a device now always reconciles with the server's real data at least once
     before it's ever allowed to write — the same "pull before push" rule already applied to the
     shared businesses list is now applied here too, for the actual per-business data.
     Trade-off, stated plainly: if a local edit was made and never finished syncing (app closed or
     went offline mid-debounce) before this device's very first connection to a given bizId, that
     unsynced edit is superseded by the server's copy on next load rather than being pushed. Once
     "Connected"/"synced" has shown at least once for a session, this doesn't apply — every edit
     after that point pushes normally. */
  useEffect(() => {
    if (!CLOUD_ENABLED || !fbDb || !cloudUser || !bizId) return;
    if (deviceApproved === false) return; // strict device gate — no push while unapproved
    if (!initialSyncDone.current) return;
    const json = JSON.stringify(data);
    if (json === lastPushedJSON.current) return; // nothing changed since last sync
    setStatus(s => ({ ...s, state: navigator.onLine ? "syncing" : "offline-queued" }));
    if (pushTimer.current) clearTimeout(pushTimer.current);
    // Debounce so rapid local edits (typing, etc.) don't spam Firestore writes.
    pushTimer.current = setTimeout(() => { lastPushedJSON.current = json; cloudPushData(bizId, data); }, 1200);
    return () => clearTimeout(pushTimer.current);
  }, [data, bizId, cloudUser, deviceApproved]);

  /* Explicit "Sync Now" action, e.g. right after reconnecting. Bypasses the debounce timer but NOT
     the initialSyncDone gate above — a manual sync button is just as capable of stomping good cloud
     data with a device's stale local copy as the automatic effect is, if clicked before this device
     has ever heard from the server for this bizId (previously it called cloudPushData directly and
     had no such protection at all). If a real edit is genuinely waiting (json differs), this still
     pushes it immediately instead of waiting out the 1200ms debounce. */
  function syncNow() {
    if (!CLOUD_ENABLED || !fbDb || !cloudUser || !bizId || !initialSyncDone.current) return;
    if (pushTimer.current) clearTimeout(pushTimer.current);
    const json = JSON.stringify(data);
    lastPushedJSON.current = json;
    cloudPushData(bizId, data);
  }

  return { ...status, syncNow };
}

/* ---- Firebase Storage helper ---- */
/* Converts a base64 data-URL (as produced by ImageField/fileToBase64) into a Storage upload and
   returns the public download URL. Used for photo fields so large images don't bloat Firestore
   documents (1MB/doc limit) — the field keeps working as a plain base64 string in local-only mode. */
async function uploadDataUrlToStorage(dataUrl, path) {
  if (!CLOUD_ENABLED || !fbStorage || !dataUrl || !dataUrl.startsWith("data:")) return dataUrl;
  try {
    const ref = fbStorage.ref().child(path);
    await ref.putString(dataUrl, "data_url");
    return await ref.getDownloadURL();
  } catch (e) {
    console.warn("Storage upload failed, keeping local copy:", e.message);
    return dataUrl;
  }
}

/* ---- Firebase Authentication helpers ---- */
function cloudSignUp(email, password) { return fbAuth.createUserWithEmailAndPassword(email, password); }

/* ---------- auth / permission-matrix helpers ----------
   Each module (tab) carries its own CRUD permission object: { view, add, edit, delete }.
   Admins always have full access everywhere and are never shown in / limited by this matrix
   (so an Admin can never accidentally lock themselves, or every admin, out of the system). */
const CRUD_ACTIONS = ["view", "add", "edit", "delete"];
function blankCrud(on) { return { view: !!on, add: !!on, edit: !!on, delete: !!on }; }
function defaultPermsForRole(role) {
  const allowed = ROLE_TABS[role] || [];
  const perms = {};
  TABS.forEach(t => { perms[t.id] = blankCrud(allowed.includes(t.id)); });
  return perms;
}
/* Accepts either the current { view, add, edit, delete } shape, or the older single-boolean-
   per-tab shape from before granular CRUD permissions existed, and always returns the full
   CRUD shape for every module (filling any missing module from the role's defaults). */
function normalizePerms(permissions, role) {
  const base = defaultPermsForRole(role);
  const out = {};
  TABS.forEach(t => {
    const p = permissions ? permissions[t.id] : undefined;
    if (p && typeof p === "object") {
      out[t.id] = { view: !!p.view, add: !!p.add, edit: !!p.edit, delete: !!p.delete };
    } else if (typeof p === "boolean") {
      out[t.id] = blankCrud(p); // legacy: one checkbox controlled view+add+edit+delete together
    } else {
      out[t.id] = base[t.id];
    }
  });
  return out;
}
/* The module list an Admin can toggle per-user. Admins themselves always have full access. */
function effectiveTabIds(user) {
  if (!user) return [];
  if (user.role === "Admin") return TABS.map(t => t.id);
  const perms = normalizePerms(user.permissions, user.role);
  return TABS.filter(t => perms[t.id].view).map(t => t.id);
}
/* Central CRUD check used everywhere in the UI to decide whether to show/enable an
   Add / Edit / Delete control for a given module. Admins can always do everything. */
function can(user, moduleId, action) {
  if (!user) return false;
  if (user.role === "Admin") return true;
  const perms = normalizePerms(user.permissions, user.role);
  return !!(perms[moduleId] && perms[moduleId][action]);
}
function loadUsers() {
  let users = loadJSON(USERS_KEY, null);
  if (!users || users.length === 0) {
    users = [{ id: uid("user"), username: "admin", password: "admin123", name: "Administrator", email: "", role: "Admin", permissions: defaultPermsForRole("Admin"), status: "Active" }];
    saveJSON(USERS_KEY, users);
  }
  // migrate any users saved before the (granular) permission matrix existed, the email field
  // (needed for OTP password recovery), or the status field (needed for self-registration +
  // Admin approval) were added — anyone saved before status existed was already a working,
  // Admin-created login, so they migrate straight to "Active", never "Pending".
  users = users.map(u => ({ ...u, permissions: normalizePerms(u.permissions, u.role), email: u.email || "", status: u.status || "Active" }));
  return users;
}
function findUser(users, username, password) {
  return users.find(u => u.username.trim().toLowerCase() === String(username).trim().toLowerCase() && u.password === password) || null;
}
/* Maps a signed-in Google account's email to an existing system user (by the same `email` field
   used for OTP password recovery) so that user's already-configured role & CRUD permissions are
   what apply — Google Sign-In authenticates WHO they are, the local user record still decides
   WHAT they're allowed to do. An Admin links an account by setting that person's email in
   Settings -> Manage Users; there is no auto-provisioning of new users via Google. */
function findUserByEmail(users, email) {
  if (!email) return null;
  const e = email.trim().toLowerCase();
  return users.find(u => u.email && u.email.trim().toLowerCase() === e) || null;
}

/* ---------- financial calcs ---------- */
function accountBalance(data, accountId) {
  const acc = data.accounts.find(a => a.id === accountId);
  let bal = acc ? Number(acc.openingBalance) || 0 : 0;
  data.sales.forEach(s => {
    if (s.accountId === accountId) bal += Number(s.paidAmount) || 0;
    (s.installmentPayments || []).forEach(p => { if (p.type !== "discount" && p.accountId === accountId) bal += Number(p.amount) || 0; });
  });
  data.customers.forEach(c => {
    (c.openingBalancePayments || []).forEach(p => { if (p.type !== "discount" && p.accountId === accountId) bal += Number(p.amount) || 0; });
  });
  data.dealerPayments.forEach(p => { if (p.accountId === accountId) bal -= Number(p.amount) || 0; });
  (data.expenses || []).forEach(e => { if (e.accountId === accountId) bal -= Number(e.amount) || 0; });
  (data.salaryPayments || []).forEach(p => { if (p.accountId === accountId) bal -= Number(p.amount) || 0; });
  (data.partnerTransactions || []).forEach(t => { if (t.type === "drawing" && t.accountId === accountId) bal -= Number(t.amount) || 0; });
  // Phase 3 — Advanced Shop Operations: cash-settled Return to Dealer is money coming IN (dealer
  // refunds us), cash-refunded Sale Return and every Buyback/Trade-In payout are money going OUT.
  (data.dealerReturns || []).forEach(r => { if (r.settlement === "cash" && r.accountId === accountId) bal += Number(r.totalAmount) || 0; });
  (data.saleReturns || []).forEach(r => { if (r.refundMethod === "cash" && r.accountId === accountId) bal -= Number(r.totalAmount) || 0; });
  (data.buybacks || []).forEach(b => { if (b.accountId === accountId) bal -= Number(b.agreedPrice) || 0; });
  return bal;
}
/* Same ledger as accountBalance, but only counting transactions strictly BEFORE cutoffDate
   (an ISO date string) — i.e. the account's balance as of the start of that day. Powers the
   Day-End Cash Summary's "Opening Balance" figure. */
function accountBalanceAsOf(data, accountId, cutoffDate) {
  const before = (d) => !!d && d < cutoffDate;
  const acc = data.accounts.find(a => a.id === accountId);
  let bal = acc ? Number(acc.openingBalance) || 0 : 0;
  data.sales.forEach(s => {
    if (s.accountId === accountId && before(s.date)) bal += Number(s.paidAmount) || 0;
    (s.installmentPayments || []).forEach(p => { if (p.type !== "discount" && p.accountId === accountId && before(p.date || s.date)) bal += Number(p.amount) || 0; });
  });
  data.customers.forEach(c => {
    (c.openingBalancePayments || []).forEach(p => { if (p.type !== "discount" && p.accountId === accountId && before(p.date)) bal += Number(p.amount) || 0; });
  });
  data.dealerPayments.forEach(p => { if (p.accountId === accountId && before(p.date)) bal -= Number(p.amount) || 0; });
  (data.expenses || []).forEach(e => { if (e.accountId === accountId && before(e.date)) bal -= Number(e.amount) || 0; });
  (data.salaryPayments || []).forEach(p => { if (p.accountId === accountId && before(p.date)) bal -= Number(p.amount) || 0; });
  (data.partnerTransactions || []).forEach(t => { if (t.type === "drawing" && t.accountId === accountId && before(t.date)) bal -= Number(t.amount) || 0; });
  (data.dealerReturns || []).forEach(r => { if (r.settlement === "cash" && r.accountId === accountId && before(r.date)) bal += Number(r.totalAmount) || 0; });
  (data.saleReturns || []).forEach(r => { if (r.refundMethod === "cash" && r.accountId === accountId && before(r.date)) bal -= Number(r.totalAmount) || 0; });
  (data.buybacks || []).forEach(b => { if (b.accountId === accountId && before(b.date)) bal -= Number(b.agreedPrice) || 0; });
  return bal;
}
function saleCredit(sale) {
  const paymentsTotal = (sale.installmentPayments || []).reduce((s, p) => s + (Number(p.amount) || 0), 0);
  const totalCredited = (Number(sale.paidAmount) || 0) + paymentsTotal;
  const remaining = (Number(sale.salePrice) || 0) - totalCredited;
  const discountGiven = (sale.installmentPayments || []).filter(p => p.type === "discount").reduce((s, p) => s + (Number(p.amount) || 0), 0) + (Number(sale.discount) || 0);
  return { totalCredited, remaining, discountGiven };
}
function nextDueInfo(sale) {
  if (!sale.installmentPlan || sale.installmentPlan.length === 0) return null;
  const paidMonths = (sale.installmentPayments || []).filter(p => p.type === "payment" && p.month).map(p => p.month);
  return sale.installmentPlan.find(pl => !paidMonths.includes(pl.month)) || null;
}
/* ---------- Multi-item cart helpers ----------
   A sale can hold several different item "lines" (cart rows) — one per product/model — each with
   its own quantity (bulk accessories) or a single serialized unit (Mobile/Laptop/etc). sale.items
   holds these lines going forward. Sales saved before this feature only had a single
   itemId/itemIds/quantity/retailPrice/discount directly on the sale — saleLines() normalizes both
   shapes into the same array so every other part of the app can treat every sale as a cart. */
function saleLines(sale) {
  if (sale.items && sale.items.length) return sale.items;
  if (!sale.itemId) return [];
  const ids = sale.itemIds && sale.itemIds.length ? sale.itemIds : [sale.itemId];
  const qty = Number(sale.quantity) || ids.length || 1;
  return [{ itemId: sale.itemId, itemIds: ids, quantity: qty, unitPrice: qty ? (Number(sale.retailPrice) || 0) / qty : 0, lineRetail: Number(sale.retailPrice) || 0 }];
}
function saleAllItemIds(sale) {
  const out = [];
  saleLines(sale).forEach(l => { (l.itemIds && l.itemIds.length ? l.itemIds : (l.itemId ? [l.itemId] : [])).forEach(id => out.push(id)); });
  return out;
}
/* Resolves each cart line to its actual inventory item (for name/specs) — used by receipts and views. */
function saleItemsSummary(sale, data) {
  return saleLines(sale).map(l => ({ ...l, item: data.inventory.find(i => i.id === l.itemId) || null }));
}
function lineTotal(l) { return l.lineRetail != null ? Number(l.lineRetail) || 0 : (Number(l.unitPrice) || 0) * (Number(l.quantity) || 1); }
/* Short one-line summary of a sale's cart for table rows: "iPhone 13 x2 +1 more" etc. */
function saleItemsLabel(sale, data) {
  const lines = saleItemsSummary(sale, data);
  if (lines.length === 0) return "-";
  const first = lines[0].item ? lines[0].item.itemName : "(deleted item)";
  const qtySuffix = lines[0].quantity > 1 ? " x" + lines[0].quantity : "";
  if (lines.length === 1) return first + qtySuffix;
  return first + qtySuffix + " +" + (lines.length - 1) + " more";
}
function reminderList(data) {
  const rows = [];
  data.sales.filter(s => s.paymentType === "Installment").forEach(s => {
    const credit = saleCredit(s);
    if (credit.remaining <= 0) return;
    const next = nextDueInfo(s);
    if (!next) return;
    const diffDays = Math.round((new Date(next.dueDate) - new Date(todayISO())) / 86400000);
    if (diffDays <= 7) rows.push({ sale: s, next, diffDays, overdue: diffDays < 0, credit });
  });
  return rows.sort((a, b) => a.diffDays - b.diffDays);
}
function calcProfitLoss(data) {
  const revenue = data.sales.reduce((s, x) => s + (Number(x.salePrice) || 0), 0);
  const soldItemIds = data.sales.flatMap(s => saleAllItemIds(s));
  const cogs = data.inventory.filter(i => soldItemIds.includes(i.id)).reduce((s, i) => s + (Number(i.purchasePrice) || 0), 0);
  const grossProfit = revenue - cogs;
  const totalExpenses = (data.expenses || []).reduce((s, e) => s + (Number(e.amount) || 0), 0);
  const totalSalaries = (data.salaryPayments || []).reduce((s, p) => s + (Number(p.amount) || 0), 0);
  const netProfit = grossProfit - totalExpenses - totalSalaries;
  return { revenue, cogs, grossProfit, totalExpenses, totalSalaries, netProfit };
}
function inRange(dateStr, from, to) { if (!dateStr) return false; return (!from || dateStr >= from) && (!to || dateStr <= to); }
function presetRange(preset) {
  const today = todayISO();
  if (preset === "today") return { from: today, to: today };
  if (preset === "week") { const d = new Date(); const day = d.getDay(); const start = new Date(d); start.setDate(d.getDate() - day); return { from: start.toISOString().slice(0, 10), to: today }; }
  if (preset === "month") { const d = new Date(); const start = new Date(d.getFullYear(), d.getMonth(), 1); return { from: start.toISOString().slice(0, 10), to: today }; }
  if (preset === "year") { const d = new Date(); const start = new Date(d.getFullYear(), 0, 1); return { from: start.toISOString().slice(0, 10), to: today }; }
  return { from: "", to: "" };
}
function rangeFinancials(data, from, to) {
  const salesInRange = data.sales.filter(s => inRange(s.date, from, to));
  const revenue = salesInRange.reduce((s, x) => s + (Number(x.salePrice) || 0), 0);
  const soldItemIds = salesInRange.flatMap(s => saleAllItemIds(s));
  const cogs = data.inventory.filter(i => soldItemIds.includes(i.id)).reduce((s, i) => s + (Number(i.purchasePrice) || 0), 0);
  const purchasesInRange = data.purchases.filter(p => inRange(p.date, from, to)).reduce((s, p) => s + (Number(p.totalAmount) || 0), 0);
  const expensesInRange = (data.expenses || []).filter(e => inRange(e.date, from, to)).reduce((s, e) => s + (Number(e.amount) || 0), 0);
  const salariesInRange = (data.salaryPayments || []).filter(p => inRange(p.date, from, to)).reduce((s, p) => s + (Number(p.amount) || 0), 0);
  let recoveries = 0;
  data.sales.forEach(s => (s.installmentPayments || []).forEach(p => { if (p.type === "payment" && inRange(p.date, from, to)) recoveries += Number(p.amount) || 0; }));
  const netProfit = (revenue - cogs) - expensesInRange - salariesInRange;
  return { salesCount: salesInRange.length, revenue, cogs, purchasesInRange, expensesInRange, salariesInRange, recoveries, netProfit };
}
function partnerBalance(data, partnerId) {
  const partner = data.partners.find(p => p.id === partnerId);
  if (!partner) return { investment: 0, allocatedProfit: 0, drawings: 0, netBalance: 0 };
  const pl = calcProfitLoss(data);
  const allocatedProfit = pl.netProfit * (Number(partner.percent) || 0) / 100;
  const drawings = (data.partnerTransactions || []).filter(t => t.partnerId === partnerId && t.type === "drawing").reduce((s, t) => s + (Number(t.amount) || 0), 0);
  const investment = Number(partner.investment) || 0;
  return { investment, allocatedProfit, drawings, netBalance: investment + allocatedProfit - drawings };
}

/* Prints/Saves-as-PDF from the ACTUAL rendered ReceiptDesign DOM node (its outerHTML), so the PDF

function printReceiptNode(node, docTitle) {

/* ============================ WHATSAPP IMAGE RECEIPT (html2canvas) ============================
   Renders a fully-styled, on-brand receipt as real DOM (ReceiptDesign) and rasterizes it into a
   PNG using html2canvas — so it can be downloaded or shared as an image straight into a WhatsApp
   chat, instead of relying on WhatsApp's own text-only wa.me links (which stay available too,
   unchanged, alongside this). */
function initials(name) {
  const words = String(name || "Shop").trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return "S";
  return (words[0][0] + (words[1] ? words[1][0] : "")).toUpperCase();
}
/* Rolls up everything this customer has ever bought, across all their sales, so the receipt can
   show a "complete customer ledger" rather than just this one invoice. */
function customerLedgerSummary(data, customerId) {
  const sales = data.sales.filter(s => s.customerId === customerId);
  let totalValue = 0, totalPaid = 0;
  sales.forEach(s => { const c = saleCredit(s); totalValue += Number(s.salePrice) || 0; totalPaid += c.totalCredited; });
  // openingBalance: legacy/pre-app outstanding debt carried over on the customer record itself
  // (e.g. from a bulk import), added on top of what the app's own sales/installments track.
  // openingBalancePayments: payments received / waivers granted against that opening balance
  // (see OpeningBalancePanel) — netted off here rather than mutating openingBalance directly, so
  // re-importing the same source balance later doesn't wipe out payments already recorded.
  const cust = data.customers.find(c => c.id === customerId);
  const openingBalance = cust ? Number(cust.openingBalance) || 0 : 0;
  const openingBalanceSettled = cust ? (cust.openingBalancePayments || []).reduce((s, p) => s + (Number(p.amount) || 0), 0) : 0;
  const openingBalanceRemaining = openingBalance - openingBalanceSettled;
  // Sale Return credited to the customer's ledger (refundMethod "ledger") reduces what they owe,
  // exactly like an installment payment. A "cash" refund already left the shop's cash drawer (see
  // accountBalance) and does not touch what the customer owes, so it's excluded here.
  const returnsCredited = (data.saleReturns || []).filter(r => r.customerId === customerId && r.refundMethod === "ledger").reduce((s, r) => s + (Number(r.totalAmount) || 0), 0);
  return { salesCount: sales.length, totalValue, totalPaid, openingBalance, openingBalanceSettled, openingBalanceRemaining, returnsCredited, totalOutstanding: totalValue - totalPaid + openingBalanceRemaining - returnsCredited };
}
/* ============================ CUSTOMER LEDGER STATEMENT (bank-style, running balance) ============
   Builds one chronological list of every event that ever moved a customer's outstanding balance —
   the legacy opening balance first, then each sale (a DEBIT — it raises what they owe), every
   payment/installment/waiver against a sale (a CREDIT), and every payment/waiver recorded directly
   against the opening balance via OpeningBalancePanel — with a running balance carried through in
   date order, exactly like a bank statement. Powers the "View Ledger Report" button (statement view,
   PDF export, WhatsApp share) added to the Customers tab. */
function customerStatementRows(data, customerId) {
  const customer = data.customers.find(c => c.id === customerId);
  const opening = customer ? Number(customer.openingBalance) || 0 : 0;
  const entries = [];
  (data.sales || []).filter(s => s.customerId === customerId).forEach(s => {
    const label = saleItemsLabel(s, data);
    entries.push({ date: s.date || "", desc: "Sale" + (s.invoiceId ? " - Invoice " + s.invoiceId : "") + (label && label !== "-" ? " (" + label + ")" : ""), debit: Number(s.salePrice) || 0, credit: 0 });
    if (Number(s.paidAmount) || 0) entries.push({ date: s.date || "", desc: "Payment received at sale" + (s.invoiceId ? " - Invoice " + s.invoiceId : ""), debit: 0, credit: Number(s.paidAmount) || 0 });
    (s.installmentPayments || []).forEach(p => {
      const kind = p.type === "discount" ? "Discount / Waiver" : "Installment Payment";
      entries.push({ date: p.date || s.date || "", desc: kind + (p.month ? " (Month " + p.month + ")" : "") + (s.invoiceId ? " - Invoice " + s.invoiceId : ""), debit: 0, credit: Number(p.amount) || 0 });
    });
  });
  ((customer && customer.openingBalancePayments) || []).forEach(p => {
    const kind = p.type === "discount" ? "Opening Balance Waived" : "Opening Balance Payment";
    entries.push({ date: p.date || "", desc: kind + (p.manualReceiptNumber ? " (Receipt " + p.manualReceiptNumber + ")" : ""), debit: 0, credit: Number(p.amount) || 0 });
  });
  // Sale Return credited to the customer's ledger shows as a CREDIT, same as a payment. Cash
  // refunds are left out of the statement (the customer's balance didn't move — the shop's cash
  // did), but still show up in the Operations > Sale Return history for that customer.
  (data.saleReturns || []).filter(r => r.customerId === customerId && r.refundMethod === "ledger").forEach(r => {
    entries.push({ date: r.date || "", desc: "Sale Return credit" + (r.reason ? " (" + r.reason + ")" : ""), debit: 0, credit: Number(r.totalAmount) || 0 });
  });
  entries.sort((a, b) => (a.date || "").localeCompare(b.date || ""));
  let running = opening;
  const rows = entries.map(e => { running += e.debit - e.credit; return { ...e, balance: running }; });
  const totalDebit = entries.reduce((s, e) => s + e.debit, 0);
  const totalCredit = entries.reduce((s, e) => s + e.credit, 0);
  return { customer, opening, rows, totalDebit, totalCredit, closing: running };
}
/* Real vector/text PDF (jsPDF + autotable) of the statement above — soft red fill on DEBIT (due)
   rows, soft green fill on CREDIT (payment/waiver) rows, neutral fill on the Opening Balance row,
   matching the on-screen statement's color scheme. Returns the jsPDF doc so callers can either
   .save() it directly or .output("blob") it for the WhatsApp share button. */
function generateCustomerStatementPDF(biz, stmt) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "pt" });
  doc.setFontSize(14); doc.setTextColor(20); drawUrduSafeText(doc, biz.header || biz.name || "Shop ERP", 40, 40, 14, [20, 20, 20]);
  doc.setFontSize(10); doc.setTextColor(100);
  drawUrduSafeText(doc, [biz.address, biz.phone].filter(Boolean).join("  |  "), 40, 56, 10, [100, 100, 100]);
  doc.setFontSize(12); doc.setTextColor(30);
  doc.text("Customer Ledger Statement -", 40, 78);
  drawUrduSafeText(doc, stmt.customer ? stmt.customer.name : "", 40 + doc.getTextWidth("Customer Ledger Statement - "), 78, 12, [30, 30, 30]);
  doc.setFontSize(9); doc.setTextColor(120);
  doc.text([stmt.customer && stmt.customer.phone ? "Phone: " + stmt.customer.phone : "", stmt.customer && stmt.customer.cnic ? "CNIC: " + stmt.customer.cnic : "", "Generated: " + new Date().toLocaleString()].filter(Boolean).join("   |   "), 40, 92);

  const rowMeta = [{ type: "opening" }, ...stmt.rows.map(r => ({ type: r.debit > 0 ? "debit" : "credit" }))];
  const body = [["-", "Opening Balance", "-", "-", fmtMoney(stmt.opening)]];
  stmt.rows.forEach(r => body.push([fmtDate(r.date), r.desc, r.debit ? fmtMoney(r.debit) : "-", r.credit ? fmtMoney(r.credit) : "-", fmtMoney(r.balance)]));

  doc.autoTable(withUrduSafeCells({
    startY: 106,
    head: [["Date", "Description", "Debit (Due)", "Credit (Paid)", "Balance"]],
    body,
    styles: { fontSize: 8.5, cellPadding: 4 },
    headStyles: { fillColor: [79, 70, 229], textColor: 255 },
    columnStyles: { 2: { halign: "right" }, 3: { halign: "right" }, 4: { halign: "right" } },
    margin: { left: 40, right: 40 },
    didParseCell: (d) => {
      if (d.section !== "body") return;
      const meta = rowMeta[d.row.index];
      if (!meta) return;
      if (meta.type === "debit") d.cell.styles.fillColor = [254, 226, 226];
      else if (meta.type === "credit") d.cell.styles.fillColor = [220, 245, 231];
      else d.cell.styles.fillColor = [241, 245, 249];
    },
    foot: [["", "TOTAL", fmtMoney(stmt.totalDebit), fmtMoney(stmt.totalCredit), fmtMoney(stmt.closing)]],
    footStyles: { fillColor: [30, 41, 59], textColor: 255, fontStyle: "bold", halign: "right" },
  }));
  // Explicit "Net Outstanding Balance" summary box below the table — separate from the TOTAL row
  // in the table foot above, so it reads clearly on a printed/scanned copy even if the table foot
  // gets cut off across a page break.
  const boxY = (doc.lastAutoTable && doc.lastAutoTable.finalY ? doc.lastAutoTable.finalY : 106) + 16;
  const pageW = doc.internal.pageSize.getWidth();
  const boxW = 220, boxH = 34, boxX = pageW - 40 - boxW;
  doc.setFillColor(stmt.closing > 0 ? 254 : 220, stmt.closing > 0 ? 226 : 245, stmt.closing > 0 ? 226 : 231);
  doc.roundedRect(boxX, boxY, boxW, boxH, 4, 4, "F");
  doc.setFontSize(9); doc.setTextColor(80);
  doc.text("Net Outstanding Balance", boxX + 10, boxY + 14);
  doc.setFontSize(13); doc.setTextColor(stmt.closing > 0 ? 185 : 5, stmt.closing > 0 ? 28 : 122, stmt.closing > 0 ? 28 : 61);
  doc.text(fmtMoney(stmt.closing), boxX + 10, boxY + 28);
  return doc;
}
/* ---------- Receipt Settings (Business Settings -> Receipt Settings tab) ----------

/* Converts a data-URL image and/or PNG Blob to a shareable File and, where the browser supports
   the Web Share API with files (most Android/Chrome — this is exactly how WhatsApp accepts a
   pre-attached image), opens the native share sheet with WhatsApp as one of the options. Falls
   back to a plain download + a wa.me text link when file-sharing isn't supported (e.g. desktop
   browsers), since there is no cross-browser way to pre-attach an image into WhatsApp Web/Desktop
   from a webpage. */
async function shareOrDownloadImage(blob, filename, shareText) {
  try {
    const file = new File([blob], filename, { type: "image/png" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: filename, text: shareText || "" });
      return "shared";
    }
  } catch (e) { if (e.name === "AbortError") return "cancelled"; console.warn("Share failed, falling back to download:", e); }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  return "downloaded";
}
/* Generic counterpart to shareOrDownloadImage for non-image files (used by the Customer Ledger
   Statement PDF's "Share via WhatsApp" button below) — same Web Share API-with-files approach,
   same download+wa.me fallback for browsers that can't pre-attach a file (mainly desktop). */
async function shareOrDownloadFile(blob, filename, mimeType, shareText) {
  try {
    const file = new File([blob], filename, { type: mimeType });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: filename, text: shareText || "" });
      return "shared";
    }
  } catch (e) { if (e.name === "AbortError") return "cancelled"; console.warn("Share failed, falling back to download:", e); }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  return "downloaded";
}
