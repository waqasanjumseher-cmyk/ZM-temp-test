/* Google-Sheets-style "Saving... / All changes saved / Offline — will sync" indicator. Every edit
   is written to localStorage immediately regardless of network (that's the real source of truth —
   see the `saveJSON(DATA_KEY(...))` effect in App), so the app is always fully usable offline; this
   badge only reports the *additional*, optional cloud-backup layer on top of that. */
function relativeTime(iso) {
  if (!iso) return null;
  const sec = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 1000));
  if (sec < 10) return "just now";
  if (sec < 60) return sec + "s ago";
  const min = Math.round(sec / 60);
  if (min < 60) return min + "m ago";
  const hr = Math.round(min / 60);
  if (hr < 24) return hr + "h ago";
  return new Date(iso).toLocaleDateString();
}
function SyncStatusBadge({ isOnline, cloudStatus, compact }) {
  if (!CLOUD_ENABLED) {
    const label = isOnline ? "Online \u2014 saved on this device" : "Offline \u2014 saved on this device";
    return (
      <span className={"flex items-center gap-1.5 text-slate-500 " + (compact ? "text-[11px]" : "text-xs")} title={label}>
        <span className={"w-2 h-2 rounded-full " + (isOnline ? "bg-emerald-500" : "bg-slate-400")}></span>
        {!compact && label}
      </span>
    );
  }
  let label, dotClass;
  const st = cloudStatus.state;
  if (st === "signed-out") { label = "Saved on this device \u2014 sign in to sync to cloud"; dotClass = "bg-slate-400"; }
  else if (st === "offline-queued" || (!isOnline && st === "syncing")) { label = "Offline \u2014 changes queued, will sync automatically"; dotClass = "bg-amber-500"; }
  else if (st === "syncing" || st === "connecting") { label = "Syncing to cloud..."; dotClass = "bg-amber-500 animate-pulse"; }
  else if (st === "synced") { label = "All changes saved to cloud" + (cloudStatus.lastSyncedAt ? " \u00b7 " + relativeTime(cloudStatus.lastSyncedAt) : ""); dotClass = "bg-emerald-500"; }
  else if (st === "error") { label = "Cloud sync error \u2014 will retry automatically"; dotClass = "bg-rose-500"; }
  else { label = "Connecting..."; dotClass = "bg-slate-400"; }
  return (
    <span className={"flex items-center gap-1.5 text-slate-500 " + (compact ? "text-[11px]" : "text-xs")} title={label}>
      <span className={"w-2 h-2 rounded-full " + dotClass}></span>
      {!compact && label}
    </span>
  );
}
/* "Auto-backup active: Last saved at [time]" indicator — reflects the AUTO_BACKUP_KEY snapshot
   written by the debounced effect in App() every time `data` changes (new/updated sale, customer,
   purchase, payment, etc.). Separate from SyncStatusBadge above, which reports the optional cloud
   layer; this one is about the local JSON safety-net copy and is always active, cloud or not. */

      <span className={"w-2 h-2 rounded-full " + (known ? "bg-teal-500" : "bg-slate-400 animate-pulse")}></span>
      {!compact && label}

}

/* isDirty: pass true while the form inside this modal has unsaved changes. When set, backdrop

   changes?" confirmation instead of closing immediately. */
function Modal({ title, ur, onClose, children, wide, isDirty }) {
  const [confirmingClose, setConfirmingClose] = useState(false);
  function requestClose() {
    if (isDirty) { setConfirmingClose(true); return; }
    onClose();
  }
  useEffect(() => {
    function onKeyDown(e) { if (e.key === "Escape") { e.preventDefault(); requestClose(); } }
    document.addEventListener("keydown", onKeyDown);
    return () => document.removeEventListener("keydown", onKeyDown);
  }, [isDirty]);
  return (
    <div className="fixed inset-0 bg-black/40 z-50 flex items-start md:items-center justify-center p-2 md:p-6 overflow-y-auto" onClick={(e) => { if (e.target === e.currentTarget) requestClose(); }}>

          <h3 className="font-semibold text-slate-800">{title} {ur ? <span className="urdu text-slate-400 text-sm">/ {ur}</span> : null}</h3>
          <button onClick={requestClose} className="text-slate-400 hover:text-slate-700 text-xl leading-none">&times;</button>
        </div>
        <div className="p-5 max-h-[75vh] overflow-y-auto">{children}</div>
        {confirmingClose && (
          <div className="absolute inset-0 bg-black/40 rounded-xl flex items-center justify-center p-4 z-10">
            <div className="bg-white rounded-lg shadow-xl p-4 max-w-xs w-full text-center">
              <p className="text-sm text-slate-700 mb-1">You have unsaved changes. Discard?</p>
              <p className="text-xs text-slate-400 urdu mb-3">غیر محفوظ شدہ تبدیلیاں ہیں۔ ضائع کریں؟</p>

                <button onClick={() => { setConfirmingClose(false); onClose(); }} className="px-3 py-1.5 text-sm rounded-lg bg-rose-600 text-white hover:bg-rose-700">Discard</button>
              </div>
            </div>
          </div>
        )}

  );
}
/* Tracks whether a form's current value has changed since the modal opened. Pass the live form
   state and whether the modal is currently open (active); returns true once the JSON no longer
   matches the snapshot captured at open time. */
function useDirty(value, active) {
  const baseline = useRef(null);
  useEffect(() => { if (active) baseline.current = JSON.stringify(value); else baseline.current = null; }, [active]);
  if (!active || baseline.current === null) return false;
  return JSON.stringify(value) !== baseline.current;
}

/* Dependency-free inline SVG bar chart — no charting library/CDN needed, so Visual Analytics
   can't break on a missing script. `data` is [{ label, total }, ...]. */
function MiniBarChart({ data }) {
  const max = Math.max(1, ...data.map(d => d.total));
  const w = 320, h = 120, barGap = 8, barW = (w - barGap * (data.length - 1)) / data.length;
  return (
    <svg viewBox={"0 0 " + w + " " + h} className="w-full" style={{ maxWidth: 480 }}>
      {data.map((d, i) => {
        const barH = Math.max(2, (d.total / max) * (h - 24));
        const x = i * (barW + barGap);
        const y = h - 20 - barH;
        return (
          <g key={i}>
            <rect x={x} y={y} width={barW} height={barH} rx="3" fill="var(--accent-500)" />
            <text x={x + barW / 2} y={h - 6} textAnchor="middle" fontSize="9" fill="#94a3b8">{d.label}</text>
          </g>
        );
      })}
    </svg>
  );
}

/* Barcode/QR "Scan" button — feature-detects the browser BarcodeDetector API (Chrome/Edge,
   mostly Android + desktop Chromium; NOT in Safari/Firefox). Opens a small live camera view and
   calls onDetect(code) with the first value found. Falls back to a disabled button explaining
   why, so manual typing always still works regardless of browser support. */
function BarcodeScanButton({ onDetect }) {
  const [open, setOpen] = useState(false);
  const [error, setError] = useState("");
  const videoRef = useRef(null);
  const streamRef = useRef(null);
  const supported = typeof window !== "undefined" && "BarcodeDetector" in window;

  useEffect(() => {
    if (!open || !supported) return;
    let cancelled = false;
    let rafId = null;
    const detector = new window.BarcodeDetector();
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
      .then(stream => {
        if (cancelled) { stream.getTracks().forEach(t => t.stop()); return; }
        streamRef.current = stream;
        if (videoRef.current) { videoRef.current.srcObject = stream; videoRef.current.play(); }
        const tick = async () => {
          if (cancelled || !videoRef.current) return;
          try {
            const codes = await detector.detect(videoRef.current);
            if (codes && codes[0]) { onDetect(codes[0].rawValue); setOpen(false); return; }
          } catch (e) { /* keep trying — a bad frame isn't fatal */ }
          rafId = requestAnimationFrame(tick);
        };
        rafId = requestAnimationFrame(tick);
      })
      .catch(() => setError("Camera access was denied or unavailable."));
    return () => { cancelled = true; if (rafId) cancelAnimationFrame(rafId); if (streamRef.current) streamRef.current.getTracks().forEach(t => t.stop()); };
  }, [open, supported]);

  return (
    <>
      <button type="button" onClick={() => supported ? setOpen(true) : null} disabled={!supported}
        title={supported ? "Scan a barcode or QR code" : "Barcode scanning isn't supported in this browser — type the code in manually instead"}
        className={"text-xs px-2.5 py-1.5 rounded-lg border font-medium " + (supported ? "border-[var(--accent-300)] text-[var(--accent-700)] hover:bg-[var(--accent-50)]" : "border-slate-200 text-slate-300 cursor-not-allowed")}>
        {"\u{1F4F7}"} Scan
      </button>
      {open && (
        <Modal title="Scan Barcode / QR" onClose={() => setOpen(false)}>
          {error ? <div className="text-sm text-rose-600">{error}</div> : (
            <div>
              <video ref={videoRef} className="w-full rounded-lg bg-black" muted playsInline />
              <p className="text-xs text-slate-500 mt-2">Point the camera at a barcode or QR code — it'll fill in automatically once detected.</p>
            </div>
          )}
        </Modal>
      )}
    </>
  );
}

/* "Print via Bluetooth" — connects to an ESC/POS thermal printer over Web Bluetooth (Chrome/Edge
   only; no iOS Safari) and writes a plain-text receipt. Printer BLE service/characteristic UUIDs
   vary by manufacturer — 0xFFE0/0xFFE1 below is a common pattern for cheap ESC/POS printers, but
   isn't universal, so this may need its UUIDs adjusted for a specific printer model. */
function ThermalPrintButton({ getReceiptText }) {
  const [printing, setPrinting] = useState(false);
  const [error, setError] = useState("");
  const supported = typeof navigator !== "undefined" && !!navigator.bluetooth;

  async function handlePrint() {
    setError(""); setPrinting(true);
    try {
      const device = await navigator.bluetooth.requestDevice({
        filters: [{ services: ["0000ffe0-0000-1000-8000-00805f9b34fb"] }],
        optionalServices: ["0000ffe0-0000-1000-8000-00805f9b34fb"],
      });
      const server = await device.gatt.connect();
      const service = await server.getPrimaryService("0000ffe0-0000-1000-8000-00805f9b34fb");
      const characteristic = await service.getCharacteristic("0000ffe1-0000-1000-8000-00805f9b34fb");
      const encoder = new TextEncoder();
      const text = getReceiptText() + "\n\n\n";
      const bytes = encoder.encode(text);
      const CHUNK = 100; // most BLE printers need small writes, not one big blob
      for (let i = 0; i < bytes.length; i += CHUNK) {
        await characteristic.writeValue(bytes.slice(i, i + CHUNK));
      }
      device.gatt.disconnect();
    } catch (e) {
      setError((e && e.message) || "Couldn't connect to the printer. Make sure Bluetooth is on and the printer is powered/paired.");
    }
    setPrinting(false);
  }

  return (
    <div>
      <button type="button" onClick={handlePrint} disabled={!supported || printing}
        title={supported ? "" : "Web Bluetooth isn't supported in this browser (needs Chrome/Edge)"}
        className={"text-xs px-3 py-1.5 rounded-lg border font-medium " + (supported ? "border-[var(--accent-300)] text-[var(--accent-700)] hover:bg-[var(--accent-50)]" : "border-slate-200 text-slate-300 cursor-not-allowed")}>
        {"\u{1F5A8}\uFE0F"} {printing ? "Connecting..." : "Print via Bluetooth"}
      </button>
      {error && <div className="text-xs text-rose-500 mt-1">{error}</div>}
    </div>
  );
}

/* Generic pager: caller owns `page`/`pageSize` state and slices its own rows with it (see

  const from = total === 0 ? 0 : (allMode ? 1 : (page - 1) * pageSize + 1);
  const to = allMode ? total : Math.min(total, page * pageSize);

  // even with hundreds of pages of imported customers.
  const pageNumbers = useMemo(() => {
    const nums = [];
    const add = n => { if (n >= 1 && n <= totalPages && !nums.includes(n)) nums.push(n); };
    add(1); add(totalPages);
    for (let n = page - 1; n <= page + 1; n++) add(n);
    return nums.sort((a, b) => a - b);
  }, [page, totalPages]);
  if (total === 0) return null;
  return (
    <div className="flex flex-wrap items-center justify-between gap-3 px-3 py-2.5 border-t border-slate-100 text-sm">
      <div className="text-slate-500 text-xs">Showing {from}-{to} of {total} items{allMode ? " (all shown)" : ""}</div>

        </div>
        {!allMode && (
        <div className="flex items-center gap-1">
          <button onClick={() => onPage(Math.max(1, page - 1))} disabled={page <= 1} className="px-2.5 py-1.5 rounded-lg border border-slate-200 text-xs text-slate-600 disabled:opacity-40 disabled:cursor-not-allowed hover:bg-slate-50">&larr; Prev</button>
          <span className="text-xs text-slate-500 px-1 whitespace-nowrap">Page {page} of {totalPages}</span>
          {pageNumbers.map((n, i) => (
            <React.Fragment key={n}>
              {i > 0 && pageNumbers[i - 1] !== n - 1 && <span className="px-1 text-slate-300">&hellip;</span>}
              <button onClick={() => onPage(n)} className={"min-w-[28px] px-2 py-1.5 rounded-lg text-xs " + (n === page ? "bg-[var(--accent-600)] text-[var(--button-text)] font-medium" : "border border-slate-200 text-slate-600 hover:bg-slate-50")}>{n}</button>
            </React.Fragment>

          <button onClick={() => onPage(Math.min(totalPages, page + 1))} disabled={page >= totalPages} className="px-2.5 py-1.5 rounded-lg border border-slate-200 text-xs text-slate-600 disabled:opacity-40 disabled:cursor-not-allowed hover:bg-slate-50">Next &rarr;</button>
        </div>

  );
}
/* Pairs with Pagination: owns page/pageSize state, clamps page back in range whenever `rows`

function usePagedRows(rows, defaultPageSize = 25) {

    return rows.slice(start, start + pageSize);
